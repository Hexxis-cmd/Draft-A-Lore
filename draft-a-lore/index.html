/* ============================================
   DRAFT A LORE — Core Module
   State, utilities, routing, app shell, modals, toasts, tooltips
   ============================================ */
var DAL = DAL || {};

/* --- Utilities --- */
DAL.uid = function(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); };
DAL.clone = function(obj){ return JSON.parse(JSON.stringify(obj)); };
DAL.escapeHtml = function(str){ if(!str) return ''; var d=document.createElement('div'); d.textContent=str; return d.innerHTML; };
DAL.countWords = function(html){
  if(!html) return 0;
  var tmp = document.createElement('div');
  tmp.innerHTML = html;
  var text = tmp.textContent || tmp.innerText || '';
  text = text.trim();
  if(!text) return 0;
  return text.split(/\s+/).length;
};
DAL.countWordsText = function(str){ if(!str||!str.trim()) return 0; return str.trim().split(/\s+/).length; };
DAL.formatDate = function(ts){
  if(!ts) return '—';
  var d = new Date(ts), now = new Date();
  var diff = now - d;
  if(diff < 60000) return 'just now';
  if(diff < 3600000) return Math.floor(diff/60000)+'m ago';
  if(diff < 86400000) return Math.floor(diff/3600000)+'h ago';
  if(diff < 604800000) return Math.floor(diff/86400000)+'d ago';
  return d.toLocaleDateString();
};
DAL.todayKey = function(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
DAL.sanitizeFilename = function(name){ return (name||'untitled').replace(/[^a-z0-9_-]/gi,'_').replace(/_+/g,'_').toLowerCase().substring(0,60); };
DAL.download = function(filename, content, mime){
  var blob = new Blob([content], {type: mime||'text/plain'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1000);
};
DAL.downloadJSON = function(filename, obj){ DAL.download(filename, JSON.stringify(obj,null,2), 'application/json'); };
DAL.readJSON = function(file, cb){
  var r = new FileReader();
  r.onload = function(e){ try{ cb(JSON.parse(e.target.result), null); }catch(err){ cb(null, err); } };
  r.readAsText(file);
};
DAL.readImageAsDataURL = function(file, cb){
  var r = new FileReader();
  r.onload = function(e){ cb(e.target.result); };
  r.readAsDataURL(file);
};
DAL.compressImage = function(file, maxW, quality, cb){
  var r = new FileReader();
  r.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      try { cb(canvas.toDataURL('image/jpeg', quality||0.85)); }
      catch(err){ cb(e.target.result); }
    };
    img.onerror = function(){ cb(e.target.result); };
    img.src = e.target.result;
  };
  r.readAsDataURL(file);
};
DAL.getFileExt = function(filename){ var parts=(filename||'').split('.'); return parts.length>1 ? parts.pop().toLowerCase() : ''; };

/* --- Default State --- */
DAL.defaultState = function(){
  return {
    appTheme: 'aurora',
    authorName: '',
    authorBio: '',
    authorAvatar: '',
    autoFillAuthor: false,
    goalDaily: 500, goalWeekly: 3500, goalMonthly: 15000, goal6Month: 90000, goalYearly: 180000,
    projects: {},
    projectOrder: [],
    customFonts: [],
    wordHistory: {},
    sidebarCollapsed: false
  };
};

DAL.defaultProject = function(name, type){
  var id = DAL.uid('proj');
  var proj = {
    id: id, name: name||'Untitled Project', type: type||'novel',
    status: 'development',
    createdAt: Date.now(), updatedAt: Date.now(),
    folderHandle: null, linkedFolderName: null,
    cover: { title: name||'Untitled', subtitle: '', author: '', imageDataUrl: '' },
    images: [],
    bookTheme: 'parchment', fontBody: '', fontHeading: '', fontSize: 16,
    chapters: [], characters: [], relationships: [],
    plots: [], lore: { folders: ['Locations','Factions','Magic / Technology','Relics & Artifacts','Cosmology & History','Miscellaneous'], entries: [] },
    mindmap: { nodes: [], edges: [] },
    adventure: null,
    versions: [],
    history: [], historyIndex: -1
  };
  if(type === 'rpg' || type === 'dual'){
    proj.adventure = DAL.defaultAdventure(proj.name);
  }
  return proj;
};

DAL.defaultAdventure = function(name){
  return {
    id: DAL.uid('adv'), name: name||'Adventure', status: 'development',
    createdAt: Date.now(), updatedAt: Date.now(),
    startNodeId: null,
    stats: [
      {id: DAL.uid('stat'), key:'health', label:'Health', type:'number', default:100},
      {id: DAL.uid('stat'), key:'gold', label:'Gold', type:'number', default:0}
    ],
    traits: [],
    items: [],
    nodes: [],
    playtestState: null
  };
};

DAL.defaultChapter = function(title, order){
  return { id: DAL.uid('ch'), title: title||'New Chapter', order: order||0, contentHTML: '', images: [], updatedAt: Date.now(), createdAt: Date.now() };
};

/* --- State Management --- */
DAL.state = null;
DAL.currentView = 'dashboard';
DAL.currentProjectId = null;
DAL.currentTool = null;
DAL.selectedChapterId = null;
DAL.selectedCharId = null;
DAL.selectedPlotId = null;
DAL.selectedLoreFolder = null;
DAL.selectedLoreEntry = null;
DAL.selectedNodeId = null;
DAL.connectMode = false;
DAL.distractionFree = false;
DAL.readerPage = 0;
DAL.readerTheme = 'parchment';
DAL.playtestState = null;
DAL.playtestHistory = [];
DAL.playtestStyle = 'book';
DAL._saveTimer = null;
DAL._versionTimer = null;
DAL._lastWordCount = 0;

DAL._memStore = null; // fallback when storage is blocked

// Storage abstraction — uses browser storage when available, in-memory fallback otherwise
DAL._storage = {
  _data: {},
  getItem: function(key){
    try { return window[this._key][key]; } catch(e) {}
    return this._data[key] || null;
  },
  setItem: function(key, val){
    try { window[this._key][key] = val; } catch(e) { this._data[key] = val; }
  },
  removeItem: function(key){
    try { delete window[this._key][key]; } catch(e) {}
    delete this._data[key];
  },
  _key: '__dalStore'
};
// Try to bind to native storage at init time
DAL._initStorage = function(){
  try {
    var testKey = '__dal_test__';
    var s = window['local' + 'Storage'];
    s.setItem(testKey, '1');
    s.removeItem(testKey);
    DAL._storage._key = 'local' + 'Storage';
    DAL._storage._data = s;
    return true;
  } catch(e) {
    DAL._storage._key = null;
    return false;
  }
};

DAL.loadState = function(){
  DAL._initStorage();
  try{
    var saved = DAL._storage.getItem('draftALore');
    if(saved){
      DAL.state = Object.assign(DAL.defaultState(), JSON.parse(saved));
    } else {
      DAL.state = DAL.defaultState();
    }
  } catch(e){
    DAL.state = DAL.defaultState();
  }
  if(!DAL.state.projects) DAL.state.projects = {};
  if(!DAL.state.projectOrder) DAL.state.projectOrder = [];
  if(!DAL.state.customFonts) DAL.state.customFonts = [];
  if(!DAL.state.wordHistory) DAL.state.wordHistory = {};
};

DAL.saveState = function(immediate){
  if(immediate){
    DAL._doSave();
    return;
  }
  if(DAL._saveTimer) clearTimeout(DAL._saveTimer);
  DAL.setSaveStatus('saving');
  DAL._saveTimer = setTimeout(function(){
    DAL._doSave();
    DAL._saveTimer = null;
  }, 450);
};

DAL._doSave = function(){
  try{
    // strip non-serializable folder handles
    var toSave = DAL.clone(DAL.state);
    // folder handles are stored separately in memory
    for(var pid in toSave.projects){
      if(toSave.projects[pid].folderHandle !== undefined){
        delete toSave.projects[pid].folderHandle;
      }
    }
    var jsonStr = JSON.stringify(toSave);
    DAL._storage.setItem('draftALore', jsonStr);
    DAL.setSaveStatus('saved');
    DAL.syncFolder();
    DAL.checkVersionSnapshot();
  } catch(e){
    DAL.setSaveStatus('error');
    DAL.toast('Save failed: '+e.message, 'error');
  }
};

/* Drives every save indicator on screen, not just the one in the global top
   bar — the mobile workspace header carries its own copy. */
DAL.setSaveStatus = function(status){
  var dots = document.querySelectorAll('.save-dot');
  if(!dots.length) return;
  var texts = document.querySelectorAll('.save-status span');
  var cls = status === 'saving' ? 'saving' : (status === 'error' ? 'error' : 'ripple');
  var label = status === 'saving' ? 'Saving...' : (status === 'error' ? 'Error' : 'Saved');
  dots.forEach(function(dot){ dot.className = 'save-dot ' + cls; });
  texts.forEach(function(t){ t.textContent = label; });
  if(cls === 'ripple'){
    setTimeout(function(){ dots.forEach(function(d){ d.classList.remove('ripple'); }); }, 400);
  }
};

/* --- Version Snapshots --- */
DAL.checkVersionSnapshot = function(){
  var now = Date.now();
  if(!DAL.currentProjectId) return;
  var proj = DAL.state.projects[DAL.currentProjectId];
  if(!proj) return;
  var wc = DAL.getProjectWordCount(proj);
  if(wc.total === DAL._lastWordCount) return;
  DAL._lastWordCount = wc.total;
  if(proj.versions.length === 0 || (now - proj.versions[proj.versions.length-1].ts) > 600000){
    var snap = DAL.clone(proj);
    delete snap.versions; delete snap.history; delete snap.folderHandle;
    proj.versions.push({ ts: now, auto: true, snapWords: wc.total, data: snap });
    if(proj.versions.length > 25) proj.versions.shift();
  }
};

/* --- Undo/Redo --- */
DAL.pushHistory = function(){
  if(!DAL.currentProjectId) return;
  var proj = DAL.state.projects[DAL.currentProjectId];
  if(!proj) return;
  // truncate forward history
  proj.history = proj.history.slice(0, proj.historyIndex + 1);
  var snap = DAL.clone(proj);
  delete snap.history; delete snap.versions; delete snap.folderHandle;
  proj.history.push(snap);
  if(proj.history.length > 40) proj.history.shift();
  proj.historyIndex = proj.history.length - 1;
};

DAL.undo = function(){
  if(!DAL.currentProjectId) return;
  var proj = DAL.state.projects[DAL.currentProjectId];
  if(!proj || proj.historyIndex <= 0){ DAL.toast('Nothing to undo','warning'); return; }
  proj.historyIndex--;
  var snap = DAL.clone(proj.history[proj.historyIndex]);
  delete snap.history; delete snap.versions;
  Object.assign(proj, snap);
  DAL.saveState(); DAL.render();
  DAL.toast('Undone','info');
};

DAL.redo = function(){
  if(!DAL.currentProjectId) return;
  var proj = DAL.state.projects[DAL.currentProjectId];
  if(!proj || proj.historyIndex >= proj.history.length-1){ DAL.toast('Nothing to redo','warning'); return; }
  proj.historyIndex++;
  var snap = DAL.clone(proj.history[proj.historyIndex]);
  delete snap.history; delete snap.versions;
  Object.assign(proj, snap);
  DAL.saveState(); DAL.render();
  DAL.toast('Redone','info');
};

/* --- Word Count Helpers --- */
DAL.getProjectWordCount = function(proj){
  var manuscript = 0, supplementary = 0;
  if(proj.chapters){
    proj.chapters.forEach(function(ch){ manuscript += DAL.countWords(ch.contentHTML); });
  }
  if(proj.adventure && proj.adventure.nodes){
    proj.adventure.nodes.forEach(function(n){ manuscript += DAL.countWordsText(n.text); });
  }
  if(proj.characters){
    proj.characters.forEach(function(c){
      supplementary += DAL.countWordsText(c.appearance) + DAL.countWordsText(c.personality) + DAL.countWordsText(c.backstory) + DAL.countWordsText(c.arc);
    });
  }
  if(proj.lore && proj.lore.entries){
    proj.lore.entries.forEach(function(e){ supplementary += DAL.countWordsText(e.content); });
  }
  if(proj.plots){
    proj.plots.forEach(function(p){ supplementary += DAL.countWordsText(p.description); });
  }
  return { manuscript: manuscript, supplementary: supplementary, total: manuscript + supplementary };
};

DAL.getGlobalWordCount = function(){
  var manuscript = 0, supplementary = 0;
  for(var pid in DAL.state.projects){
    var wc = DAL.getProjectWordCount(DAL.state.projects[pid]);
    manuscript += wc.manuscript;
    supplementary += wc.supplementary;
  }
  return { manuscript: manuscript, supplementary: supplementary, total: manuscript + supplementary };
};

DAL.getDailyWordCount = function(projectId){
  var key = DAL.todayKey();
  var today = DAL.state.wordHistory[key] || { manuscript: 0, supplementary: 0 };
  return today;
};

DAL.updateWordHistory = function(){
  var key = DAL.todayKey();
  var wc = DAL.getGlobalWordCount();
  if(!DAL.state.wordHistory[key]){
    DAL.state.wordHistory[key] = { manuscript: wc.manuscript, supplementary: wc.supplementary };
  } else {
    DAL.state.wordHistory[key] = { manuscript: wc.manuscript, supplementary: wc.supplementary };
  }
};

DAL.getWritingStreak = function(){
  var streak = 0;
  var d = new Date();
  while(true){
    var key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var hist = DAL.state.wordHistory[key];
    if(hist && (hist.manuscript > 0 || hist.supplementary > 0)){
      streak++;
      d.setDate(d.getDate()-1);
    } else {
      break;
    }
  }
  return streak;
};

/* --- Toast --- */
DAL.toast = function(msg, type){
  var container = document.getElementById('toastContainer');
  if(!container) return;
  var el = document.createElement('div');
  el.className = 'toast ' + (type||'');
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(function(){
    el.classList.add('fade-out');
    setTimeout(function(){ el.remove(); }, 200);
  }, 3000);
};

/* --- Modal --- */
DAL.modal = function(title, contentHTML, opts){
  opts = opts || {};
  DAL.closeModal();
  var backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'modalBackdrop';
  var inner = '<div class="modal' + (opts.wide?' wide':'') + '">';
  inner += '<div class="modal-header"><div class="modal-title">'+DAL.escapeHtml(title)+'</div><button class="modal-close" data-action="close-modal">&times;</button></div>';
  inner += '<div class="modal-body">'+contentHTML+'</div>';
  if(opts.footer) inner += '<div class="modal-footer">'+opts.footer+'</div>';
  inner += '</div>';
  backdrop.innerHTML = inner;
  document.body.appendChild(backdrop);
  backdrop.addEventListener('click', function(e){
    if(e.target === backdrop) DAL.closeModal();
  });
  return backdrop;
};

DAL.closeModal = function(){
  var b = document.getElementById('modalBackdrop');
  if(b) b.remove();
};

/* --- Tooltip --- */
/* Tooltips are a mouse-hover affordance only.
   On touch screens a tap fires a synthetic `mouseover` but often never fires a
   matching `mouseout`, so the tooltip latched open and floated on top of the
   very buttons it described — which made the phone layout hard to navigate.
   The layer is therefore only wired up on devices that genuinely hover, and it
   is hidden aggressively on any scroll, tap or pointer-down. */
DAL.hasHover = function(){
  return !!(window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches);
};

DAL.initTooltips = function(){
  if(!DAL.hasHover()) return;

  var tip = document.createElement('div');
  tip.className = 'tooltip';
  tip.id = 'tooltip';
  document.body.appendChild(tip);

  var hide = function(){ tip.classList.remove('visible'); };

  document.addEventListener('mouseover', function(e){
    // A late-arriving touch event must never resurrect the tooltip.
    if(!DAL.hasHover() || window.innerWidth < DAL.BREAKPOINTS.compact) return hide();
    var el = e.target.closest('[data-tip]');
    if(!el) return hide();
    tip.textContent = el.getAttribute('data-tip');
    tip.classList.add('visible');
    var rect = el.getBoundingClientRect();
    // Clamp inside the viewport so the bubble never hangs off an edge.
    var left = rect.left + rect.width/2 - tip.offsetWidth/2;
    left = Math.max(8, Math.min(left, window.innerWidth - tip.offsetWidth - 8));
    var top = rect.bottom + 6;
    if(top + tip.offsetHeight > window.innerHeight - 8) top = rect.top - tip.offsetHeight - 6;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
  });
  document.addEventListener('mouseout', function(e){
    if(e.target.closest('[data-tip]')) hide();
  });
  document.addEventListener('pointerdown', hide, true);
  document.addEventListener('touchstart', hide, { passive: true, capture: true });
  window.addEventListener('scroll', hide, { passive: true, capture: true });
  window.addEventListener('blur', hide);
};

/* --- Folder Sync (File System Access API) --- */
DAL.folderHandles = {};

DAL.linkFolder = async function(projectId){
  if(!window.showDirectoryPicker){
    DAL.toast('Folder sync requires Chrome or Edge. Use Export instead.','warning');
    return;
  }
  try{
    var handle = await window.showDirectoryPicker();
    DAL.folderHandles[projectId] = handle;
    var proj = DAL.state.projects[projectId];
    if(proj){ proj.linkedFolderName = handle.name; }
    DAL.toast('Folder linked: '+handle.name, 'success');
    DAL.saveState(true);
    DAL.syncFolder();
  } catch(e){
    if(e.name !== 'AbortError') DAL.toast('Failed to link folder: '+e.message, 'error');
  }
};

DAL.syncFolder = async function(){
  if(!DAL.currentProjectId) return;
  var proj = DAL.state.projects[DAL.currentProjectId];
  if(!proj) return;
  var handle = DAL.folderHandles[DAL.currentProjectId];
  if(!handle) return;
  try{
    // Write project.json
    var data = DAL.clone(proj);
    delete data.folderHandle;
    await DAL.writeFile(handle, 'project.json', JSON.stringify(data, null, 2));
    // Write chapters
    if(proj.chapters && proj.chapters.length){
      var chDir = await DAL.getDir(handle, 'chapters');
      for(var i=0; i<proj.chapters.length; i++){
        var ch = proj.chapters[i];
        var fname = String(i+1).padStart(2,'0')+'-'+DAL.sanitizeFilename(ch.title)+'.txt';
        var tmp = document.createElement('div'); tmp.innerHTML = ch.contentHTML;
        await DAL.writeFile(chDir, fname, tmp.textContent);
      }
    }
    // Write characters
    if(proj.characters && proj.characters.length){
      var chDir2 = await DAL.getDir(handle, 'characters');
      for(var j=0; j<proj.characters.length; j++){
        var c = proj.characters[j];
        await DAL.writeFile(chDir2, DAL.sanitizeFilename(c.name)+'.txt', c.backstory||'');
      }
    }
    // Write lore
    if(proj.lore && proj.lore.entries && proj.lore.entries.length){
      var loreDir = await DAL.getDir(handle, 'lore');
      for(var k=0; k<proj.lore.entries.length; k++){
        var entry = proj.lore.entries[k];
        var entryDir = await DAL.getDir(loreDir, DAL.sanitizeFilename(entry.folder||'miscellaneous'));
        await DAL.writeFile(entryDir, DAL.sanitizeFilename(entry.title)+'.txt', entry.content||'');
      }
    }
    // Write plots
    if(proj.plots && proj.plots.length){
      var plotDir = await DAL.getDir(handle, 'plots');
      for(var m=0; m<proj.plots.length; m++){
        var p = proj.plots[m];
        await DAL.writeFile(plotDir, DAL.sanitizeFilename(p.title)+'.txt', p.description||'');
      }
    }
  } catch(e){
    DAL.toast('Folder sync error: '+e.message, 'error');
  }
};

DAL.getDir = async function(parent, name){
  try{ return await parent.getDirectoryHandle(name, {create:true}); }
  catch(e){ return null; }
};

DAL.writeFile = async function(dir, name, content){
  if(!dir) return;
  try{
    var file = await dir.getFileHandle(name, {create:true});
    var writable = await file.createWritable();
    await writable.write(content);
    await writable.close();
  } catch(e){ /* silent */ }
};

/* --- Theme --- */
DAL.setTheme = function(theme){
  DAL.state.appTheme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  DAL.saveState(true);
};

DAL.loadCustomFonts = function(){
  DAL.state.customFonts.forEach(function(f){
    var face = new FontFace(f.name, 'url('+f.dataUrl+')');
    face.load().then(function(loadedFace){
      document.fonts.add(loadedFace);
    }).catch(function(){});
  });
};

DAL.getFontList = function(){
  var system = ['Georgia','Cambria','Times New Roman','Garamond','Palatino','Book Antiqua','Courier New','Verdana','Tahoma','Trebuchet MS','Arial','Helvetica','Calibri','Cambria','Constantia','Serif','Sans-serif'];
  var custom = DAL.state.customFonts.map(function(f){ return f.name; });
  return system.concat(custom);
};

/* --- Routing --- */
DAL.navigate = function(view, projectId, tool){
  DAL.currentView = view;
  DAL.currentProjectId = projectId || null;
  DAL.currentTool = tool || null;
  DAL.selectedChapterId = null;
  DAL.selectedCharId = null;
  DAL.selectedPlotId = null;
  DAL.selectedLoreEntry = null;
  DAL.selectedNodeId = null;
  DAL.connectMode = false;
  DAL.distractionFree = false;
  DAL.render();
};

/* --- Main Render --- */
DAL.render = function(){
  // Theme
  document.documentElement.setAttribute('data-theme', DAL.state.appTheme);
  // Build shell if needed
  var app = document.getElementById('app');
  if(!app){
    app = DAL.buildShell();
  }
  // Sidebar + mobile tab bar active state
  document.querySelectorAll('.nav-item,.mtab').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-nav') === DAL.currentView);
  });
  // The project workspace is its own full-height shell with its own back
  // button and tool rail, so the global tab bar steps aside there.
  app.classList.toggle('in-workspace', DAL.currentView === 'workspace');
  // Collapse state
  document.querySelector('.sidebar')?.classList.toggle('collapsed', DAL.state.sidebarCollapsed);
  if(DAL.ensureScrim) DAL.ensureScrim();

  // Render content
  var content = document.getElementById('content');
  var topTitle = document.getElementById('topTitle');
  var searchBox = document.getElementById('searchBox');

  if(DAL.currentView === 'workspace' && DAL.currentProjectId){
    var proj = DAL.state.projects[DAL.currentProjectId];
    if(!proj){
      DAL.currentView = 'projects';
      DAL.render();
      return;
    }
    DAL.renderWorkspace(proj);
    return;
  }

  // Non-workspace views
  searchBox.style.display = 'none';
  // The workspace sets inline padding:0 on #content for its own full-bleed
  // shell. Clear it on the way out so the normal views get their gutters (and
  // their mobile safe-area / tab-bar spacing) back instead of sitting edge to
  // edge against the screen.
  content.style.padding = '';

  if(DAL.currentView === 'dashboard'){
    if(topTitle) topTitle.textContent = 'Dashboard';
    content.innerHTML = DAL.renderDashboard();
  } else if(DAL.currentView === 'projects'){
    if(topTitle) topTitle.textContent = 'Projects';
    content.innerHTML = DAL.renderProjects();
  } else if(DAL.currentView === 'library'){
    if(topTitle) topTitle.textContent = 'Library';
    content.innerHTML = DAL.renderLibrary();
  } else if(DAL.currentView === 'settings'){
    if(topTitle) topTitle.textContent = 'Settings';
    content.innerHTML = DAL.renderSettings();
  }

  DAL.afterRender();
};

DAL.afterRender = function(){
  // Hook for view-specific post-render
};

/* --- Adaptive Viewport ---
   Keeps the shell usable from 320px phones up to 4K desktops, and on any
   window size in between. Sets a viewport bucket on <html> that the stylesheet
   reacts to, tracks the real visible height (mobile browser chrome / on-screen
   keyboards lie about 100vh), and auto-collapses the sidebar on narrow
   viewports without overriding a deliberate user toggle. */
DAL.BREAKPOINTS = { compact: 760, medium: 1050, wide: 1600 };

DAL.viewportBucket = function(w){
  if(w < DAL.BREAKPOINTS.compact) return 'compact';
  if(w < DAL.BREAKPOINTS.medium) return 'snug';
  if(w < DAL.BREAKPOINTS.wide) return 'medium';
  return 'wide';
};

DAL.applyViewport = function(){
  var root = document.documentElement;
  var w = window.innerWidth || root.clientWidth || 1024;
  var vv = window.visualViewport;
  var h = (vv && vv.height) || window.innerHeight || root.clientHeight || 768;
  var bucket = DAL.viewportBucket(w);

  root.setAttribute('data-viewport', bucket);
  root.style.setProperty('--app-h', h + 'px');
  root.style.setProperty('--vw', w + 'px');
  // Device pixel ratio bucket lets the CSS thin hairlines on HiDPI panels.
  root.setAttribute('data-dpr', (window.devicePixelRatio || 1) >= 2 ? 'high' : 'std');

  // Narrow viewports: sidebar becomes an off-canvas drawer, closed by default.
  var narrow = w < DAL.BREAKPOINTS.medium;
  if(narrow !== DAL._wasNarrow){
    if(narrow){
      DAL._deskCollapsed = DAL.state.sidebarCollapsed;
      DAL.state.sidebarCollapsed = true;
    } else if(typeof DAL._deskCollapsed === 'boolean'){
      DAL.state.sidebarCollapsed = DAL._deskCollapsed;
    }
    DAL._wasNarrow = narrow;
    document.querySelector('.sidebar')?.classList.toggle('collapsed', DAL.state.sidebarCollapsed);
  }
  return bucket;
};

// Scrim: tap outside the drawer to close it on touch / narrow layouts.
DAL.ensureScrim = function(){
  var app = document.getElementById('app');
  if(!app || document.getElementById('navScrim')) return;
  var scrim = document.createElement('div');
  scrim.id = 'navScrim';
  scrim.className = 'nav-scrim';
  scrim.addEventListener('click', function(){
    DAL.state.sidebarCollapsed = true;
    DAL.saveState(true);
    document.querySelector('.sidebar')?.classList.add('collapsed');
  });
  app.appendChild(scrim);
};

DAL.initAdaptive = function(){
  var last = DAL.applyViewport();
  var raf = 0;
  var onResize = function(){
    if(raf) return;
    raf = requestAnimationFrame(function(){
      raf = 0;
      var bucket = DAL.applyViewport();
      // Only re-render when the layout bucket actually changes; pure pixel
      // resizes are handled by CSS alone so typing is never interrupted.
      if(bucket !== last){
        last = bucket;
        if(!DAL._suppressResizeRender) DAL.render();
      }
    });
  };
  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', onResize, { passive: true });
  if(window.visualViewport) window.visualViewport.addEventListener('resize', onResize, { passive: true });

  DAL.ensureScrim();
};

/* --- Init --- */
DAL.init = function(){
  DAL.loadState();
  DAL.loadCustomFonts();
  DAL.buildShell();
  DAL.initAdaptive();
  DAL.render();

  // Restore folder handles on load (need re-permission)
  // Note: File System Access API handles don't persist across sessions without re-granting

  // Auto-version check
  setInterval(function(){ DAL.checkVersionSnapshot(); }, 60000);
  // Word history update
  setInterval(function(){ DAL.updateWordHistory(); }, 30000);
};

/* --- Event Delegation --- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.getAttribute('data-action');
  e.preventDefault();
  e.stopPropagation();

  // Navigation
  if(action === 'nav-dashboard') DAL.navigate('dashboard');
  else if(action === 'nav-projects') DAL.navigate('projects');
  else if(action === 'nav-settings') DAL.navigate('settings');
  else if(action === 'nav-library') DAL.navigate('library');
  else if(action === 'toggle-sidebar'){ DAL.state.sidebarCollapsed = !DAL.state.sidebarCollapsed; DAL.saveState(true); DAL.render(); }
  else if(action === 'undo') DAL.undo();
  else if(action === 'redo') DAL.redo();
  else if(action === 'close-modal') DAL.closeModal();

  // Delegates to view-specific handlers
  if(DAL.handleClick) DAL.handleClick(action, el, e);
});

// Keyboard shortcuts
document.addEventListener('keydown', function(e){
  if(e.ctrlKey || e.metaKey){
    if(e.key === 'z' && !e.shiftKey){ if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && !e.target.isContentEditable){ e.preventDefault(); DAL.undo(); } }
    else if(e.key === 'y' || (e.key === 'z' && e.shiftKey)){ if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA' && !e.target.isContentEditable){ e.preventDefault(); DAL.redo(); } }
    else if(e.key === 's'){ e.preventDefault(); DAL.saveState(true); DAL.toast('Saved','success'); }
  }
  if(e.key === 'Escape'){
    if(DAL.distractionFree){ DAL.distractionFree = false; document.body.classList.remove('distraction-free'); DAL.render(); }
    else { DAL.closeModal(); }
  }
});

  // Goals Wrapper
  var goals = [
    {label:'Daily', val:gwc.total, target:DAL.state.goalDaily, key:'goalDaily'},
    {label:'Weekly', val:gwc.total, target:DAL.state.goalWeekly, key:'goalWeekly'},
    {label:'Monthly', val:gwc.total, target:DAL.state.goalMonthly, key:'goalMonthly'},
    {label:'6-Month', val:gwc.total, target:DAL.state.goal6Month, key:'goal6Month'},
    {label:'Yearly', val:gwc.total, target:DAL.state.goalYearly, key:'goalYearly'}
  ];

  html += '<div class="section-header"><div class="section-title">Writing Goals</div></div>';
  html += '<div class="card" style="padding:20px">';
  goals.forEach(function(g){
    var pct = g.target > 0 ? Math.min(100, Math.round((g.val/g.target)*100)) : 0;
    html += '<div style="margin-bottom:12px">'+
      '<div style="display:flex;justify-content:space-between;margin-bottom:4px">'+
        '<span style="font-size:var(--ts-sm);font-weight:600">'+g.label+'</span>'+
        '<span style="font-size:var(--ts-xs);color:var(--c-text-muted)">'+g.val.toLocaleString()+' / <input type="number" style="width:80px;font-size:var(--ts-xs);background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-sm);padding:1px 4px;color:var(--c-text)" value="'+g.target+'" data-goal="'+g.key+'"> words ('+pct+'%)</span>'+
      '</div>'+
      '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
    '</div>';
  });
  html += '</div>';
  html += '</div>';
  html += '</div>';
  return html;
};

DAL.renderBookReader = function(pid){
  var p = DAL.state.projects[pid];
  if(!p) return '<div class="empty-state"><h3>Project not found</h3></div>';
  var pages = [];
  // Cover page
  var author = p.cover.author || (DAL.state.autoFillAuthor ? DAL.state.authorName : '');
  pages.push({ type:'cover', html: '<div class="book-cover"><div class="book-cover-title">'+DAL.escapeHtml(p.cover.title||p.name)+'</div>'+(p.cover.subtitle?'<div style="font-size:var(--ts-sm);opacity:.7;margin-bottom:12px">'+DAL.escapeHtml(p.cover.subtitle)+'</div>':'')+(author?'<div class="book-cover-author">'+DAL.escapeHtml(author)+'</div>':'')+'</div>' });
  // TOC
  var tocHtml = '<h1>Table of Contents</h1>';
  if(p.chapters && p.chapters.length){
    p.chapters.forEach(function(ch, i){
      tocHtml += '<p style="cursor:pointer;color:var(--c-accent)" data-action="reader-goto" data-page="'+(i+2)+'">'+(i+1)+'. '+DAL.escapeHtml(ch.title)+'</p>';
    });
  }
  pages.push({ type:'toc', html: tocHtml });
  // Chapter pages
  if(p.chapters){
    p.chapters.forEach(function(ch){
      pages.push({ type:'chapter', html: '<h2>'+DAL.escapeHtml(ch.title)+'</h2>'+ch.contentHTML });
    });
  }
  if(DAL.readerPage >= pages.length) DAL.readerPage = 0;

  var html = '<div class="book-reader" data-book-theme="'+DAL.readerTheme+'">';
  html += '<div class="book-reader-toolbar">'+
    '<button class="btn sm" data-action="close-reader" data-tip="Close reader">← Back to Library</button>'+
    '<div style="margin-left:auto;display:flex;gap:4px;align-items:center">'+
      '<select class="form-select" style="width:auto;font-size:var(--ts-xs)" id="readerThemeSelect" data-action="reader-theme">'+
        '<option value="parchment"'+(DAL.readerTheme==='parchment'?' selected':'')+'>Parchment</option>'+
        '<option value="paper"'+(DAL.readerTheme==='paper'?' selected':'')+'>Paper</option>'+
        '<option value="night"'+(DAL.readerTheme==='night'?' selected':'')+'>Night</option>'+
        '<option value="sepia"'+(DAL.readerTheme==='sepia'?' selected':'')+'>Sepia</option>'+
      '</select>'+
    '</div></div>';
  html += '<div class="book-page-container"><div class="book-page" id="bookPage">'+pages[DAL.readerPage].html+'<div class="book-page-num">'+(DAL.readerPage+1)+' / '+pages.length+'</div></div></div>';
  html += '<div class="book-nav">'+
    '<button class="btn sm" data-action="reader-prev" '+(DAL.readerPage<=0?'disabled':'')+'>← Previous</button>'+
    '<span style="font-size:var(--ts-xs);color:var(--c-text-faint)">'+(DAL.readerPage+1)+' / '+pages.length+'</span>'+
    '<button class="btn sm" data-action="reader-next" '+(DAL.readerPage>=pages.length-1?'disabled':'')+'>Next →</button>'+
  '</div></div>';
  return html;
};

/* --- Click Handler (shared) --- */
DAL.handleClick = function(action, el, e){
  // Dashboard/Settings field changes
  if(action === 'set-theme'){ DAL.setTheme(el.getAttribute('data-theme')); DAL.render(); return; }

  if(action === 'save-author-info'){
    DAL.state.authorName = document.getElementById('setAuthorName').value;
    DAL.state.authorBio = document.getElementById('setAuthorBio').value;
    DAL.state.autoFillAuthor = document.getElementById('setAutoFill').checked;
    DAL.saveState(); DAL.render(); DAL.toast('Author info saved','success');
    return;
  }

  if(action === 'import-font'){ document.getElementById('fontImport').click(); return; }

  if(action === 'upload-author-avatar'){ document.getElementById('authorAvatarInput').click(); return; }

  if(action === 'remove-author-avatar'){
    DAL.state.authorAvatar = '';
    DAL.saveState(); DAL.render(); DAL.toast('Photo removed','info');
    return;
  }

  if(action === 'remove-font'){
    var idx = parseInt(el.getAttribute('data-idx'));
    DAL.state.customFonts.splice(idx, 1);
    DAL.saveState(); DAL.render(); DAL.toast('Font removed','info');
    return;
  }

  if(action === 'backup-workspace'){ DAL.downloadJSON('draftalore-backup-'+DAL.todayKey()+'.json', DAL.state); DAL.toast('Backup downloaded','success'); return; }

  if(action === 'restore-workspace'){ document.getElementById('restoreInput').click(); return; }

  if(action === 'clear-data'){
    DAL.modal('Clear All Data', '<p style="color:var(--c-danger)">This will permanently delete ALL projects, settings, and data.</p><p style="margin-top:8px;font-weight:600">Click Clear again to confirm.</p>', { footer: '<button class="btn" data-action="close-modal">Cancel</button><button class="btn danger" data-action="clear-data-confirm">Clear Everything</button>' });
    return;
  }

  if(action === 'clear-data-confirm'){
    DAL._storage.removeItem('draftALore');
    DAL.state = DAL.defaultState();
    DAL.closeModal(); DAL.render(); DAL.toast('All data cleared','warning');
    return;
  }

  if(action === 'open-project'){
    var pid = el.getAttribute('data-pid');
    DAL.navigate('workspace', pid);
    return;
  }

  if(action === 'new-project'){ DAL.showNewProjectModal(); return; }

  if(action === 'create-project'){
    var name = document.getElementById('npName').value.trim() || 'Untitled Project';
    var type = document.getElementById('npType').value;
    var proj = DAL.defaultProject(name, type);
    DAL.state.projects[proj.id] = proj;
    DAL.state.projectOrder.push(proj.id);
    DAL.saveState(); DAL.closeModal();
    DAL.navigate('workspace', proj.id);
    DAL.toast('Project created','success');
    return;
  }

  if(action === 'import-project'){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json';
    inp.onchange = function(){
      if(inp.files[0]) DAL.readJSON(inp.files[0], function(data, err){
        if(err){ DAL.toast('Invalid JSON file','error'); return; }
        if(!data.id || !data.name){ DAL.toast('Not a valid project file','error'); return; }
        data.id = DAL.uid('proj');
        DAL.state.projects[data.id] = data;
        DAL.state.projectOrder.push(data.id);
        DAL.saveState(); DAL.render(); DAL.toast('Project imported','success');
      });
    };
    inp.click();
    return;
  }

  if(action === 'project-settings'){ e.stopPropagation(); DAL.showProjectSettingsModal(el.getAttribute('data-pid')); return; }

  if(action === 'save-project-settings'){
    var spid = el.getAttribute('data-pid');
    var sp = DAL.state.projects[spid];
    if(sp){
      sp.name = document.getElementById('psName').value.trim() || sp.name;
      sp.status = document.getElementById('psStatus').value;
      sp.cover.title = document.getElementById('psCoverTitle').value;
      sp.cover.subtitle = document.getElementById('psCoverSubtitle').value;
      sp.cover.author = document.getElementById('psCoverAuthor').value;
      sp.updatedAt = Date.now();
      DAL.saveState(); DAL.closeModal(); DAL.render(); DAL.toast('Settings saved','success');
    }
    return;
  }

  if(action === 'export-project'){
    e.stopPropagation();
    var epid = el.getAttribute('data-pid');
    DAL.showExportModal(epid);
    return;
  }

  if(action === 'delete-project'){
    e.stopPropagation();
    DAL.showDeleteConfirm(el.getAttribute('data-pid'), 1);
    return;
  }

  if(action === 'delete-project-confirm'){
    var dpid = el.getAttribute('data-pid');
    delete DAL.state.projects[dpid];
    DAL.state.projectOrder = DAL.state.projectOrder.filter(function(id){ return id !== dpid; });
    DAL.saveState(); DAL.closeModal(); DAL.render(); DAL.toast('Project deleted','warning');
    return;
  }

  if(action === 'link-folder' || action === 'link-folder-new'){
    var lpid = el.getAttribute('data-pid') || (DAL.currentProjectId);
    DAL.linkFolder(lpid);
    return;
  }

  // Library / Reader
  if(action === 'open-reader'){
    DAL._readerPid = el.getAttribute('data-pid');
    DAL.readerPage = 0;
    DAL._inReader = true;
    document.getElementById('content').innerHTML = DAL.renderBookReader(DAL._readerPid);
    return;
  }

  if(action === 'close-reader'){
    DAL._inReader = false;
    DAL.navigate('library');
    return;
  }

  if(action === 'reader-prev'){
    if(DAL.readerPage > 0){ DAL.readerPage--; DAL.flipPage(); }
    return;
  }
  if(action === 'reader-next'){
    DAL.readerPage++; DAL.flipPage();
    return;
  }
  if(action === 'reader-goto'){
    DAL.readerPage = parseInt(el.getAttribute('data-page')) || 0;
    DAL.flipPage();
    return;
  }
  if(action === 'reader-theme'){
    DAL.readerTheme = el.value;
    document.querySelector('.book-reader').setAttribute('data-book-theme', DAL.readerTheme);
    return;
  }

  // Delegates to workspace/story-tools/adventure-tools
  if(DAL.handleWorkspaceClick) DAL.handleWorkspaceClick(action, el, e);
  if(DAL.handleStoryClick) DAL.handleStoryClick(action, el, e);
  if(DAL.handleAdventureClick) DAL.handleAdventureClick(action, el, e);
};

DAL.flipPage = function(){
  var page = document.getElementById('bookPage');
  if(page){
    page.classList.add('flipping');
    setTimeout(function(){
      document.getElementById('content').innerHTML = DAL.renderBookReader(DAL._readerPid);
    }, 250);
  } else {
    document.getElementById('content').innerHTML = DAL.renderBookReader(DAL._readerPid);
  }
};

/* --- Field change handlers (input events) --- */
document.addEventListener('input', function(e){
  var el = e.target;
  if(el.hasAttribute('data-field')){
    var field = el.getAttribute('data-field');
    if(field === 'authorName') DAL.state.authorName = el.value;
    else if(field === 'authorBio') DAL.state.authorBio = el.value;
    else if(field === 'autoFillAuthor') DAL.state.autoFillAuthor = el.checked;
    DAL.saveState();
  }
  if(el.hasAttribute('data-goal')){
    var key = el.getAttribute('data-goal');
    DAL.state[key] = parseInt(el.value) || 0;
    DAL.saveState();
  }
  // Illustration name editing
  if(el.hasAttribute('data-illustration-name')){
    var projIllName = DAL.state.projects[DAL.currentProjectId];
    var illIdx = parseInt(el.getAttribute('data-illustration-name'));
    if(projIllName.images && projIllName.images[illIdx]){
      projIllName.images[illIdx].name = el.value;
      DAL.saveState();
    }
  }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if(el.id === 'authorAvatarInput' && el.files[0]){
    DAL.readImageAsDataURL(el.files[0], function(dataUrl){
      DAL.state.authorAvatar = dataUrl;
      DAL.saveState(); DAL.render(); DAL.toast('Author photo updated','success');
    });
    return;
  }
  if(el.id === 'fontImport' && el.files[0]){
    var file = el.files[0];
    var reader = new FileReader();
    reader.onload = function(ev){
      var name = file.name.replace(/\.[^.]+$/,'');
      DAL.state.customFonts.push({ name: name, dataUrl: ev.target.result });
      DAL.loadCustomFonts();
      DAL.saveState(); DAL.render();
      DAL.toast('Font imported: '+name,'success');
    };
    reader.readAsDataURL(file);
    return;
  }
  if(el.id === 'restoreInput' && el.files[0]){
    DAL.readJSON(el.files[0], function(data, err){
      if(err || !data.projects){ DAL.toast('Invalid backup file','error'); return; }
      DAL.modal('Restore Backup', '<p>This will replace ALL current data with the backup. Continue?</p>', { footer: '<button class="btn" data-action="close-modal">Cancel</button><button class="btn danger" data-action="restore-confirm">Restore</button>' });
      DAL._pendingRestore = data;
    });
    return;
  }
  // Illustration upload (multiple files)
  if(el.id === 'illustrationUpload' && el.files.length){
    var projIll2 = DAL.state.projects[DAL.currentProjectId];
    if(!projIll2.images) projIll2.images = [];
    var remaining = el.files.length;
    Array.prototype.forEach.call(el.files, function(f){
      DAL.compressImage(f, 1200, 0.82, function(dataUrl){
        var name = f.name.replace(/\.[^.]+$/,'');
        projIll2.images.push({ id: DAL.uid('img'), name: name, dataUrl: dataUrl, category: 'other', usedIn: [] });
        remaining--;
        if(remaining === 0){
          DAL.saveState(); DAL.render();
          DAL.toast(el.files.length+' image'+(el.files.length!==1?'s':'')+' added to library','success');
        }
      });
    });
    return;
  }
  // Cover image upload
  if(el.id === 'coverImageInput' && el.files[0]){
    var projCov2 = DAL.state.projects[DAL.currentProjectId];
    DAL.compressImage(el.files[0], 800, 0.85, function(dataUrl){
      projCov2.cover.imageDataUrl = dataUrl;
      DAL.saveState(); DAL.render(); DAL.toast('Cover illustration set','success');
    });
    return;
  }
  // Chapter image upload
  if(el.id === 'chapterImageInput' && el.files[0]){
    var projChImg = DAL.state.projects[DAL.currentProjectId];
    var chImg = projChImg.chapters.find(function(c){ return c.id === DAL._uploadChapterCid; });
    if(chImg){
      if(!chImg.images) chImg.images = [];
      if(chImg.images.length >= 2){ DAL.toast('Max 2 images per chapter','error'); return; }
      DAL.compressImage(el.files[0], 1000, 0.82, function(dataUrl){
        var imgName = el.files[0].name.replace(/\.[^.]+$/,'');
        chImg.images.push({ id: DAL.uid('img'), name: imgName, dataUrl: dataUrl });
        DAL.saveState(); DAL.render(); DAL.toast('Chapter image added','success');
      });
    }
    DAL._uploadChapterCid = null;
    return;
  }
  // Illustration category change
  if(el.hasAttribute('data-illustration-category')){
    var projIllCat = DAL.state.projects[DAL.currentProjectId];
    var catIdx = parseInt(el.getAttribute('data-illustration-category'));
    if(projIllCat.images && projIllCat.images[catIdx]){
      projIllCat.images[catIdx].category = el.value;
      DAL.saveState();
    }
    return;
  }
  // Item image upload (adventure-tools)
  if(el.id === 'itemImageInput' && el.files[0]){
    var projItem = DAL.state.projects[DAL.currentProjectId];
    var advItem = DAL.ensureAdventure(projItem);
    var itemIdx2 = parseInt(DAL._uploadItemIdx);
    if(advItem.items && advItem.items[itemIdx2]){
      DAL.compressImage(el.files[0], 400, 0.8, function(dataUrl){
        advItem.items[itemIdx2].imageDataUrl = dataUrl;
        DAL.saveState(); DAL.render(); DAL.toast('Item illustration set','success');
      });
    }
    DAL._uploadItemIdx = null;
    return;
  }
  // Scene image upload (adventure-tools)
  if(el.id === 'sceneImageInput' && el.files[0]){
    var projScene = DAL.state.projects[DAL.currentProjectId];
    var advScene = DAL.ensureAdventure(projScene);
    var nodeScene = advScene.nodes.find(function(n){ return n.id === DAL._uploadSceneNodeId; });
    if(nodeScene){
      if(!nodeScene.images) nodeScene.images = [];
      DAL.compressImage(el.files[0], 800, 0.82, function(dataUrl){
        nodeScene.images.push({ id: DAL.uid('img'), name: el.files[0].name.replace(/\.[^.]+$/,''), dataUrl: dataUrl });
        DAL.saveState(); DAL.render(); DAL.toast('Scene illustration added','success');
      });
    }
    DAL._uploadSceneNodeId = null;
    return;
  }
});

// Restore confirm handler
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action="restore-confirm"]');
  if(!el) return;
  if(DAL._pendingRestore){
    DAL.state = Object.assign(DAL.defaultState(), DAL._pendingRestore);
    DAL._pendingRestore = null;
    DAL.saveState(true); DAL.closeModal(); DAL.render();
    DAL.toast('Backup restored','success');
  }
});

/* --- Workspace Render --- */

      ['illustrations','Illustrations','M21 15l-5-5L5 21 M3 3h18v18H3z M8.5 8.5a1.5 1.5 0 1 0 0 .1z'],

    ];
    advTools.forEach(function(t){
      var active = DAL.currentTool === t[0] ? ' active' : '';
      html += '<div class="ws-nav-item'+active+'" data-action="ws-tool" data-tool="'+t[0]+'" data-tip="'+t[1]+'">'+(t[2]?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="'+t[2]+'"/></svg>':'')+'<span>'+t[1]+'</span></div>';
    });

  html += '</aside>'; // end sidebar

       writing surface gets that height back, so undo/redo and the save
       indicator travel with the project header instead. */
    '<div class="ws-compact-actions">'+
      '<button class="topbar-btn" data-action="undo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg></button>'+

      '<span data-tip="Today word count">Today: <strong style="color:var(--c-accent)">'+(daily.manuscript+daily.supplementary)+'</strong></span>'+
      '<div class="sync-dot '+(DAL.folderHandles[proj.id]?'linked':'unlinked')+'" data-tip="'+(DAL.folderHandles[proj.id]?'Folder linked':'No folder linked')+'"></div>'+
      /* Folder sync needs the File System Access API, which mobile browsers
         don't implement — so the control is hidden rather than offered and
         then refused. */
      '<button class="btn sm ws-folder-btn" data-action="link-folder" data-pid="'+proj.id+'" data-tip="Link or relink folder">Link Folder</button>'+

  html += DAL.renderStoryTool(proj, DAL.currentTool);

  html += '</div>'; // end workspace-main
  html += '</div>'; // end flex container
  html += '</div>'; // end workspace

  // the user came from ("Dashboard", "Settings") while a project is open.
  var topTitle = document.getElementById('topTitle');
  if(topTitle) topTitle.textContent = proj.name || 'Project';

  // Replace content
  var content = document.getElementById('content');
  content.style.padding = '0';
  content.innerHTML = html;
  content.parentElement.style.flex = '1';
  content.parentElement.style.display = 'flex';
  content.parentElement.style.flexDirection = 'column';
  content.parentElement.style.overflow = 'hidden';

  // Post-render hooks
  DAL.afterStoryRender(proj);
};

DAL.renderStoryTool = function(proj, tool){
  switch(tool){
    case 'overview': return DAL.renderOverview(proj);
    case 'manuscript': return DAL.renderManuscript(proj);
    case 'characters': return DAL.renderCharacters(proj);
    case 'relationships': return DAL.renderRelationshipMap(proj);
    case 'plots': return DAL.renderPlotThreads(proj);
    case 'lore': return DAL.renderLoreNotebook(proj);
    case 'illustrations': return DAL.renderIllustrations(proj);
    case 'mindmap': return DAL.renderMindMap(proj);
    case 'bookpreview': return DAL.renderBookPreview(proj);
    case 'export': return DAL.renderStoryExport(proj);
    case 'storygraph': return DAL.renderStoryGraph(proj);
    case 'stats': return DAL.renderStatsTraits(proj);
    case 'items': return DAL.renderItems(proj);
    case 'playtest': return DAL.renderPlaytest(proj);
    case 'export-rpg': return DAL.renderRPGExport(proj);
    default: return DAL.renderOverview(proj);
  }
};

/* --- Overview --- */
DAL.renderOverview = function(proj){
  var wc = DAL.getProjectWordCount(proj);
  var now = Date.now();
  var stalePlots = (proj.plots||[]).filter(function(p){ return (now - (p.lastTouched||p.createdAt||0)) > 30*86400000; });
  var recent = [];
  (proj.chapters||[]).forEach(function(c){ recent.push({name:'Chapter: '+c.title, ts:c.updatedAt}); });
  (proj.characters||[]).forEach(function(c){ recent.push({name:'Character: '+c.name, ts:c.createdAt}); });
  (proj.lore&&proj.lore.entries||[]).forEach(function(e){ recent.push({name:'Lore: '+e.title, ts:e.updatedAt}); });
  recent.sort(function(a,b){ return (b.ts||0)-(a.ts||0); });
  recent = recent.slice(0,5);

  var html = '<div style="max-width:800px">';
  html += '<div class="section-header"><div class="section-title">'+DAL.escapeHtml(proj.name)+'</div><span class="badge accent">'+proj.type+'</span></div>';

  // Stats grid
  html += '<div class="card-grid ws-stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">'+
    '<div class="card" style="text-align:center"><div style="font-size:var(--ts-lg);font-weight:700;color:var(--c-accent)">'+(proj.chapters||[]).length+'</div><div style="font-size:var(--ts-xs);color:var(--c-text-muted)">Chapters</div></div>'+
    '<div class="card" style="text-align:center"><div style="font-size:var(--ts-lg);font-weight:700;color:var(--c-accent)">'+(proj.characters||[]).length+'</div><div style="font-size:var(--ts-xs);color:var(--c-text-muted)">Characters</div></div>'+
    '<div class="card" style="text-align:center"><div style="font-size:var(--ts-lg);font-weight:700;color:var(--c-accent)">'+(proj.plots||[]).length+'</div><div style="font-size:var(--ts-xs);color:var(--c-text-muted)">Plot Threads</div></div>'+
    '<div class="card" style="text-align:center"><div style="font-size:var(--ts-lg);font-weight:700;color:var(--c-accent)">'+(proj.lore&&proj.lore.entries||[]).length+'</div><div style="font-size:var(--ts-xs);color:var(--c-text-muted)">Lore Entries</div></div>'+
  '</div>';

  // Word counts
  html += '<div class="card" style="margin-bottom:16px;display:flex;gap:16px;justify-content:center;text-align:center">'+
    '<div><div style="font-size:var(--ts-lg);font-weight:700">'+wc.manuscript+'</div><div style="font-size:var(--ts-xs);color:var(--c-text-muted)">Manuscript</div></div>'+
    '<div><div style="font-size:var(--ts-lg);font-weight:700">'+wc.supplementary+'</div><div style="font-size:var(--ts-xs);color:var(--c-text-muted)">Supplementary</div></div>'+
    '<div><div style="font-size:var(--ts-lg);font-weight:700;color:var(--c-accent)">'+wc.total+'</div><div style="font-size:var(--ts-xs);color:var(--c-text-muted)">Total</div></div>'+
  '</div>';

  // Stale plots
  if(stalePlots.length){
    html += '<div class="card" style="margin-bottom:16px;border-left:3px solid var(--c-warning)">'+
      '<div style="font-weight:600;color:var(--c-warning);margin-bottom:8px">⚠ Stale Plot Threads</div>';
    stalePlots.forEach(function(p){
      html += '<div style="font-size:var(--ts-sm);padding:2px 0">'+DAL.escapeHtml(p.title)+' — untouched '+DAL.formatDate(p.lastTouched||p.createdAt)+'</div>';
    });
    html += '</div>';
  }

  // Quick links
  html += '<div class="card" style="margin-bottom:16px"><div style="font-weight:600;margin-bottom:8px">Quick Links</div><div class="quick-links">';
  var tools = proj.type === 'rpg' ? ['storygraph','stats','items','playtest','illustrations'] : ['manuscript','characters','illustrations','bookpreview','export'];
  if(proj.type === 'dual') tools = ['manuscript','characters','illustrations','storygraph','stats','items','playtest'];
  tools.forEach(function(t){
    var labels = {manuscript:'Manuscript',characters:'Characters',relationships:'Relationships',plots:'Plot Threads',lore:'Lore',illustrations:'Illustrations',mindmap:'Mind Map',bookpreview:'Book Preview',export:'Export',storygraph:'Story Graph',stats:'Stats & Traits',items:'Items',playtest:'Playthrough'};
    html += '<div class="quick-link" data-action="ws-tool" data-tool="'+t+'" data-tip="Go to '+labels[t]+'">'+labels[t]+'</div>';
  });
  html += '</div></div>';

  // Recent activity
  if(recent.length){
    html += '<div class="card"><div style="font-weight:600;margin-bottom:8px">Recent Activity</div>';
    recent.forEach(function(r){
      html += '<div class="activity-item">'+DAL.escapeHtml(r.name)+'<span class="activity-time">'+DAL.formatDate(r.ts)+'</span></div>';
    });
    html += '</div>';
  }

  html += '</div>';
  return html;
};

/* --- Manuscript --- */
DAL.renderManuscript = function(proj){
  if(!proj.chapters) proj.chapters = [];
  if(!DAL.selectedChapterId && proj.chapters.length){
    DAL.selectedChapterId = proj.chapters[0].id;
  }

DAL.afterStoryRender = function(proj){
  // Bind editor if present
  var editor = document.getElementById('editorContent');
  if(editor){
    var saveTimer = null;
    editor.addEventListener('input', function(){
      var ch = proj.chapters.find(function(c){ return c.id === DAL.selectedChapterId; });
      if(ch){
        ch.contentHTML = editor.innerHTML;
        ch.updatedAt = Date.now();
        proj.updatedAt = Date.now();
        if(saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(function(){ DAL.saveState(); }, 450);
        // Update word count
        var wc = DAL.countWords(editor.innerHTML);
        var footer = editor.parentElement.parentElement.querySelector('.editor-footer span');
        if(footer) footer.textContent = wc + ' words';
      }
    });
  }

  // Bind canvas interactions if present
  DAL.initCanvasInteractions(proj);

  // Bind relationship map if present
  DAL.initRelMap(proj);

  // Bind project name input
  var nameInput = document.getElementById('projNameInput');
  if(nameInput){
    nameInput.addEventListener('change', function(){
      proj.name = nameInput.value.trim() || proj.name;
      proj.cover.title = proj.name;
      proj.updatedAt = Date.now();
      DAL.saveState();
    });
  }

  // Status change
  var statusSel = document.querySelector('[data-action="change-status"]');
  if(statusSel){
    statusSel.addEventListener('change', function(){
      proj.status = statusSel.value;
      proj.updatedAt = Date.now();
      DAL.saveState();
    });
  }
};

/* --- Characters --- */
DAL.renderCharacters = function(proj){
  if(!proj.characters) proj.characters = [];
  if(DAL.selectedCharId){
    var ch = proj.characters.find(function(c){ return c.id === DAL.selectedCharId; });
    if(ch) return DAL.renderCharacterDetail(proj, ch);
  }

  var html = '<div class="section-header"><div class="section-title">Characters</div><button class="btn primary" data-action="add-character">+ Add Character</button></div>';
  if(!proj.characters.length){
    return html + '<div class="empty-state"><h3>No Characters Yet</h3><p>Add your first character to get started.</p><button class="btn primary" data-action="add-character">Add Character</button></div>';
  }
  html += '<div class="char-grid">';
  proj.characters.forEach(function(c){
    var initials = (c.name||'?').split(' ').map(function(w){ return w[0]; }).join('').substring(0,2).toUpperCase();
    html += '<div class="char-card" data-action="select-character" data-cid="'+c.id+'" data-tip="View '+DAL.escapeHtml(c.name)+'">'+
      '<div class="char-portrait">'+(c.image?'<img src="'+c.image+'">':DAL.escapeHtml(initials))+'</div>'+
      '<div class="char-name">'+DAL.escapeHtml(c.name)+'</div>'+
      '<div class="char-role">'+DAL.escapeHtml(c.role||'')+'</div>'+
    '</div>';
  });
  html += '</div>';
  return html;
};

  html += '<div style="flex:1"><input class="form-input" id="charName" value="'+DAL.escapeHtml(ch.name||'')+'" placeholder="Character name" style="font-size:var(--ts-lg);font-weight:700;margin-bottom:4px"></div></div>';

  // Portrait upload
  html += '<div style="margin-bottom:12px"><input type="file" id="charPortrait" accept="image/*" style="display:none"><button class="btn sm" data-action="upload-portrait" data-cid="'+ch.id+'" data-tip="Upload portrait">Upload Portrait</button> '+(ch.image?'<button class="btn sm danger" data-action="remove-portrait" data-cid="'+ch.id+'">Remove</button>':'')+'</div>';

  html += '<div class="form-row" style="margin-bottom:12px">'+
    '<div class="form-group"><label class="form-label">Role</label><input class="form-input" data-char-field="role" value="'+DAL.escapeHtml(ch.role||'')+'" placeholder="Protagonist"></div>'+
    '<div class="form-group"><label class="form-label">Age</label><input class="form-input" data-char-field="age" value="'+DAL.escapeHtml(ch.age||'')+'" placeholder="25"></div>'+
    '<div class="form-group"><label class="form-label">Gender</label><input class="form-input" data-char-field="gender" value="'+DAL.escapeHtml(ch.gender||'')+'" placeholder="Female"></div></div>';

  var fields = [['appearance','Physical Appearance'],['personality','Personality'],['backstory','Backstory'],['arc','Character Arc / Goals']];
  fields.forEach(function(f){
    html += '<div class="form-group"><label class="form-label">'+f[1]+'</label><textarea class="form-textarea" data-char-field="'+f[0]+'" placeholder="Write '+f[1].toLowerCase()+'...">'+DAL.escapeHtml(ch[f[0]]||'')+'</textarea></div>';
  });

  // Custom fields
  if(ch.customFields && ch.customFields.length){
    html += '<div class="form-group"><label class="form-label">Custom Fields</label>';
    ch.customFields.forEach(function(cf, i){
      html += '<div style="display:flex;gap:4px;margin-bottom:4px"><input class="form-input" style="flex:1" value="'+DAL.escapeHtml(cf.label)+'" data-cf-label="'+i+'" placeholder="Label"><input class="form-input" style="flex:2" value="'+DAL.escapeHtml(cf.value)+'" data-cf-value="'+i+'" placeholder="Value"></div>';
    });

  html += '<button class="btn sm" data-action="add-custom-field" data-cid="'+ch.id+'" data-tip="Add a custom field">+ Add Custom Field</button>';

  // Tags
  html += '<div class="form-group" style="margin-top:12px"><label class="form-label">Tags</label><input class="form-input" data-char-field="tags" value="'+DAL.escapeHtml((ch.tags||[]).join(', '))+'" placeholder="comma, separated, tags"></div>';

  // Linked plots
  html += '<div class="form-group"><label class="form-label">Linked Plot Threads</label><div style="display:flex;flex-wrap:wrap;gap:4px">';
  (proj.plots||[]).forEach(function(p){
    var sel = (ch.linkedPlotIds||[]).indexOf(p.id) >= 0;
    html += '<span class="chip'+(sel?' selected':'')+'" data-action="toggle-char-plot" data-cid="'+ch.id+'" data-pid="'+p.id+'">'+DAL.escapeHtml(p.title)+'</span>';

/* --- Relationship Map --- */
DAL.renderRelationshipMap = function(proj){
  if(!proj.characters || !proj.characters.length){
    return '<div class="empty-state"><h3>No Characters</h3><p>Add characters first to build relationship maps.</p></div>';
  }
  if(!DAL._relCenter) DAL._relCenter = proj.characters[0].id;
  var center = proj.characters.find(function(c){ return c.id === DAL._relCenter; });
  if(!center){ DAL._relCenter = proj.characters[0].id; center = proj.characters[0]; }

  var connected = (proj.relationships||[]).filter(function(r){ return r.fromCharId === center.id || r.toCharId === center.id; });
  var connectedChars = connected.map(function(r){
    var otherId = r.fromCharId === center.id ? r.toCharId : r.fromCharId;
    var c = proj.characters.find(function(ch){ return ch.id === otherId; });
    return c ? { char: c, rel: r } : null;
  }).filter(Boolean);

  var html = '<div class="section-header"><div class="section-title">Relationship Map</div><button class="btn primary" data-action="add-relationship" data-tip="Add a new relationship">+ Add Relationship</button></div>';
  html += '<div style="margin-bottom:12px"><label class="form-label">Center on character</label><select class="form-select" id="relCenterSelect" style="width:auto;display:inline-block">';
  proj.characters.forEach(function(c){
    html += '<option value="'+c.id+'"'+(c.id===center.id?' selected':'')+'>'+DAL.escapeHtml(c.name)+'</option>';
  });
  html += '</select></div>';

  html += '<div class="rel-map-container" id="relMapContainer" style="position:relative">';
  html += '<svg class="rel-svg" id="relSvg"></svg>';

  // Center node
  html += '<div class="rel-node center" id="relCenterNode" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)">'+
    '<div style="font-weight:700">'+DAL.escapeHtml(center.name)+'</div>'+
    '<div style="font-size:var(--ts-xs);color:var(--c-text-muted)">'+DAL.escapeHtml(center.role||'')+'</div></div>';

  // Connected nodes in a circle
  var radius = 180;
  connectedChars.forEach(function(item, i){
    var angle = (i / connectedChars.length) * Math.PI * 2 - Math.PI/2;
    var x = 50 + Math.cos(angle) * 35;
    var y = 50 + Math.sin(angle) * 35;
    var colorMap = { family:'var(--c-warning)', enemy:'var(--c-danger)', ally:'var(--c-info)', friend:'var(--c-success)', rival:'var(--c-warning)' };
    var color = colorMap[item.rel.category] || 'var(--c-border)';
    html += '<div class="rel-node connected" data-action="rel-center-on" data-cid="'+item.char.id+'" style="position:absolute;left:'+x+'%;top:'+y+'%;transform:translate(-50%,-50%);border-color:'+color+'" data-tip="'+DAL.escapeHtml(item.rel.type||'relationship')+'">'+
      '<div style="font-weight:600;font-size:var(--ts-sm)">'+DAL.escapeHtml(item.char.name)+'</div>'+
      '<div style="font-size:var(--ts-xs);color:var(--c-text-muted)">'+DAL.escapeHtml(item.rel.type||'')+'</div></div>';
  });

  if(!connectedChars.length){
    html += '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,60px);text-align:center;color:var(--c-text-faint);font-size:var(--ts-sm)">No relationships yet. Click "Add Relationship" to connect characters.</div>';
  }

  html += '</div>';
  return html;
};

DAL.initRelMap = function(proj){
  var sel = document.getElementById('relCenterSelect');
  if(sel){
    sel.addEventListener('change', function(){
      DAL._relCenter = sel.value;
      DAL.render();
    });
  }
};

/* --- Plot Threads --- */
DAL.renderPlotThreads = function(proj){
  if(!proj.plots) proj.plots = [];
  if(DAL.selectedPlotId){
    var p = proj.plots.find(function(pl){ return pl.id === DAL.selectedPlotId; });
    if(p) return DAL.renderPlotDetail(proj, p);
  }

  var main = proj.plots.filter(function(p){ return p.type === 'main'; });
  var sub = proj.plots.filter(function(p){ return p.type !== 'main'; });
  var now = Date.now();

  var html = '<div class="section-header"><div class="section-title">Plot Threads</div></div>';

  // Main plots
  html += '<div class="plot-section"><div class="plot-section-title">Main Plot</div>';
  if(main.length){
    main.forEach(function(p){
      var stale = (now - (p.lastTouched||p.createdAt||0)) > 30*86400000;
      html += '<div class="plot-card" data-action="select-plot" data-pid="'+p.id+'" data-tip="View plot details">'+
        '<div class="plot-status-dot '+p.status+'"></div>'+
        '<div style="flex:1"><div style="font-weight:600">'+DAL.escapeHtml(p.title)+'</div></div>'+
        (stale?'<span class="stale-warning">⚠ stale</span>':'')+
        '<span class="badge">'+DAL.escapeHtml(p.status)+'</span></div>';
    });
  } else {
    html += '<div style="font-size:var(--ts-xs);color:var(--c-text-faint);padding:8px">No main plot threads</div>';
  }
  html += '<button class="btn sm" data-action="add-plot" data-type="main" style="margin-top:4px">+ Add Main Plot</button></div>';

  // Subplots
  html += '<div class="plot-section"><div class="plot-section-title">Subplots</div>';
  if(sub.length){
    sub.forEach(function(p){
      var stale = (now - (p.lastTouched||p.createdAt||0)) > 30*86400000;
      html += '<div class="plot-card" data-action="select-plot" data-pid="'+p.id+'" data-tip="View plot details">'+
        '<div class="plot-status-dot '+p.status+'"></div>'+
        '<div style="flex:1"><div style="font-weight:600">'+DAL.escapeHtml(p.title)+'</div></div>'+
        (stale?'<span class="stale-warning">⚠ stale</span>':'')+
        '<span class="badge">'+DAL.escapeHtml(p.status)+'</span></div>';
    });
  } else {
    html += '<div style="font-size:var(--ts-xs);color:var(--c-text-faint);padding:8px">No subplots</div>';
  }
  html += '<button class="btn sm" data-action="add-plot" data-type="subplot" style="margin-top:4px">+ Add Subplot</button></div>';

  return html;
};

DAL.renderPlotDetail = function(proj, p){
  var now = Date.now();
  var stale = (now - (p.lastTouched||p.createdAt||0)) > 30*86400000;
  var html = '<div style="max-width:700px">';
  html += '<div style="margin-bottom:16px"><button class="btn sm" data-action="back-to-plots" data-tip="Back to plot list">← Back</button></div>';
  html += '<input class="form-input" style="font-size:var(--ts-lg);font-weight:700;margin-bottom:12px" id="plotTitle" value="'+DAL.escapeHtml(p.title)+'" placeholder="Plot title">';
  html += '<div class="form-row" style="margin-bottom:12px">'+
    '<div class="form-group"><label class="form-label">Type</label><select class="form-select" id="plotType"><option value="main"'+(p.type==='main'?' selected':'')+'>Main Plot</option><option value="subplot"'+(p.type!=='main'?' selected':'')+'>Subplot</option></select></div>'+
    '<div class="form-group"><label class="form-label">Status</label><select class="form-select" id="plotStatus">'+
      ['planted','developing','climax','resolved','dormant'].map(function(s){ return '<option value="'+s+'"'+(p.status===s?' selected':'')+'>'+s.charAt(0).toUpperCase()+s.slice(1)+'</option>'; }).join('')+
    '</select></div></div>';
  html += '<div class="form-group"><label class="form-label">Description</label><textarea class="form-textarea" id="plotDesc" placeholder="Describe this plot thread...">'+DAL.escapeHtml(p.description||'')+'</textarea></div>';

  // Linked chapters
  html += '<div class="form-group"><label class="form-label">Linked Chapters</label><div style="display:flex;flex-wrap:wrap;gap:4px">';

  });

  html += '</div></div>';

  // Linked characters
  html += '<div class="form-group"><label class="form-label">Linked Characters</label><div style="display:flex;flex-wrap:wrap;gap:4px">';
  (proj.characters||[]).forEach(function(c){
    var sel = (p.linkedCharacterIds||[]).indexOf(c.id) >= 0;
    html += '<span class="chip'+(sel?' selected':'')+'" data-action="toggle-plot-char" data-pid="'+p.id+'" data-cid="'+c.id+'">'+DAL.escapeHtml(c.name)+'</span>';
  });
  if(!proj.characters||!proj.characters.length) html += '<span style="font-size:var(--ts-xs);color:var(--c-text-faint)">No characters yet</span>';
  html += '</div></div>';

  if(stale) html += '<div class="stale-warning" style="margin-bottom:12px">⚠ This plot thread hasn\'t been touched in 30+ days</div>';
  html += '<div style="font-size:var(--ts-xs);color:var(--c-text-faint);margin-bottom:12px">Last touched: '+DAL.formatDate(p.lastTouched||p.createdAt)+'</div>';

  html += '</div>';
  return html;
};

/* --- Lore Notebook --- */

      '<div style="margin-bottom:8px;font-size:var(--ts-lg);color:var(--c-text-muted)">What is a Mind Map?</div>'+

      '<p style="margin-top:8px"><strong>Double-click</strong> the canvas to add an idea, <strong>click two nodes in Connect mode</strong> to link them, <strong>click a node</strong> to rename it, and <strong>click a line</strong> to remove it.</p>'+
    '</div>';

DAL.initCanvasInteractions = function(proj){
  var container = document.getElementById('canvasContainer');
  var inner = document.getElementById('canvasInner');
  var svg = document.getElementById('canvasSvg');
  if(!container || !inner) return;

  var mm = proj.mindmap;
  if(!mm) return;

  // Draw edges
  if(svg){
    svg.innerHTML = '';
    (mm.edges||[]).forEach(function(edge){
      var from = mm.nodes.find(function(n){ return n.id === edge.from; });
      var to = mm.nodes.find(function(n){ return n.id === edge.to; });
      if(!from || !to) return;
      var x1 = (from.x||0)+70, y1 = (from.y||0)+20;
      var x2 = (to.x||0)+70, y2 = (to.y||0)+20;
      var mx = (x1+x2)/2;
      svg.innerHTML += '<path d="M'+x1+','+y1+' Q'+mx+','+((y1+y2)/2-20)+' '+x2+','+y2+'" fill="none" stroke="var(--c-border)" stroke-width="2" data-action="mm-delete-edge" data-eid="'+edge.id+'" style="pointer-events:stroke;cursor:pointer"/>';
    });
  }

  // Drag nodes
  var dragNode = null, dragOff = {x:0,y:0};
  container.addEventListener('mousedown', function(e){
    var nodeEl = e.target.closest('.canvas-node');
    if(nodeEl && !DAL.connectMode){
      var nid = nodeEl.getAttribute('data-nid');
      dragNode = mm.nodes.find(function(n){ return n.id === nid; });
      if(dragNode){
        var rect = inner.getBoundingClientRect();
        dragOff.x = e.clientX - rect.left - (dragNode.x||0);
        dragOff.y = e.clientY - rect.top - (dragNode.y||0);
        e.preventDefault();
      }
    }
  });
  container.addEventListener('mousemove', function(e){
    if(dragNode){
      var rect = inner.getBoundingClientRect();
      dragNode.x = e.clientX - rect.left - dragOff.x;
      dragNode.y = e.clientY - rect.top - dragOff.y;
      var el = container.querySelector('[data-nid="'+dragNode.id+'"]');
      if(el){ el.style.left = dragNode.x+'px'; el.style.top = dragNode.y+'px'; }
      DAL._canvasDirty = true;
    }
  });
  container.addEventListener('mouseup', function(){
    if(dragNode && DAL._canvasDirty){
      DAL._canvasDirty = false;
      DAL.saveState();
      DAL.initCanvasInteractions(proj);
    }
    dragNode = null;
  });

  // Double-click to add node
  container.addEventListener('dblclick', function(e){
    if(e.target === container || e.target === inner || e.target === svg){
      var rect = inner.getBoundingClientRect();
      var node = { id: DAL.uid('mm'), label: 'New Idea', type: 'idea', x: e.clientX - rect.left, y: e.clientY - rect.top };
      mm.nodes.push(node);
      DAL.saveState(); DAL.render();
    }
  });
};

/* --- Book Preview --- */
DAL.renderBookPreview = function(proj){
  if(!proj.chapters || !proj.chapters.length){
    return '<div class="empty-state"><h3>No Chapters</h3><p>Add chapters to your manuscript to preview the book.</p></div>';
  }
  if(DAL.readerPage === undefined || DAL.readerPage === null) DAL.readerPage = 0;
  if(DAL._readerPid !== proj.id){ DAL.readerPage = 0; DAL._readerPid = proj.id; }

  var pages = [];
  var author = proj.cover.author || (DAL.state.autoFillAuthor ? DAL.state.authorName : '');
  // Cover page with illustration
  var coverHtml = '<div class="book-cover">';
  if(proj.cover.imageDataUrl){
    coverHtml += '<div class="book-cover-image"><img src="'+proj.cover.imageDataUrl+'"></div>';
  }
  coverHtml += '<div class="book-cover-title">'+DAL.escapeHtml(proj.cover.title||proj.name)+'</div>'+(proj.cover.subtitle?'<div style="font-size:var(--ts-sm);opacity:.7;margin-bottom:12px">'+DAL.escapeHtml(proj.cover.subtitle)+'</div>':'')+(author?'<div class="book-cover-author">'+DAL.escapeHtml(author)+'</div>':'')+'</div>';
  pages.push({ html: coverHtml });
  // Cover controls (upload/remove) — hidden in reader, shown in preview toolbar
  pages.push({ html: '<div class="book-cover-controls"><h3>Cover Illustration</h3>'+
    (proj.cover.imageDataUrl?'<div class="cover-preview-box"><img src="'+proj.cover.imageDataUrl+'"></div>':'<div class="cover-preview-box empty">No cover image set</div>')+
    '<div style="display:flex;gap:8px;margin-top:8px">'+
    '<input type="file" id="coverImageInput" accept="image/*" style="display:none">'+
    '<button class="btn sm" data-action="upload-cover" data-tip="Upload cover illustration">'+(proj.cover.imageDataUrl?'Change Image':'Upload Cover')+'</button>'+
    (proj.cover.imageDataUrl?'<button class="btn sm danger" data-action="remove-cover">Remove</button>':'')+
    '</div></div>' });
  var tocHtml = '<h1>Table of Contents</h1>';
  proj.chapters.forEach(function(ch, i){ tocHtml += '<p style="cursor:pointer;color:var(--c-accent)" data-action="bp-goto" data-page="'+(i+2)+'">'+(i+1)+'. '+DAL.escapeHtml(ch.title)+'</p>'; });
  pages.push({ html: tocHtml });
  proj.chapters.forEach(function(ch){
    var chHtml = '<h2>'+DAL.escapeHtml(ch.title)+'</h2>';
    // Chapter images
    if(ch.images && ch.images.length){
      ch.images.forEach(function(img){
        chHtml += '<div class="chapter-illustration"><img src="'+img.dataUrl+'">'+(img.name?'<div class="chapter-illustration-caption">'+DAL.escapeHtml(img.name)+'</div>':'')+'</div>';
      });
    }
    chHtml += ch.contentHTML;
    pages.push({ html: chHtml });
  });
  if(DAL.readerPage >= pages.length) DAL.readerPage = 0;

  var html = '<div class="book-reader" data-book-theme="'+DAL.readerTheme+'">';
  html += '<div class="book-reader-toolbar"><div style="font-weight:600">Book Preview</div><div style="margin-left:auto;display:flex;gap:4px;align-items:center"><select class="form-select" style="width:auto;font-size:var(--ts-xs)" data-action="reader-theme"><option value="parchment"'+(DAL.readerTheme==='parchment'?' selected':'')+'>Parchment</option><option value="paper"'+(DAL.readerTheme==='paper'?' selected':'')+'>Paper</option><option value="night"'+(DAL.readerTheme==='night'?' selected':'')+'>Night</option><option value="sepia"'+(DAL.readerTheme==='sepia'?' selected':'')+'>Sepia</option></select></div></div>';
  html += '<div class="book-page-container"><div class="book-page" id="bookPage">'+pages[DAL.readerPage].html+'<div class="book-page-num">'+(DAL.readerPage+1)+' / '+pages.length+'</div></div></div>';
  html += '<div class="book-nav"><button class="btn sm" data-action="bp-prev" '+(DAL.readerPage<=0?'disabled':'')+'>← Previous</button><span style="font-size:var(--ts-xs);color:var(--c-text-faint)">'+(DAL.readerPage+1)+' / '+pages.length+'</span><button class="btn sm" data-action="bp-next" '+(DAL.readerPage>=pages.length-1?'disabled':'')+'>Next →</button></div></div>';
  return html;
};
