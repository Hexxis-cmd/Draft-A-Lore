/* --- Canvas: view controls, panning, zooming and node dragging -------------
   One implementation serves both boards. Which board is on screen is decided by
   the current tool, and the shape of the data differs (a story graph connects
   scenes through choices, a mind map through its own edge list), but the
   gestures, the zoom and the saved view behave identically in both.

   Zoom works by scaling an inner stage. The scrollable box around it grows with
   the scale, because a transform changes what gets drawn without changing the
   size of anything that scrolls — without that, zooming in would put the far
   side of the board out of reach. */

// Movement below this many pixels is treated as a tap, not a drag, so a click
// on a node is never swallowed by an accidental one-pixel wobble.
DAL.CANVAS_DRAG_SLOP = 4;

// Shared zoom + grab controls for both canvas toolbars.
DAL.canvasViewControls = function(){
  var proj = DAL.state && DAL.currentProjectId ? DAL.state.projects[DAL.currentProjectId] : null;
  var zoom = proj ? DAL.canvasView(proj).zoom : 1;
  var grab = DAL.grabMode ? ' active' : '';
  return '<button class="tb-btn'+grab+'" data-action="sg-grab" aria-pressed="'+(DAL.grabMode?'true':'false')+'"'+
      ' title="Grab tool — drag the board around instead of moving scenes" aria-label="Grab tool">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px">'+
      '<path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v7"/>'+
      '<path d="M10 10.5V6a2 2 0 0 0-4 0v8"/>'+
      '<path d="M18 8a2 2 0 0 1 4 0v6a8 8 0 0 1-8 8h-2a8 8 0 0 1-8-8v-1a2 2 0 0 1 4 0"/></svg></button>'+
    '<button class="tb-btn" data-action="sg-zoom-out" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>'+
    '<span class="tb-zoom" data-canvas-zoom aria-live="polite">'+Math.round(zoom*100)+'%</span>'+
    '<button class="tb-btn" data-action="sg-zoom-in" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>'+
    '<button class="tb-btn" data-action="sg-reset" title="Back to 100% and centre on your scenes" aria-label="Reset zoom and position"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>'+
    '<span class="tb-sep"></span>';
};

DAL.canvasEls = function(){
  var container = document.getElementById('canvasContainer');
  var inner = document.getElementById('canvasInner');
  var stage = document.getElementById('canvasStage');
  if(!container || !inner || !stage) return null;
  return { container: container, inner: inner, stage: stage, svg: document.getElementById('canvasSvg') };
};

// The nodes and connections of whichever board is on screen.
DAL.canvasData = function(proj){
  if(DAL.canvasBoard() === 'storygraph') return DAL.ensureAdventure(proj);
  if(!proj.mindmap) proj.mindmap = { nodes: [], edges: [] };
  return proj.mindmap;
};

DAL.applyCanvasView = function(proj){
  var els = DAL.canvasEls();
  if(!els) return;
  var view = DAL.canvasView(proj);
  els.stage.style.transform = view.zoom === 1 ? '' : 'scale('+view.zoom+')';
  els.inner.style.width = Math.round(els.stage.offsetWidth * view.zoom) + 'px';
  els.inner.style.height = Math.round(els.stage.offsetHeight * view.zoom) + 'px';
  var label = document.querySelector('[data-canvas-zoom]');
  if(label) label.textContent = Math.round(view.zoom * 100) + '%';
};

// Scrolling is how the canvas is panned, so the saved position is a scroll
// offset. Writing it back is guarded because restoring it fires scroll events of
// its own, which would otherwise overwrite what we are in the middle of applying.
DAL._canvasRestoring = false;

DAL.restoreCanvasScroll = function(proj){
  var els = DAL.canvasEls();
  if(!els) return;
  var view = DAL.canvasView(proj);
  DAL._canvasRestoring = true;
  els.container.scrollLeft = view.scrollX;
  els.container.scrollTop = view.scrollY;
  setTimeout(function(){ DAL._canvasRestoring = false; }, 0);
};

DAL.rememberCanvasScroll = function(proj){
  var els = DAL.canvasEls();
  if(!els || DAL._canvasRestoring) return;
  var view = DAL.canvasView(proj);
  view.scrollX = els.container.scrollLeft;
  view.scrollY = els.container.scrollTop;
  DAL.saveState();
};

/* Steps to another zoom level while holding whatever is in the middle of the
   viewport still, which is what makes repeated zooming feel like it is aimed at
   the work rather than at the corner of the board. */
DAL.stepCanvasZoom = function(proj, delta){
  var els = DAL.canvasEls();
  if(!els) return;
  var view = DAL.canvasView(proj);
  var i = DAL.zoomIndex(view.zoom) + delta;
  if(i < 0 || i >= DAL.ZOOM_LEVELS.length){
    DAL.toast(delta > 0 ? 'Already at the closest zoom' : 'Already at the widest zoom', 'info');
    return;
  }
  var c = els.container;
  var midX = (c.scrollLeft + c.clientWidth / 2) / view.zoom;
  var midY = (c.scrollTop + c.clientHeight / 2) / view.zoom;
  view.zoom = DAL.ZOOM_LEVELS[i];
  DAL.applyCanvasView(proj);
  DAL._canvasRestoring = true;
  c.scrollLeft = Math.max(0, midX * view.zoom - c.clientWidth / 2);
  c.scrollTop = Math.max(0, midY * view.zoom - c.clientHeight / 2);
  setTimeout(function(){ DAL._canvasRestoring = false; }, 0);
  view.scrollX = c.scrollLeft;
  view.scrollY = c.scrollTop;
  DAL.saveState();
};

/* Reset means 100% centred on the work: an empty board goes to the origin, and
   a board with scenes centres on them, so reset always ends up somewhere useful
   rather than staring at blank grid. */
DAL.resetCanvasView = function(proj){
  var els = DAL.canvasEls();
  if(!els) return;
  var view = DAL.canvasView(proj);
  view.zoom = 1;
  DAL.applyCanvasView(proj);
  var nodes = (DAL.canvasData(proj).nodes || []);
  var x = 0, y = 0;
  if(nodes.length){
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(function(n){
      var nx = n.x || 0, ny = n.y || 0;
      if(nx < minX) minX = nx;
      if(ny < minY) minY = ny;
      if(nx > maxX) maxX = nx;
      if(ny > maxY) maxY = ny;
    });
    x = (minX + maxX) / 2 - els.container.clientWidth / 2;
    y = (minY + maxY) / 2 - els.container.clientHeight / 2;
  }
  view.scrollX = Math.max(0, Math.round(x));
  view.scrollY = Math.max(0, Math.round(y));
  DAL.restoreCanvasScroll(proj);
  DAL.saveState();
};

/* Grab mode is sticky: press once to pick the hand up, press again (or Escape)
   to put it down. It is toggled in place rather than through a re-render so the
   board does not flicker or lose its place mid-gesture. */
DAL.setGrabMode = function(on){
  DAL.grabMode = !!on;
  var els = DAL.canvasEls();
  if(els) els.container.classList.toggle('grab-mode', DAL.grabMode);
  var btn = document.querySelector('[data-action="sg-grab"]');
  if(btn){
    btn.classList.toggle('active', DAL.grabMode);
    btn.setAttribute('aria-pressed', DAL.grabMode ? 'true' : 'false');
  }
};

DAL.handleCanvasClick = function(action, el, e){
  if(!DAL.currentProjectId) return;
  var proj = DAL.state.projects[DAL.currentProjectId];
  if(!proj || !DAL.canvasEls()) return;
  if(action === 'sg-grab'){ DAL.setGrabMode(!DAL.grabMode); return; }
  if(action === 'sg-zoom-in'){ DAL.stepCanvasZoom(proj, 1); return; }
  if(action === 'sg-zoom-out'){ DAL.stepCanvasZoom(proj, -1); return; }
  if(action === 'sg-reset'){ DAL.resetCanvasView(proj); return; }
};

/* Redraws the connection lines from the current node positions. Called on every
   frame of a node drag as well as after one, so lines stay attached to their
   nodes instead of snapping into place at the end. */
DAL.drawCanvasEdges = function(proj, data){
  var els = DAL.canvasEls();
  if(!els || !els.svg) return;
  var isStoryGraph = DAL.canvasBoard() === 'storygraph';
  var parts = [];
  // The arrow marker has to be redefined each time because the whole svg body is
  // rewritten; a story graph reads as a direction of travel without it.
  if(isStoryGraph){
    parts.push('<defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'+
      '<path d="M0,0 L10,5 L0,10 z" fill="var(--c-border)"/></marker></defs>');
  }
  var curve = function(from, to, extra, trim){
    var x1 = (from.x||0)+70, y1 = (from.y||0)+20;
    var x2 = (to.x||0)+70, y2 = (to.y||0)+20;
    var mx = (x1+x2)/2, my = (y1+y2)/2-20;
    if(trim){
      // Lines run centre to centre, so an arrowhead at the exact end point would
      // sit underneath the scene box where nobody can see it. Pull the end back
      // to just outside the box along the direction the line arrives from.
      var dx = x2-mx, dy = y2-my;
      var hw = 78, hh = 32;
      var t = Math.min(Math.abs(dx) > 0.01 ? hw/Math.abs(dx) : Infinity,
                       Math.abs(dy) > 0.01 ? hh/Math.abs(dy) : Infinity);
      if(isFinite(t) && t < 1){ x2 -= dx*t; y2 -= dy*t; }
    }
    return '<path d="M'+x1+','+y1+' Q'+mx+','+my+' '+Math.round(x2)+','+Math.round(y2)+'" fill="none" stroke="var(--c-border)" stroke-width="2" '+extra+'/>';
  };
  var nodes = data.nodes || [];
  var find = function(id){ return nodes.find(function(n){ return n.id === id; }); };
  if(isStoryGraph){
    nodes.forEach(function(n){
      (n.choices||[]).forEach(function(ch){
        if(!ch.targetNodeId) return;
        var to = find(ch.targetNodeId);
        if(to) parts.push(curve(n, to, 'marker-end="url(#arrowhead)" style="pointer-events:none"', true));
      });
    });
  } else {
    (data.edges||[]).forEach(function(edge){
      var from = find(edge.from), to = find(edge.to);
      if(from && to) parts.push(curve(from, to, 'data-action="mm-delete-edge" data-eid="'+edge.id+'" style="pointer-events:stroke;cursor:pointer"'));
    });
  }
  els.svg.innerHTML = parts.join('');
};

DAL.initCanvasInteractions = function(proj){
  var els = DAL.canvasEls();
  if(!els) return;
  var container = els.container, stage = els.stage;
  var data = DAL.canvasData(proj);

  DAL.applyCanvasView(proj);
  DAL.restoreCanvasScroll(proj);
  DAL.drawCanvasEdges(proj, data);
  container.classList.toggle('grab-mode', DAL.grabMode);

  // Assigned rather than added: the canvas markup is rebuilt on every render, but
  // this runs again on plain redraws too, and addEventListener would stack up a
  // second and third copy of the same gesture on the same element.
  var gesture = null;

  container.onpointerdown = function(e){
    if(e.button > 0) return;
    var nodeEl = e.target.closest('.canvas-node');
    var view = DAL.canvasView(proj);
    if(nodeEl && !DAL.grabMode && !DAL.connectMode){
      var node = (data.nodes||[]).find(function(n){ return n.id === nodeEl.getAttribute('data-nid'); });
      if(!node) return;
      gesture = { kind: 'node', node: node, el: nodeEl, fromX: node.x||0, fromY: node.y||0 };
    } else if(DAL.grabMode){
      gesture = { kind: 'pan', scrollX: container.scrollLeft, scrollY: container.scrollTop };
    } else {
      return;
    }
    gesture.id = e.pointerId;
    gesture.startX = e.clientX;
    gesture.startY = e.clientY;
    gesture.moved = false;
    // Capturing keeps the gesture alive when the pointer runs off the node or
    // past the edge of the canvas mid-drag.
    try { container.setPointerCapture(e.pointerId); } catch(err) {}
  };

  container.onpointermove = function(e){
    if(!gesture || e.pointerId !== gesture.id) return;
    var dx = e.clientX - gesture.startX, dy = e.clientY - gesture.startY;
    if(!gesture.moved && Math.abs(dx) + Math.abs(dy) < DAL.CANVAS_DRAG_SLOP) return;
    gesture.moved = true;
    if(gesture.kind === 'pan'){
      // Panning moves the scroll box, which is measured in screen pixels, so the
      // pointer movement is used as it comes.
      DAL._canvasRestoring = true;
      container.scrollLeft = gesture.scrollX - dx;
      container.scrollTop = gesture.scrollY - dy;
    } else {
      // Node coordinates are unscaled board units, so the movement is divided by
      // the zoom or the node slides away from the pointer at any other scale.
      var z = DAL.canvasView(proj).zoom;
      gesture.node.x = Math.max(0, Math.round(gesture.fromX + dx / z));
      gesture.node.y = Math.max(0, Math.round(gesture.fromY + dy / z));
      gesture.el.style.left = gesture.node.x + 'px';
      gesture.el.style.top = gesture.node.y + 'px';
      DAL.drawCanvasEdges(proj, data);
    }
  };

  var finish = function(e){
    if(!gesture || (e && e.pointerId !== gesture.id)) return;
    try { container.releasePointerCapture(gesture.id); } catch(err) {}
    if(gesture.moved){
      // A real drag must not also count as a click, or letting go of a node
      // would open its editor every time.
      DAL._canvasClickGuard = true;
      if(gesture.kind === 'node'){
        proj.updatedAt = Date.now();
        DAL.drawCanvasEdges(proj, data);
        DAL.saveState();
      } else {
        DAL._canvasRestoring = false;
        DAL.rememberCanvasScroll(proj);
      }
    }
    gesture = null;
  };
  container.onpointerup = finish;
  container.onpointercancel = finish;

  container.onclick = function(e){
    if(DAL._canvasClickGuard){
      DAL._canvasClickGuard = false;
      e.stopPropagation();
      e.preventDefault();
    }
  };

  container.onscroll = function(){
    if(DAL._canvasRestoring) return;
    if(DAL._canvasScrollTimer) clearTimeout(DAL._canvasScrollTimer);
    DAL._canvasScrollTimer = setTimeout(function(){ DAL.rememberCanvasScroll(proj); }, 250);
  };

  // Double-click adds an idea to a mind map. A story graph's scenes are created
  // from the toolbar instead, because a scene needs a title and text to mean
  // anything.
  container.ondblclick = function(e){
    if(DAL.canvasBoard() === 'storygraph') return;
    if(e.target !== container && e.target !== els.inner && e.target !== stage && e.target !== els.svg) return;
    var rect = stage.getBoundingClientRect();
    var z = DAL.canvasView(proj).zoom;
    data.nodes.push({
      id: DAL.uid('mm'), label: 'New Idea', type: 'idea',
      x: Math.max(0, Math.round((e.clientX - rect.left) / z)),
      y: Math.max(0, Math.round((e.clientY - rect.top) / z))
    });
    DAL.saveState(); DAL.render();
  };
};

/* --- Book Preview --- */
DAL.renderBookPreview = function(proj){
  if(!proj.chapters || !proj.chapters.length){
    return '<div class="empty-state"><h3>No Chapters</h3><p>Add chapters to your manuscript to preview the book.</p></div>';
  }
  if(DAL.readerPage === undefined || DAL.readerPage === null) DAL.readerPage = 0;
  if(DAL._readerPid !== proj.id){ DAL.readerPage = 0; DAL._readerPid = proj.id; }

  var pages = [];
  var author = proj.cover.author || (DAL.state.autoFillAuthor ? DAL.state.authorName : '');
  // Cover page with illustration
  var coverHtml = '<div class="book-cover">';
  if(proj.cover.imageDataUrl){
    coverHtml += '<div class="book-cover-image"><img src="'+proj.cover.imageDataUrl+'"></div>';
  }
  coverHtml += '<div class="book-cover-title">'+DAL.escapeHtml(proj.cover.title||proj.name)+'</div>'+(proj.cover.subtitle?'<div style="font-size:var(--ts-sm);opacity:.7;margin-bottom:12px">'+DAL.escapeHtml(proj.cover.subtitle)+'</div>':'')+(author?'<div class="book-cover-author">'+DAL.escapeHtml(author)+'</div>':'')+'</div>';
  pages.push({ html: coverHtml });
  // Cover controls (upload/remove) — hidden in reader, shown in preview toolbar
  pages.push({ html: '<div class="book-cover-controls"><h3>Cover Illustration</h3>'+
    (proj.cover.imageDataUrl?'<div class="cover-preview-box"><img src="'+proj.cover.imageDataUrl+'"></div>':'<div class="cover-preview-box empty">No cover image set</div>')+
    '<div style="display:flex;gap:8px;margin-top:8px">'+
    '<input type="file" id="coverImageInput" accept="image/*" style="display:none">'+
    '<button class="btn sm" data-action="upload-cover">'+(proj.cover.imageDataUrl?'Change Image':'Upload Cover')+'</button>'+
    (proj.cover.imageDataUrl?'<button class="btn sm danger" data-action="remove-cover">Remove</button>':'')+
    '</div></div>' });
  var tocHtml = '<h1>Table of Contents</h1>';
  proj.chapters.forEach(function(ch, i){ tocHtml += '<p style="cursor:pointer;color:var(--c-accent)" data-action="bp-goto" data-page="'+(i+2)+'">'+(i+1)+'. '+DAL.escapeHtml(ch.title)+'</p>'; });
  pages.push({ html: tocHtml });
  proj.chapters.forEach(function(ch){
    var chHtml = '<h2>'+DAL.escapeHtml(ch.title)+'</h2>';
    // Chapter images
    if(ch.images && ch.images.length){
      ch.images.forEach(function(img){
        chHtml += '<div class="chapter-illustration"><img src="'+img.dataUrl+'">'+(img.name?'<div class="chapter-illustration-caption">'+DAL.escapeHtml(img.name)+'</div>':'')+'</div>';
      });
    }
    chHtml += ch.contentHTML;
    pages.push({ html: chHtml });
  });
  if(DAL.readerPage >= pages.length) DAL.readerPage = 0;

  var html = '<div class="book-reader" data-book-theme="'+DAL.readerTheme+'">';
  html += '<div class="book-reader-toolbar"><div style="font-weight:600">Book Preview</div><div style="margin-left:auto;display:flex;gap:4px;align-items:center"><select class="form-select" style="width:auto;font-size:var(--ts-xs)" data-action="reader-theme"><option value="parchment"'+(DAL.readerTheme==='parchment'?' selected':'')+'>Parchment</option><option value="paper"'+(DAL.readerTheme==='paper'?' selected':'')+'>Paper</option><option value="night"'+(DAL.readerTheme==='night'?' selected':'')+'>Night</option><option value="sepia"'+(DAL.readerTheme==='sepia'?' selected':'')+'>Sepia</option></select></div></div>';
  html += '<div class="book-page-container"><div class="book-page" id="bookPage">'+pages[DAL.readerPage].html+'<div class="book-page-num">'+(DAL.readerPage+1)+' / '+pages.length+'</div></div></div>';
  html += '<div class="book-nav"><button class="btn sm" data-action="bp-prev" '+(DAL.readerPage<=0?'disabled':'')+'>← Previous</button><span style="font-size:var(--ts-xs);color:var(--c-text-faint)">'+(DAL.readerPage+1)+' / '+pages.length+'</span><button class="btn sm" data-action="bp-next" '+(DAL.readerPage>=pages.length-1?'disabled':'')+'>Next →</button></div></div>';
  return html;
};

/* --- Export registry -------------------------------------------------------
   Every export button in the app is generated from this one list so the Export
   tool tab, the RPG export tab and the Export Project dialog cannot drift apart
   in wording or in which formats they offer. Groups appear only when the
   project actually has that kind of content. */
DAL.exportGroups = function(proj){
  var groups = [];
  var chapters = proj.chapters || [];
  var nodes = (proj.adventure && proj.adventure.nodes) ? proj.adventure.nodes : [];
  var hasProse = proj.type === 'novel' || proj.type === 'dual' || chapters.length > 0;
  var hasAdventure = proj.type === 'rpg' || proj.type === 'dual' || nodes.length > 0;

  groups.push({
    title: 'Whole project',
    note: 'Everything in this project: chapters, characters, lore, adventure and its settings. Import it again with File \u25b8 Import project, which adds it alongside your other projects.',
    items: [{ action: 'export-json', label: 'Project data (.json)' }]
  });
  if(hasProse){
    groups.push({
      title: 'Manuscript',
      note: 'The prose on its own. This is not a project backup \u2014 characters, lore and settings are not included.',
      items: [
        { action: 'export-manuscript-txt',  label: 'Manuscript (.txt)' },
        { action: 'export-manuscript-md',   label: 'Manuscript (.md)' },
        { action: 'export-manuscript-html', label: 'Manuscript (.html)' }
      ]
    });
  }
  if(chapters.length){
    groups.push({
      title: 'Single chapter',
      select: { id: 'exportChapterSelect', options: chapters.map(function(ch, i){ return { value: ch.id, label: (i + 1) + '. ' + ch.title }; }) },
      items: [
        { action: 'export-chapter-txt', label: 'Chapter (.txt)', small: true },
        { action: 'export-chapter-md',  label: 'Chapter (.md)',  small: true }
      ]
    });
  }
  if(hasAdventure){
    groups.push({
      title: 'Adventure',
      note: 'Playable formats for the branching story. The playable file runs the same rules the Playthrough tool runs, on its own, in any browser. Twine source opens in Twine and carries stats, traits, items and gated choices; anything SugarCube cannot express is listed in a "Not Carried Over" passage.',
      items: [
        { action: 'export-twee',          label: 'Twine source (.twee)' },
        { action: 'export-playable-html', label: 'Playable adventure (.html)' }
      ]
    });
  }
  if(nodes.length){
    groups.push({
      title: 'Single scene',
      select: { id: 'exportNodeSelect', options: nodes.map(function(n){ return { value: n.id, label: n.title || 'Untitled' }; }) },
      items: [{ action: 'export-node-text', label: 'Scene (.txt)', small: true }]
    });
  }
  return groups;
};

DAL.renderExportGroups = function(proj){
  return DAL.exportGroups(proj).map(function(g){
    var h = '<div class="card export-group"><div class="export-group-title">' + DAL.escapeHtml(g.title) + '</div>';
    if(g.note) h += '<p class="export-group-note">' + DAL.escapeHtml(g.note) + '</p>';
    if(g.select){
      h += '<select class="form-select export-group-select" id="' + g.select.id + '">';
      g.select.options.forEach(function(o){ h += '<option value="' + o.value + '">' + DAL.escapeHtml(o.label) + '</option>'; });
      h += '</select>';
    }
    h += '<div class="export-group-actions">';
    g.items.forEach(function(it){
      h += '<button class="btn' + (it.small ? ' sm' : '') + '" data-action="' + it.action + '" data-pid="' + proj.id + '">' + DAL.escapeHtml(it.label) + '</button>';
    });
    return h + '</div></div>';
  }).join('');
};

/* Export actions also fire from the File menu, where no button carries a
   project id, so fall back to the open project. */
DAL.exportTarget = function(el){
  var pid = (el && el.getAttribute) ? el.getAttribute('data-pid') : null;
  return DAL.state.projects[pid || DAL.currentProjectId] || null;
};

/* The same select ids exist in a tool panel and in the Export Project dialog
   layered over it, so prefer the dialog's copy while one is open. */
DAL.exportSelectValue = function(id){
  var el = document.querySelector('.modal-backdrop #' + id) || document.getElementById(id);
  return el ? el.value : '';
};

/* --- Story Export --- */
DAL.renderStoryExport = function(proj){
  var html = '<div style="max-width:700px"><div class="section-header"><div class="section-title">Export</div></div>';
  html += DAL.renderExportGroups(proj);

  html += '<div class="card" style="margin-bottom:12px"><div style="font-weight:600;margin-bottom:8px">Cross-Project Transfer</div><p style="font-size:var(--ts-sm);color:var(--c-text-muted);margin-bottom:8px">Copy a character, lore entry, or plot thread into another project.</p>'+
    '<div class="form-row"><select class="form-select" id="transferType"><option value="character">Character</option><option value="lore">Lore Entry</option><option value="plot">Plot Thread</option></select>'+
    '<select class="form-select" id="transferItem"></select><select class="form-select" id="transferDest">';
  DAL.state.projectOrder.forEach(function(pid){
    if(pid !== proj.id){ var p = DAL.state.projects[pid]; if(p) html += '<option value="'+pid+'">'+DAL.escapeHtml(p.name)+'</option>'; }
  });
  html += '</select></div><button class="btn primary" style="margin-top:8px" data-action="transfer-item" data-pid="'+proj.id+'">Transfer</button></div>';

  // Version snapshots
  html += '<div class="card"><div style="font-weight:600;margin-bottom:8px">Version Snapshots</div>';
  html += '<button class="btn sm" data-action="save-version" data-pid="'+proj.id+'">Save Version Now</button>';
  if(proj.versions && proj.versions.length){
    html += '<div style="margin-top:8px;max-height:200px;overflow-y:auto">';
    proj.versions.forEach(function(v, i){
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--c-divider)"><span style="font-size:var(--ts-xs)">'+new Date(v.ts).toLocaleString()+(v.auto?' (auto)':'')+' — '+v.snapWords+' words</span><button class="btn sm" data-action="restore-version" data-pid="'+proj.id+'" data-idx="'+i+'">Restore</button></div>';
    });
    html += '</div>';
  } else {
    html += '<div style="font-size:var(--ts-xs);color:var(--c-text-faint);margin-top:8px">No versions saved yet</div>';
  }
  html += '</div></div>';
  return html;
};

DAL.showExportModal = function(pid){
  var proj = DAL.state.projects[pid || DAL.currentProjectId];
  if(!proj){ DAL.toast('Open a project first.','error'); return; }
  DAL.modal('Export \u201c' + DAL.escapeHtml(proj.name) + '\u201d', '<div class="export-groups">' + DAL.renderExportGroups(proj) + '</div>', { footer: '<button class="btn" data-action="close-modal">Close</button>' });
};

/* --- Story Click Handler --- */
DAL.handleStoryClick = function(action, el, e){
  if(action === 'ws-tool'){
    DAL.currentTool = el.getAttribute('data-tool');
    DAL.render();
    return;
  }

  // Illustrations
  if(action === 'upload-illustration'){ document.getElementById('illustrationUpload').click(); return; }

  if(action === 'delete-illustration'){
    var projIll = DAL.state.projects[DAL.currentProjectId];
    var idxIll = parseInt(el.getAttribute('data-idx'));
    if(projIll.images && projIll.images[idxIll]){
      projIll.images.splice(idxIll, 1);
      DAL.saveState(); DAL.render();
    }
    return;
  }

  // Cover image upload in Book Preview
  if(action === 'upload-cover'){ document.getElementById('coverImageInput').click(); return; }

  if(action === 'remove-cover'){
    var projCov = DAL.state.projects[DAL.currentProjectId];
    projCov.cover.imageDataUrl = '';
    DAL.saveState(); DAL.render();
    return;
  }

  // Chapter image upload
  if(action === 'upload-chapter-image'){
    var chIdx = el.getAttribute('data-cid');
    DAL._uploadChapterCid = chIdx;
    document.getElementById('chapterImageInput').click();
    return;
  }

  if(action === 'remove-chapter-image'){
    var projCh = DAL.state.projects[DAL.currentProjectId];
    var cidRm = el.getAttribute('data-cid');
    var imgIdx = parseInt(el.getAttribute('data-img-idx'));
    var chRm = projCh.chapters.find(function(c){ return c.id === cidRm; });
    if(chRm && chRm.images){
      chRm.images.splice(imgIdx, 1);
      DAL.saveState(); DAL.render();
    }
    return;
  }

  if(action === 'change-status'){
    var pid = el.getAttribute('data-pid');
    var p = DAL.state.projects[pid];
    if(p){ p.status = el.value; p.updatedAt = Date.now(); DAL.saveState(); }
    return;
  }

  // Manuscript
  if(action === 'add-chapter'){
    DAL.pushHistory();
    var proj = DAL.state.projects[DAL.currentProjectId];
    var ch = DAL.defaultChapter('Chapter '+(proj.chapters.length+1), proj.chapters.length);
    proj.chapters.push(ch);
    DAL.selectedChapterId = ch.id;
    proj.updatedAt = Date.now();
    DAL.saveState(); DAL.render();
    return;
  }

  if(action === 'select-chapter'){
    DAL.selectedChapterId = el.getAttribute('data-cid');
    DAL.render();
    return;
  }

  if(action === 'format-block' || action === 'font-family' || action === 'font-size'){
    // These are handled by change event
    return;
  }

  if(action === 'format-cmd'){
    document.execCommand(el.getAttribute('data-cmd'), false, null);
    DAL.saveChapterContent();
    return;
  }

  if(action === 'text-color'){
    document.execCommand('foreColor', false, el.value);
    DAL.saveChapterContent();
    return;
  }

  if(action === 'insert-image'){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = function(){
      if(inp.files[0]) DAL.readImageAsDataURL(inp.files[0], function(dataUrl){
        document.execCommand('insertHTML', false, '<img src="'+dataUrl+'" style="max-width:100%;border-radius:4px"/>');
        DAL.saveChapterContent();
      });
    };
    inp.click();
    return;
  }

  if(action === 'insert-hr'){
    document.execCommand('insertHorizontalRule');
    DAL.saveChapterContent();
    return;
  }

  if(action === 'fullscreen'){
    DAL.distractionFree = !DAL.distractionFree;
    document.body.classList.toggle('distraction-free', DAL.distractionFree);
    return;
  }

  if(action === 'copy-chapter'){
    var proj2 = DAL.state.projects[DAL.currentProjectId];
    var ch2 = proj2.chapters.find(function(c){ return c.id === DAL.selectedChapterId; });
    if(ch2){
      var tmp = document.createElement('div'); tmp.innerHTML = ch2.contentHTML;
      navigator.clipboard.writeText(tmp.textContent).then(function(){ DAL.toast('Chapter copied','success'); });
    }
    return;
  }

  if(action === 'export-chapter'){
    var proj3 = DAL.state.projects[DAL.currentProjectId];
    var ch3 = proj3.chapters.find(function(c){ return c.id === DAL.selectedChapterId; });
    if(ch3){
      var tmp3 = document.createElement('div'); tmp3.innerHTML = ch3.contentHTML;
      DAL.download(DAL.sanitizeFilename(ch3.title)+'.txt', tmp3.textContent);
      DAL.toast('Chapter exported','success');
    }
    return;
  }

  // Characters
  if(action === 'add-character'){
    DAL.pushHistory();
    var proj4 = DAL.state.projects[DAL.currentProjectId];
    var char = { id: DAL.uid('char'), name: 'New Character', role: '', age: '', gender: '', appearance: '', personality: '', backstory: '', arc: '', customFields: [], tags: [], image: '', linkedPlotIds: [], createdAt: Date.now() };
    proj4.characters.push(char);
    DAL.selectedCharId = char.id;
    proj4.updatedAt = Date.now();
    DAL.saveState(); DAL.render();
    return;
  }

  if(action === 'select-character'){
    DAL.selectedCharId = el.getAttribute('data-cid');
    DAL.render();
    return;
  }

  if(action === 'back-to-characters'){
    DAL.selectedCharId = null;
    DAL.render();
    return;
  }

  if(action === 'upload-portrait'){
    var cid = el.getAttribute('data-cid');
    var inp2 = document.createElement('input');
    inp2.type = 'file'; inp2.accept = 'image/*';
    inp2.onchange = function(){

DAL.saveChapterContent = function(){

/* --- Field bindings for story tools --- */
document.addEventListener('input', function(e){
  var el = e.target;
  if(el.hasAttribute('data-char-field')){
    var field = el.getAttribute('data-char-field');
    var proj = DAL.state.projects[DAL.currentProjectId];
    if(!proj || !DAL.selectedCharId) return;
    var ch = proj.characters.find(function(c){ return c.id === DAL.selectedCharId; });
    if(!ch) return;
    if(field === 'tags') ch.tags = el.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    else ch[field] = el.value;
    ch.updatedAt = Date.now();
    proj.updatedAt = Date.now();
    DAL.saveState();
    return;
  }
  if(el.hasAttribute('data-cf-label') || el.hasAttribute('data-cf-value')){
    var proj2 = DAL.state.projects[DAL.currentProjectId];
    var ch2 = proj2.characters.find(function(c){ return c.id === DAL.selectedCharId; });
    if(ch2 && ch2.customFields){
      var idx = parseInt(el.getAttribute('data-cf-label')||el.getAttribute('data-cf-value'));
      if(el.hasAttribute('data-cf-label')) ch2.customFields[idx].label = el.value;
      else ch2.customFields[idx].value = el.value;
      DAL.saveState();
    }
    return;
  }
  if(el.id === 'plotTitle' || el.id === 'plotDesc' || el.id === 'plotType' || el.id === 'plotStatus'){
    var proj3 = DAL.state.projects[DAL.currentProjectId];
    var p = proj3.plots.find(function(pl){ return pl.id === DAL.selectedPlotId; });
    if(p){
      if(el.id === 'plotTitle') p.title = el.value;
      else if(el.id === 'plotDesc') p.description = el.value;
      else if(el.id === 'plotType') p.type = el.value;
      else if(el.id === 'plotStatus') p.status = el.value;
      p.lastTouched = Date.now();
      proj3.updatedAt = Date.now();
      DAL.saveState();
    }
    return;
  }
  if(el.id === 'loreTitle' || el.id === 'loreContent' || el.id === 'loreTags' || el.id === 'loreFolder'){
    var proj4 = DAL.state.projects[DAL.currentProjectId];
    var entry = proj4.lore.entries.find(function(en){ return en.id === DAL.selectedLoreEntry; });
    if(entry){
      if(el.id === 'loreTitle') entry.title = el.value;
      else if(el.id === 'loreContent') entry.content = el.value;
      else if(el.id === 'loreTags') entry.tags = el.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      else if(el.id === 'loreFolder') entry.folder = el.value;
      entry.updatedAt = Date.now();
      proj4.updatedAt = Date.now();
      DAL.saveState();
    }
    return;
  }
});

/* --- Change handler for story tool selects --- */
document.addEventListener('change', function(e){
  var el = e.target;
  if(el.hasAttribute('data-action')){
    var action = el.getAttribute('data-action');
    if(action === 'format-block'){
      document.execCommand('formatBlock', false, el.value);
      DAL.saveChapterContent();
    } else if(action === 'font-family'){
      document.execCommand('fontName', false, el.value);
      DAL.saveChapterContent();
    } else if(action === 'font-size'){
      document.execCommand('fontSize', false, '7');
      var fonts = document.querySelectorAll('font[size="7"]');
      fonts.forEach(function(f){ f.removeAttribute('size'); f.style.fontSize = el.value+'px'; });
      DAL.saveChapterContent();
    } else if(action === 'reader-theme'){
      DAL.readerTheme = el.value;
      var reader = document.querySelector('.book-reader');
      if(reader) reader.setAttribute('data-book-theme', DAL.readerTheme);
    }
  }
  // Transfer item dropdown
  if(el.id === 'transferType'){
    var proj = DAL.state.projects[DAL.currentProjectId];
    var type = el.value;
    var items = [];
    if(type === 'character') items = proj.characters || [];
    else if(type === 'lore') items = (proj.lore&&proj.lore.entries) || [];
    else if(type === 'plot') items = proj.plots || [];
    var sel = document.getElementById('transferItem');
    if(sel){
      sel.innerHTML = items.map(function(it){ return '<option value="'+it.id+'">'+DAL.escapeHtml(it.title||it.name)+'</option>'; }).join('');
    }
  }
});

  RPG.statDef = function(adv, key){
    var list = adv.stats || [];
    for(var i=0;i<list.length;i++){ if(list[i].key === key) return list[i]; }
    return null;
  };

  RPG.traitDef = function(adv, key){
    var list = adv.traits || [];
    for(var i=0;i<list.length;i++){ if(list[i].key === key) return list[i]; }
    return null;
  };

  RPG.nodeById = function(adv, id){
    var list = adv.nodes || [];
    for(var i=0;i<list.length;i++){ if(list[i].id === id) return list[i]; }
    return null;
  };

  /* Items are addressed by id. Adventures authored before ids were used store
     the item's name instead, so every lookup accepts either and resolves to a
     definition when one exists. An unresolved key still works as a bare label,
     which is what keeps older saved work playable. */
  RPG.itemDef = function(adv, key){
    var list = adv.items || [];
    var i;
    for(i=0;i<list.length;i++){ if(list[i].id === key) return list[i]; }
    for(i=0;i<list.length;i++){
      if(String(list[i].name||'').toLowerCase() === String(key||'').toLowerCase()) return list[i];
    }
    return null;
  };

  /* The canonical inventory key for an item reference. */
  RPG.itemKey = function(adv, key){
    var def = RPG.itemDef(adv, key);
    return def ? def.id : key;
  };

  RPG.itemName = function(adv, key){
    var def = RPG.itemDef(adv, key);
    return def ? (def.name || 'Unnamed item') : (key || 'Unknown item');
  };

  RPG.statLabel = function(adv, key){
    var def = RPG.statDef(adv, key);
    return def ? (def.label || def.key) : (key || 'Unknown stat');
  };

  RPG.traitLabel = function(adv, key){
    var def = RPG.traitDef(adv, key);
    return def ? (def.label || def.key) : (key || 'Unknown trait');
  };

  RPG.nodeTitle = function(adv, id){
    var node = RPG.nodeById(adv, id);
    return node ? (node.title || 'Untitled scene') : (id ? 'Missing scene' : 'No scene');
  };

  /* Author-facing rules, with every default spelled out so an adventure saved
     before these existed behaves the way it always did. */
  RPG.rules = function(adv){
    var r = adv.rules || {};
    return {
      lockedChoices: r.lockedChoices === 'hide' ? 'hide' : 'lock',
      failures: r.failures || []
    };
  };

  /* --- Numbers ----------------------------------------------------------- */

  RPG.num = function(v, fallback){
    var n = parseFloat(v);
    return isNaN(n) ? (fallback || 0) : n;
  };

  RPG.hasLimit = function(v){
    return v !== undefined && v !== null && v !== '' && !isNaN(parseFloat(v));
  };

  /* Clamping is a property of the stat, not of the effect, so every write goes
     through here — set, add and subtract alike. */
  RPG.clampStat = function(def, value){
    if(!def || def.type !== 'number') return value;
    var n = RPG.num(value, 0);
    if(RPG.hasLimit(def.min)) n = Math.max(n, parseFloat(def.min));
    if(RPG.hasLimit(def.max)) n = Math.min(n, parseFloat(def.max));
    return n;
  };

  RPG.statStart = function(def){
    if(def.type === 'number') return RPG.clampStat(def, RPG.num(def['default'], 0));
    if(def.type === 'boolean') return def['default'] === true || def['default'] === 'true';
    return String(def['default'] === undefined || def['default'] === null ? '' : def['default']);
  };

  /* --- State ------------------------------------------------------------- */

  /* The authoritative runtime shape. Anything the rules can read lives here
     and nowhere else. */
  RPG.blankState = function(adv){
    var state = {
      stats: {}, traits: {}, inventory: {}, equipped: {}, flags: {}, visited: {},
      nodeId: null, ended: null, step: 0, log: []
    };
    (adv.stats || []).forEach(function(s){ state.stats[s.key] = RPG.statStart(s); });
    (adv.traits || []).forEach(function(t){
      state.traits[t.key] = t.defaultActive === true || t.defaultActive === 'true';
    });
    return state;
  };

  /* A fresh run, already standing in the opening scene with its entry effects
     applied — the start node is a scene like any other. */
  RPG.newState = function(adv){
    var state = RPG.blankState(adv);
    var startId = adv.startNodeId || ((adv.nodes || [])[0] && adv.nodes[0].id) || null;
    if(startId) RPG.enter(state, adv, startId, 'Opening scene');
    else state.nodeId = null;
    return state;
  };

  RPG.currentNode = function(state, adv){
    return RPG.nodeById(adv, state.nodeId);
  };

  RPG.count = function(state, adv, key){
    return RPG.num(state.inventory[RPG.itemKey(adv, key)], 0);
  };

  RPG.isEquipped = function(state, adv, key){
    var id = RPG.itemKey(adv, key);
    var slots = Object.keys(state.equipped || {});
    for(var i=0;i<slots.length;i++){ if(state.equipped[slots[i]] === id) return true; }
    return false;
  };

  RPG.visitCount = function(state, nodeId){
    return RPG.num(state.visited[nodeId], 0);
  };

  /* Flag keys are not declared up front, so the editor offers the ones the
     adventure already mentions. Collected from every effect and condition. */
  RPG.flagKeys = function(adv){
    var seen = {};
    var add = function(list){
      (list || []).forEach(function(e){ if(e && e.type === 'flag' && e.key) seen[e.key] = true; });
    };
    (adv.nodes || []).forEach(function(n){
      add(n.entryEffects);
      (n.choices || []).forEach(function(ch){ add(ch.effects); add(ch.conditions); });
    });
    return Object.keys(seen).sort();
  };

  /* --- Conditions -------------------------------------------------------- */

  RPG.compare = function(op, a, b){
    switch(op){
      case '>=': return RPG.num(a, 0) >= RPG.num(b, 0);
      case '<=': return RPG.num(a, 0) <= RPG.num(b, 0);
      case '>': return RPG.num(a, 0) > RPG.num(b, 0);
      case '<': return RPG.num(a, 0) < RPG.num(b, 0);
      case '==': return String(a) === String(b);
      case '!=': return String(a) !== String(b);
      default: return true;
    }
  };

  RPG.testCondition = function(cond, state, adv){
    if(!cond || !cond.type) return true;
    if(cond.type === 'stat'){
      if(!RPG.statDef(adv, cond.key)) return false;
      return RPG.compare(cond.op, state.stats[cond.key], cond.value);
    }
    if(cond.type === 'trait'){
      if(!RPG.traitDef(adv, cond.key)) return false;
      var active = state.traits[cond.key] === true;
      return cond.op === 'inactive' ? !active : active;
    }
    if(cond.type === 'item'){
      var count = RPG.count(state, adv, cond.key);
      if(cond.op === '!has') return count === 0;
      if(cond.op === 'count') return count >= RPG.num(cond.value, 1);
      if(cond.op === 'countLte') return count <= RPG.num(cond.value, 1);
      return count > 0;
    }
    if(cond.type === 'equipped'){
      var on = RPG.isEquipped(state, adv, cond.key);
      return cond.op === 'isNot' ? !on : on;
    }
    if(cond.type === 'slot'){
      var filled = !!(state.equipped || {})[cond.key];
      return cond.op === 'empty' ? !filled : filled;
    }
    if(cond.type === 'flag'){
      var set = (state.flags || {})[cond.key] === true;
      return cond.op === 'unset' ? !set : set;
    }
    if(cond.type === 'visited'){
      var seen = RPG.visitCount(state, cond.key) > 0;
      return cond.op === 'no' ? !seen : seen;
    }
    return true;
  };

  /* A choice's requirements, with the unmet ones named. `logic` is 'all' by
     default; 'any' means one satisfied requirement is enough. */
  RPG.testChoice = function(choice, state, adv){
    var conds = (choice && choice.conditions) || [];
    if(!conds.length) return { ok: true, unmet: [], logic: 'all' };
    var logic = choice.condLogic === 'any' ? 'any' : 'all';
    var unmet = [];
    var passed = 0;
    conds.forEach(function(cond){
      if(RPG.testCondition(cond, state, adv)) passed++;
      else unmet.push(RPG.describeCondition(cond, adv));
    });
    var ok = logic === 'any' ? passed > 0 : unmet.length === 0;
    return { ok: ok, unmet: unmet, logic: logic };
  };

  /* Whether a locked choice is shown greyed out or removed entirely. */
  RPG.choiceHidden = function(choice, adv){
    var mode = (choice && choice.whenLocked) || 'inherit';
    if(mode === 'hide') return true;
    if(mode === 'lock') return false;
    return RPG.rules(adv).lockedChoices === 'hide';
  };

  /* Every choice on a node, resolved: what is takeable, what is locked and
     why, and what the reader never sees. */
  RPG.choiceStates = function(node, state, adv){
    return ((node && node.choices) || []).map(function(ch, idx){
      var test = RPG.testChoice(ch, state, adv);
      return {
        index: idx,
        choice: ch,
        ok: test.ok,
        unmet: test.unmet,
        logic: test.logic,
        hidden: !test.ok && RPG.choiceHidden(ch, adv),
        broken: !ch.targetNodeId || !RPG.nodeById(adv, ch.targetNodeId)
      };
    });
  };

  RPG.openChoices = function(node, state, adv){
    return RPG.choiceStates(node, state, adv).filter(function(c){ return c.ok && !c.broken; });
  };

  /* A dead end is a scene the reader cannot leave that the author never marked
     as an ending — the distinction the author needs to see. */
  RPG.isDeadEnd = function(node, state, adv){
    if(!node || node.kind === 'ending') return false;
    return RPG.openChoices(node, state, adv).length === 0;
  };

  RPG.describeCondition = function(cond, adv){
    if(!cond || !cond.type) return 'no requirement';
    /* A half-filled row is reported as unfinished rather than described as if
       it meant something, which is what validation and the locked-choice
       reasons both need to say. */
    if(cond.type !== 'flag' && !cond.key) return 'an unfinished requirement';
    if(cond.type === 'stat'){
      var words = { '>=':'is at least', '<=':'is at most', '>':'is above', '<':'is below', '==':'equals', '!=':'is not' };
      return RPG.statLabel(adv, cond.key) + ' ' + (words[cond.op] || 'is') + ' ' + (cond.value === '' || cond.value === undefined ? '0' : cond.value);
    }
    if(cond.type === 'trait'){
      return (cond.op === 'inactive' ? 'does not have the trait ' : 'has the trait ') + RPG.traitLabel(adv, cond.key);
    }
    if(cond.type === 'item'){
      var name = RPG.itemName(adv, cond.key);
      if(cond.op === '!has') return 'is not carrying ' + name;
      if(cond.op === 'count') return 'is carrying at least ' + RPG.num(cond.value, 1) + ' × ' + name;
      if(cond.op === 'countLte') return 'is carrying at most ' + RPG.num(cond.value, 1) + ' × ' + name;
      return 'is carrying ' + name;
    }
    if(cond.type === 'equipped'){
      return (cond.op === 'isNot' ? 'does not have ' : 'has ') + RPG.itemName(adv, cond.key) + ' equipped';
    }
    if(cond.type === 'slot'){
      return cond.op === 'empty' ? 'has nothing in the ' + cond.key + ' slot' : 'has something in the ' + cond.key + ' slot';
    }
    if(cond.type === 'flag'){
      return 'the flag ' + (cond.key || '(unnamed)') + (cond.op === 'unset' ? ' is not set' : ' is set');
    }
    if(cond.type === 'visited'){
      return (cond.op === 'no' ? 'has not visited ' : 'has visited ') + RPG.nodeTitle(adv, cond.key);
    }
    return 'unrecognised requirement';
  };

  /* --- Effects ----------------------------------------------------------- */

  RPG.describeEffect = function(eff, adv){
    if(!eff || !eff.type) return 'does nothing';
    /* Same courtesy as conditions: an unfinished row says so instead of
       pretending to mean something. */
    if(eff.type !== 'flag' && eff.type !== 'end' && !eff.key) return 'an unfinished change';
    if(eff.type === 'stat'){
      var label = RPG.statLabel(adv, eff.key);
      var val = (eff.value === '' || eff.value === undefined) ? '0' : eff.value;
      if(eff.op === 'set') return label + ' becomes ' + val;
      if(eff.op === 'subtract') return label + ' -' + val;
      return label + ' +' + val;
    }
    if(eff.type === 'trait'){
      var tl = RPG.traitLabel(adv, eff.key);
      if(eff.op === 'toggle') return 'flip the trait ' + tl;
      if(eff.op === 'remove') return 'lose the trait ' + tl;
      if(eff.op === 'grant') return 'gain the trait ' + tl;
      return (eff.value === 'false' || eff.value === false ? 'lose the trait ' : 'gain the trait ') + tl;
    }
    if(eff.type === 'inventory'){
      var qty = Math.max(1, RPG.num(eff.value, 1));
      var name = RPG.itemName(adv, eff.key);
      return (eff.op === 'remove' ? 'lose ' : 'gain ') + name + (qty > 1 ? ' ×' + qty : '');
    }
    if(eff.type === 'equip'){
      if(eff.op === 'unequip') return 'unequip ' + RPG.itemName(adv, eff.key);
      return 'equip ' + RPG.itemName(adv, eff.key);
    }
    if(eff.type === 'flag'){
      return (eff.op === 'clear' ? 'clear the flag ' : 'set the flag ') + (eff.key || '(unnamed)');
    }
    if(eff.type === 'goto'){
      return 'send the reader to ' + RPG.nodeTitle(adv, eff.key);
    }
    if(eff.type === 'end'){
      return (eff.op === 'failure' ? 'end the run in failure' : 'end the run') + (eff.key ? ': ' + eff.key : '');
    }
    return 'unrecognised change';
  };

  /* Effects are applied in the order the author listed them. Each one that
     actually changes something appends a record, which is what the playthrough
     log and the exported game both display. */
  RPG.applyEffects = function(effects, state, adv){
    var result = { changes: [], redirect: null, ended: null };
    (effects || []).forEach(function(eff){
      if(!eff || !eff.type) return;
      var text = null;
      var kind = 'info';

      if(eff.type === 'stat'){
        var def = RPG.statDef(adv, eff.key);
        if(!def) return;
        var before = state.stats[eff.key];
        var next;
        if(def.type === 'number'){
          var cur = RPG.num(before, 0);
          if(eff.op === 'set') next = RPG.num(eff.value, 0);
          else if(eff.op === 'subtract') next = cur - RPG.num(eff.value, 0);
          else next = cur + RPG.num(eff.value, 0);
          next = RPG.clampStat(def, next);
        } else if(def.type === 'boolean'){
          next = eff.value === true || eff.value === 'true';
        } else {
          next = String(eff.value === undefined ? '' : eff.value);
        }
        if(String(next) === String(before)) return;
        state.stats[eff.key] = next;
        text = (def.label || def.key) + ': ' + before + ' → ' + next;
        kind = (def.type === 'number' && RPG.num(next, 0) < RPG.num(before, 0)) ? 'down' : 'up';

      } else if(eff.type === 'trait'){
        var tdef = RPG.traitDef(adv, eff.key);
        if(!tdef) return;
        var was = state.traits[eff.key] === true;
        var now;
        if(eff.op === 'toggle') now = !was;
        else if(eff.op === 'remove') now = false;
        else if(eff.op === 'grant') now = true;
        else now = !(eff.value === 'false' || eff.value === false);
        if(now === was) return;
        state.traits[eff.key] = now;
        text = (now ? 'Gained trait: ' : 'Lost trait: ') + (tdef.label || tdef.key);
        kind = now ? 'up' : 'down';

      } else if(eff.type === 'inventory'){
        var key = RPG.itemKey(adv, eff.key);
        if(!key) return;
        var idef = RPG.itemDef(adv, eff.key);
        var name = RPG.itemName(adv, eff.key);
        var qty = Math.max(1, RPG.num(eff.value, 1));
        var held = RPG.num(state.inventory[key], 0);
        if(eff.op === 'remove'){
          if(held <= 0) return;
          var taken = Math.min(held, qty);
          var left = held - taken;
          if(left > 0) state.inventory[key] = left;
          else {
            delete state.inventory[key];
            /* An item you no longer carry cannot stay equipped. */
            Object.keys(state.equipped || {}).forEach(function(slot){
              if(state.equipped[slot] === key) delete state.equipped[slot];
            });
          }
          text = 'Lost ' + name + (taken > 1 ? ' ×' + taken : '');
          kind = 'down';
        } else {
          /* A non-stackable item is a single object: holding one is holding it. */
          var cap = idef && idef.stackable ? Math.max(1, RPG.num(idef.maxStack, 1)) : 1;
          var next2 = Math.min(cap, held + qty);
          if(next2 === held) return;
          state.inventory[key] = next2;
          text = 'Gained ' + name + ((next2 - held) > 1 ? ' ×' + (next2 - held) : '');
          kind = 'up';
        }

      } else if(eff.type === 'equip'){
        var ekey = RPG.itemKey(adv, eff.key);
        var edef = RPG.itemDef(adv, eff.key);
        var slot = edef && edef.slot && edef.slot !== 'none' ? edef.slot : null;
        if(eff.op === 'unequip'){
          var found = null;
          Object.keys(state.equipped || {}).forEach(function(s){ if(state.equipped[s] === ekey) found = s; });
          if(!found) return;
          delete state.equipped[found];
          text = 'Unequipped ' + RPG.itemName(adv, eff.key);
          kind = 'down';
        } else {
          if(!slot) return;
          if(RPG.num(state.inventory[ekey], 0) <= 0) return;
          if(state.equipped[slot] === ekey) return;
          state.equipped[slot] = ekey;
          text = 'Equipped ' + RPG.itemName(adv, eff.key) + ' (' + slot + ')';
          kind = 'up';
        }

      } else if(eff.type === 'flag'){
        if(!eff.key) return;
        var setNow = eff.op !== 'clear';
        if(((state.flags || {})[eff.key] === true) === setNow) return;
        if(setNow) state.flags[eff.key] = true; else delete state.flags[eff.key];
        text = (setNow ? 'Flag set: ' : 'Flag cleared: ') + eff.key;

      } else if(eff.type === 'goto'){
        if(!RPG.nodeById(adv, eff.key)) return;
        result.redirect = eff.key;
        text = 'Sent to ' + RPG.nodeTitle(adv, eff.key);

      } else if(eff.type === 'end'){
        result.ended = {
          kind: eff.op === 'failure' ? 'failure' : 'ending',
          label: eff.key || (eff.op === 'failure' ? 'Run over' : 'The End'),
          message: eff.value || ''
        };
        text = 'Run ended: ' + result.ended.label;
        kind = eff.op === 'failure' ? 'down' : 'info';
      }

      if(text) result.changes.push({ text: text, kind: kind });
    });
    return result;
  };

  /* --- Failure rules ----------------------------------------------------- */

  /* Stat thresholds that stop a run — health hitting zero being the obvious
     one. The first matching rule wins so the outcome is never ambiguous. */
  RPG.failureHit = function(state, adv){
    var rules = RPG.rules(adv).failures;
    for(var i=0;i<rules.length;i++){
      var r = rules[i];
      if(!r || !r.statKey || !RPG.statDef(adv, r.statKey)) continue;
      if(RPG.compare(r.op || '<=', state.stats[r.statKey], r.value)) return r;
    }
    return null;
  };

  RPG.describeFailure = function(rule, adv){
    var words = { '>=':'reaches', '<=':'drops to', '>':'goes above', '<':'falls below', '==':'equals', '!=':'is not' };
    return RPG.statLabel(adv, rule.statKey) + ' ' + (words[rule.op || '<='] || 'reaches') + ' ' + RPG.num(rule.value, 0);
  };

  /* --- Movement ---------------------------------------------------------- */

  /* Entering a scene is a fixed sequence: arrive, count the visit, run the
     scene's entry effects, honour a redirect, then check for failure or an
     ending. Redirect chains are capped so a loop cannot hang the reader. */
  RPG.enter = function(state, adv, nodeId, reason){
    var entry = { nodeId: nodeId, title: RPG.nodeTitle(adv, nodeId), reason: reason || '', changes: [] };
    var hops = 0;

    while(nodeId && hops < 12){
      state.nodeId = nodeId;
      state.visited[nodeId] = RPG.visitCount(state, nodeId) + 1;
      var node = RPG.nodeById(adv, nodeId);
      if(!node) break;

      var res = RPG.applyEffects(node.entryEffects, state, adv);
      entry.changes = entry.changes.concat(res.changes);

      if(res.ended){ state.ended = res.ended; break; }

      var fail = RPG.failureHit(state, adv);
      if(fail){
        state.ended = { kind: 'failure', label: fail.label || 'Run over', message: fail.message || RPG.describeFailure(fail, adv) };
        break;
      }

      if(node.kind === 'ending'){
        state.ended = { kind: 'ending', label: node.endingLabel || node.title || 'The End', message: '' };
        break;
      }

      if(res.redirect && res.redirect !== nodeId){ nodeId = res.redirect; hops++; continue; }
      break;
    }

    if(hops >= 12) entry.changes.push({ text: 'Redirect loop stopped after 12 hops', kind: 'down' });
    entry.title = RPG.nodeTitle(adv, state.nodeId);
    state.step++;
    state.log.push(entry);
    return entry;
  };

  /* One reader decision, start to finish. Returns the log entry, or null when
     the choice was not actually available — the guard that keeps a stale
     rendering from letting a locked choice through. */
  RPG.choose = function(state, adv, choiceIndex){
    if(state.ended) return null;
    var node = RPG.currentNode(state, adv);
    if(!node) return null;
    var choice = (node.choices || [])[choiceIndex];
    if(!choice) return null;
    if(!RPG.testChoice(choice, state, adv).ok) return null;
    var target = RPG.nodeById(adv, choice.targetNodeId);
    if(!target) return null;

    var res = RPG.applyEffects(choice.effects, state, adv);
    var destination = res.redirect || choice.targetNodeId;

    if(res.ended){
      state.ended = res.ended;
      state.step++;
      var stop = { nodeId: state.nodeId, title: RPG.nodeTitle(adv, state.nodeId), reason: choice.label || 'Choice', changes: res.changes };
      state.log.push(stop);
      return stop;
    }

    var entry = RPG.enter(state, adv, destination, choice.label || 'Choice');
    entry.changes = res.changes.concat(entry.changes);
    return entry;
  };

  /* Reader-driven equipping from the inventory panel, held to the same rules
     as an equip effect. */
  RPG.toggleEquip = function(state, adv, itemKey){
    var def = RPG.itemDef(adv, itemKey);
    if(!def || !def.slot || def.slot === 'none') return null;
    var op = RPG.isEquipped(state, adv, itemKey) ? 'unequip' : 'equip';
    var res = RPG.applyEffects([{ type:'equip', op: op, key: itemKey }], state, adv);
    return res.changes[0] || null;
  };

  /* --- Snapshots --------------------------------------------------------- */

  /* Step Back needs a real previous state, not a rewound node id: a run that
     spent gold and walked back a scene should still be poorer. Snapshots are
     plain data, so a structural copy is enough. */
  RPG.snapshot = function(state){
    return JSON.parse(JSON.stringify(state));
  };

  /* --- Panels ------------------------------------------------------------ */

  /* One description of what the reader should see, used by the Playthrough
     inspector and the exported game so the two cannot disagree. */
  RPG.statRows = function(state, adv){
    return (adv.stats || []).map(function(s){
      var value = state.stats[s.key];
      var row = { key: s.key, label: s.label || s.key, type: s.type || 'number', value: value, min: null, max: null, ratio: null };
      if((s.type || 'number') === 'number' && RPG.hasLimit(s.max)){
        row.max = parseFloat(s.max);
        row.min = RPG.hasLimit(s.min) ? parseFloat(s.min) : 0;
        var span = row.max - row.min;
        row.ratio = span > 0 ? Math.max(0, Math.min(1, (RPG.num(value, 0) - row.min) / span)) : null;
      }
      return row;
    });
  };

  RPG.inventoryRows = function(state, adv){
    var keys = Object.keys(state.inventory || {});
    return keys.map(function(key){
      var def = RPG.itemDef(adv, key);
      return {
        key: key,
        name: RPG.itemName(adv, key),
        count: RPG.num(state.inventory[key], 0),
        symbol: def ? (def.symbol || '') : '',
        image: def ? (def.imageDataUrl || '') : '',
        slot: def && def.slot && def.slot !== 'none' ? def.slot : null,
        equipped: RPG.isEquipped(state, adv, key),
        missing: !def
      };
    }).sort(function(a, b){ return a.name.localeCompare(b.name); });
  };

  RPG.traitRows = function(state, adv){
    return (adv.traits || []).map(function(t){
      return { key: t.key, label: t.label || t.key, active: state.traits[t.key] === true, description: t.description || '' };
    });
  };

  RPG.equipRows = function(state, adv){
    return RPG.SLOTS.map(function(slot){
      var key = (state.equipped || {})[slot];
      return { slot: slot, key: key || null, name: key ? RPG.itemName(adv, key) : null };
    });
  };

  /* --- Checkup ----------------------------------------------------------- */

  /* Finds the mistakes a branching story hides from its author: scenes nobody
     can reach, choices that lead nowhere, and requirements or changes that name
     something the author has since deleted. Reports only, never repairs. */
  RPG.audit = function(adv){
    var issues = [];
    var nodes = adv.nodes || [];
    var byId = {};
    nodes.forEach(function(n){ byId[n.id] = n; });

    function add(level, scope, text, nodeId){
      issues.push({ level: level, scope: scope, text: text, nodeId: nodeId || null });
    }

    if(!nodes.length){
      add('problem', 'Story', 'There are no scenes yet, so there is nothing to play.');
      return { issues: issues, problems: 0, warnings: issues.length, ok: false };
    }

    var startId = adv.startNodeId;
    if(!startId || !byId[startId]){
      add('problem', 'Story', 'No opening scene is set, so a reader has nowhere to begin.');
    }

    /* Reachability follows choices and redirect effects, because a scene reached
       only by a redirect is still reachable. */
    var seen = {};
    var queue = startId && byId[startId] ? [startId] : [];
    if(queue.length) seen[startId] = true;
    while(queue.length){
      var node = byId[queue.shift()];
      if(!node) continue;
      var targets = [];
      (node.choices || []).forEach(function(ch){ if(ch.targetNodeId) targets.push(ch.targetNodeId); });
      var pools = [node.entryEffects || []];
      (node.choices || []).forEach(function(ch){ pools.push(ch.effects || []); });
      pools.forEach(function(list){
        list.forEach(function(eff){ if(eff && eff.type === 'goto' && eff.key) targets.push(eff.key); });
      });
      targets.forEach(function(t){
        if(byId[t] && !seen[t]){ seen[t] = true; queue.push(t); }
      });
    }

    var statKeys = {}, traitKeys = {}, itemKeys = {}, flagsUsed = {}, flagsSet = {};
    (adv.stats || []).forEach(function(s){ statKeys[s.key] = true; });
    (adv.traits || []).forEach(function(t){ traitKeys[t.key] = true; });
    (adv.items || []).forEach(function(it){
      itemKeys[it.id] = true;
      if(it.name) itemKeys[String(it.name).toLowerCase()] = true;
    });

    function knownItem(key){ return itemKeys[key] || itemKeys[String(key || '').toLowerCase()]; }

    function checkCondition(cond, where, nodeId){
      if(!cond) return;
      var t = cond.type || 'stat';
      if(t === 'flag'){
        if(!cond.key) add('problem', where, 'A requirement has no flag name, so it can never be met.', nodeId);
        else flagsUsed[cond.key] = true;
        return;
      }
      if(t === 'visited'){
        if(!cond.key) add('problem', where, 'A requirement does not say which scene must have been visited.', nodeId);
        else if(!byId[cond.key]) add('problem', where, 'A requirement points at a scene that no longer exists.', nodeId);
        return;
      }
      if(t === 'slot'){
        if(!cond.key) add('problem', where, 'A requirement does not say which gear slot to check.', nodeId);
        return;
      }
      if(!cond.key){
        add('problem', where, 'A requirement is unfinished, so the choice stays locked forever.', nodeId);
        return;
      }
      if(t === 'stat'){
        if(!statKeys[cond.key]){ add('problem', where, 'A requirement uses the stat "'+cond.key+'", which no longer exists.', nodeId); return; }
        var def = RPG.statDef(adv, cond.key);
        if(def && (def.type || 'number') === 'number'){
          var v = RPG.num(cond.value, 0);
          if(RPG.hasLimit(def.max) && (cond.op === '>=' || cond.op === '>') && v > parseFloat(def.max)){
            add('problem', where, 'A requirement waits for '+(def.label||cond.key)+' above its maximum of '+def.max+', which can never happen.', nodeId);
          }
          if(RPG.hasLimit(def.min) && (cond.op === '<=' || cond.op === '<') && v < parseFloat(def.min)){
            add('problem', where, 'A requirement waits for '+(def.label||cond.key)+' below its minimum of '+def.min+', which can never happen.', nodeId);
          }
        }
      } else if(t === 'trait'){
        if(!traitKeys[cond.key]) add('problem', where, 'A requirement uses the trait "'+cond.key+'", which no longer exists.', nodeId);
      } else if(t === 'item' || t === 'equipped'){
        if(!knownItem(cond.key)) add('problem', where, 'A requirement uses the item "'+cond.key+'", which no longer exists.', nodeId);
      }
    }

    function checkEffect(eff, where, nodeId){
      if(!eff) return;
      var t = eff.type || 'stat';
      if(t === 'end') return;
      if(t === 'flag'){
        if(!eff.key) add('problem', where, 'A change has no flag name, so it does nothing.', nodeId);
        else if(eff.op === 'set') flagsSet[eff.key] = true;
        return;
      }
      if(!eff.key){
        add('problem', where, 'A change is unfinished, so it does nothing.', nodeId);
        return;
      }
      if(t === 'stat'){
        if(!statKeys[eff.key]) add('problem', where, 'A change writes to the stat "'+eff.key+'", which no longer exists.', nodeId);
      } else if(t === 'trait'){
        if(!traitKeys[eff.key]) add('problem', where, 'A change writes to the trait "'+eff.key+'", which no longer exists.', nodeId);
      } else if(t === 'inventory'){
        if(!knownItem(eff.key)) add('problem', where, 'A change gives or takes the item "'+eff.key+'", which no longer exists.', nodeId);
      } else if(t === 'equip'){
        if(!knownItem(eff.key)) add('problem', where, 'A change equips the item "'+eff.key+'", which no longer exists.', nodeId);
        else {
          var item = RPG.itemDef(adv, eff.key);
          if(item && (!item.slot || item.slot === 'none')) add('warning', where, RPG.itemName(adv, eff.key)+' has no gear slot, so it cannot be equipped.', nodeId);
        }
      } else if(t === 'goto'){
        if(!byId[eff.key]) add('problem', where, 'A change sends the reader to a scene that no longer exists.', nodeId);
      }
    }

    nodes.forEach(function(node){
      var where = node.title || 'Untitled scene';
      if(!seen[node.id] && node.id !== startId){
        add('warning', where, 'No path from the opening scene reaches this one.', node.id);
      }
      if(!(node.text || '').trim()) add('warning', where, 'The scene has no text for the reader.', node.id);
      (node.entryEffects || []).forEach(function(eff){ checkEffect(eff, where, node.id); });
      var open = 0;
      (node.choices || []).forEach(function(ch){
        if(!(ch.label || '').trim()) add('warning', where, 'A choice has no label, so its button reads "Continue".', node.id);
        if(!ch.targetNodeId) add('problem', where, 'The choice "'+(ch.label || 'Continue')+'" does not lead anywhere yet.', node.id);
        else if(!byId[ch.targetNodeId]) add('problem', where, 'The choice "'+(ch.label || 'Continue')+'" leads to a scene that no longer exists.', node.id);
        else open++;
        (ch.conditions || []).forEach(function(cond){ checkCondition(cond, where, node.id); });
        (ch.effects || []).forEach(function(eff){ checkEffect(eff, where, node.id); });
      });
      var endsHere = node.kind === 'ending';
      var redirects = (node.entryEffects || []).some(function(eff){ return eff && eff.type === 'goto' && eff.key; });
      var closes = (node.entryEffects || []).some(function(eff){ return eff && eff.type === 'end'; });
      if(!open && !endsHere && !redirects && !closes){
        add('warning', where, 'Nothing leads out of this scene, and it is not marked as an ending.', node.id);
      }
      if(endsHere && !(node.endingLabel || '').trim()){
        add('warning', where, 'This ending has no name, so the closing screen falls back to the scene title.', node.id);
      }
    });

    RPG.rules(adv).failures.forEach(function(r){
      if(!r.statKey || !statKeys[r.statKey]){
        add('problem', 'Run-ending rules', 'A rule watches a stat that no longer exists, so it never fires.');
      }
      if(!(r.label || '').trim()){
        add('warning', 'Run-ending rules', 'A rule has no title, so its closing screen reads "Run over".');
      }
    });

    Object.keys(flagsUsed).forEach(function(f){
      if(!flagsSet[f]) add('warning', 'Flags', 'The flag "'+f+'" is required somewhere but never set, so those choices stay locked.');
    });

    if(!nodes.some(function(n){ return n.kind === 'ending'; }) && !RPG.rules(adv).failures.length){
      add('warning', 'Story', 'No scene is marked as an ending and no run-ending rule exists, so a run never formally finishes.');
    }

    var problems = issues.filter(function(i){ return i.level === 'problem'; }).length;
    return { issues: issues, problems: problems, warnings: issues.length - problems, ok: !issues.length };
  };

  /* --- Export ------------------------------------------------------------ */

  /* Everything above, as source text. The exported game runs these exact
     functions, which is the only honest way to promise that a download plays
     the way the Playthrough tool did. Presentation is not included — the
     export builds its own UI on top. */
  RPG.API = ['SLOTS','statDef','traitDef','nodeById','itemDef','itemKey','itemName','statLabel',
    'traitLabel','nodeTitle','rules','num','hasLimit','clampStat','statStart','blankState',
    'newState','currentNode','count','isEquipped','visitCount','flagKeys','compare',
    'testCondition','testChoice','choiceHidden','choiceStates','openChoices','isDeadEnd',
    'describeCondition','describeEffect','applyEffects','failureHit','describeFailure','enter',
    'choose','toggleEquip','snapshot','statRows','inventoryRows','traitRows','equipRows'];

  RPG.engineSource = function(){
    var out = 'var RPG={};\n';
    RPG.API.forEach(function(key){
      var value = RPG[key];
      out += 'RPG.' + key + '=' + (typeof value === 'function' ? value.toString() : JSON.stringify(value)) + ';\n';
    });
    return out;
  };

  DAL.rpg = RPG;
})();

DAL = DAL || {};

/* --- Ensure adventure exists --- */
DAL.ensureAdventure = function(proj){
  if(!proj.adventure){
    proj.adventure = DAL.defaultAdventure(proj.name);
  }
  var adv = proj.adventure;
  /* Fields added after the first release. Filled in additively so an adventure
     saved by an earlier build opens with its work intact. */
  if(!adv.stats) adv.stats = [];
  if(!adv.traits) adv.traits = [];
  if(!adv.items) adv.items = [];
  if(!adv.nodes) adv.nodes = [];
  if(!adv.rules) adv.rules = { lockedChoices: 'lock', failures: [] };
  if(!adv.rules.failures) adv.rules.failures = [];
  adv.items.forEach(function(it){ if(!it.id) it.id = DAL.uid('item'); });
  return adv;
};

/* --- Story Graph --- */
DAL.renderStoryGraph = function(proj){
  var adv = DAL.ensureAdventure(proj);
  if(!adv.nodes) adv.nodes = [];

  var html = '<div class="canvas-toolbar">'+
