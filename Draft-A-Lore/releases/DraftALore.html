/* ============================================
   DRAFT A LORE — Complete Stylesheet
   ============================================ */

/* --- Reset & Base --- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Fluid root size: every rem-based token below scales with the viewport, so the
   same layout stays legible on a 720p phone, a 1080p laptop and a 4K monitor. */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;scroll-behavior:smooth;font-size:clamp(15px,13.6px + .2vw,19px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;line-height:1.6;font-family:var(--font-body,'Georgia','Cambria','Times New Roman',serif);font-size:1rem;color:var(--c-text);background:var(--c-bg);overflow:hidden;overscroll-behavior:none}
img,picture,canvas,svg{display:block;max-width:100%;height:auto}
input,button,textarea,select{font:inherit;color:inherit;background:none;border:none}
button{cursor:pointer}
table{border-collapse:collapse;width:100%}
::selection{background:color-mix(in oklab,var(--c-accent) 25%,transparent);color:var(--c-text)}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px;border-radius:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
a,button,[role=button],input,textarea,select{transition:color 180ms cubic-bezier(.16,1,.3,1),background 180ms cubic-bezier(.16,1,.3,1),border-color 180ms cubic-bezier(.16,1,.3,1),box-shadow 180ms cubic-bezier(.16,1,.3,1),transform 120ms ease}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* --- Type Scale --- */
:root{
  --ts-xs:clamp(.75rem,.7rem+.2vw,.875rem);
  --ts-sm:clamp(.875rem,.8rem+.3vw,1rem);
  --ts-base:clamp(1rem,.95rem+.2vw,1.125rem);
  --ts-lg:clamp(1.125rem,1rem+.6vw,1.5rem);
  --ts-xl:clamp(1.5rem,1.2rem+1vw,2rem);
  --radius:8px;
  --radius-sm:4px;
  --radius-lg:14px;
  --transition:180ms cubic-bezier(.16,1,.3,1);
  --sidebar-w:220px;
  --sidebar-w-collapsed:48px;
  --topbar-h:52px;
  /* Pill radius used by .chip / .tag / the mobile tab indicator. */
  --radius-full:999px;
}

/* --- Theme: Slate --- */
:root[data-theme="slate"]{
  --c-bg:var(--p-slate-bg); --c-surface:#12181F; --c-surface-2:#18202A; --c-panel:#151C24;
  --c-border:#26303C; --c-divider:#1E2630;
  --c-text:#E9EFF6; --c-text-muted:#A3B1C2; --c-text-faint:#78889A;
  --c-accent:#3B82F6; --c-accent-hover:#60A5FA; --c-accent-soft:rgba(59,130,246,.12);
  --c-on-accent:#EFF6FF;
  --c-success:#22C55E; --c-danger:#EF4444; --c-warning:#F59E0B; --c-info:#38BDF8;
  --c-brand-1:var(--p-slate-1); --c-brand-2:var(--p-slate-2); --c-brand-3:var(--p-slate-3);
  --c-btn-1:#1D4ED8; --c-btn-2:#2563EB; --c-btn-3:#4F46E5;
  --c-brand-wash:rgba(37,99,235,.10);
  --c-brand-glow:rgba(56,189,248,.22);
  --c-brand-edge:rgba(56,189,248,.16);
  --c-brand-edge-strong:rgba(56,189,248,.30);
  --c-selection:rgba(59,130,246,.25);
  --shadow-sm:0 1px 3px rgba(0,0,0,.4);
  --shadow-md:0 4px 12px rgba(0,0,0,.5);
  --shadow-lg:0 12px 32px rgba(0,0,0,.6);
  --font-display:'Optima','Candara','Segoe UI',system-ui,sans-serif;
  --font-body:system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:'Courier New',monospace;
}

/* --- Theme identity ---
   These rules are theme-agnostic: each one reads the active theme's brand
   tokens, so all ten themes get the same gradient treatment without a block
   per theme. The [data-theme] prefix only exists to outrank the plain
   component rules further down the file. */
.brand-text{
  font-family:var(--font-display);
  font-weight:700;
  background:linear-gradient(135deg,var(--c-brand-1),var(--c-brand-2),var(--c-brand-3));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  color:transparent;
  letter-spacing:.5px;
}
.sidebar-logo img{
  width:28px;height:28px;flex-shrink:0;
  filter:drop-shadow(0 0 4px var(--c-brand-glow));
}
.sidebar-logo .brand-text{font-size:var(--ts-sm);white-space:nowrap}
:root[data-theme] .nav-item.active{background:linear-gradient(90deg,var(--c-brand-wash),transparent)}
/* Primary buttons use their own stops: the branding trio carries no text, so it
   stays vivid, while these are picked for legibility under --c-on-accent. */
:root[data-theme] .btn.primary{
  background:linear-gradient(135deg,var(--c-btn-1),var(--c-btn-2));
  border-color:transparent;color:var(--c-on-accent)
}
:root[data-theme] .btn.primary:hover{background:linear-gradient(135deg,var(--c-btn-2),var(--c-btn-3))}
:root[data-theme] .progress-fill{background:linear-gradient(90deg,var(--c-brand-1),var(--c-brand-3))}
:root[data-theme] .save-dot{background:var(--c-brand-2)}
:root[data-theme] ::selection{background:var(--c-selection);color:var(--c-text)}
:root[data-theme] .card{border-color:var(--c-brand-edge)}
:root[data-theme] .card.hoverable:hover{box-shadow:0 4px 20px var(--c-brand-glow);border-color:var(--c-brand-edge-strong)}

/* --- Settings theme picker swatches ---
   One rule per theme, each pointing at that theme's palette values. */
.theme-option[data-swatch]{background:var(--sw-panel);color:var(--sw-text);border-color:var(--sw-border)}
.theme-option[data-swatch] .theme-option-desc{color:var(--sw-muted)}
.theme-chip-bg{background:var(--sw-bg)}
.theme-chip-grad{background:var(--sw-grad)}
.theme-option[data-swatch="aurora"]{--sw-bg:var(--p-aurora-bg);--sw-grad:linear-gradient(135deg,var(--p-aurora-1),var(--p-aurora-2),var(--p-aurora-3));--sw-panel:var(--p-aurora-panel);--sw-text:var(--p-aurora-text);--sw-muted:var(--p-aurora-muted);--sw-border:var(--p-aurora-border)}
.theme-option[data-swatch="dark"]{--sw-bg:var(--p-dark-bg);--sw-grad:linear-gradient(135deg,var(--p-dark-1),var(--p-dark-2),var(--p-dark-3));--sw-panel:var(--p-dark-panel);--sw-text:var(--p-dark-text);--sw-muted:var(--p-dark-muted);--sw-border:var(--p-dark-border)}
.theme-option[data-swatch="light"]{--sw-bg:var(--p-light-bg);--sw-grad:linear-gradient(135deg,var(--p-light-1),var(--p-light-2),var(--p-light-3));--sw-panel:var(--p-light-panel);--sw-text:var(--p-light-text);--sw-muted:var(--p-light-muted);--sw-border:var(--p-light-border)}
.theme-option[data-swatch="fantasy-dark"]{--sw-bg:var(--p-fantasy-dark-bg);--sw-grad:linear-gradient(135deg,var(--p-fantasy-dark-1),var(--p-fantasy-dark-2),var(--p-fantasy-dark-3));--sw-panel:var(--p-fantasy-dark-panel);--sw-text:var(--p-fantasy-dark-text);--sw-muted:var(--p-fantasy-dark-muted);--sw-border:var(--p-fantasy-dark-border)}
.theme-option[data-swatch="fantasy-light"]{--sw-bg:var(--p-fantasy-light-bg);--sw-grad:linear-gradient(135deg,var(--p-fantasy-light-1),var(--p-fantasy-light-2),var(--p-fantasy-light-3));--sw-panel:var(--p-fantasy-light-panel);--sw-text:var(--p-fantasy-light-text);--sw-muted:var(--p-fantasy-light-muted);--sw-border:var(--p-fantasy-light-border)}
.theme-option[data-swatch="nebula"]{--sw-bg:var(--p-nebula-bg);--sw-grad:linear-gradient(135deg,var(--p-nebula-1),var(--p-nebula-2),var(--p-nebula-3));--sw-panel:var(--p-nebula-panel);--sw-text:var(--p-nebula-text);--sw-muted:var(--p-nebula-muted);--sw-border:var(--p-nebula-border)}
.theme-option[data-swatch="ember"]{--sw-bg:var(--p-ember-bg);--sw-grad:linear-gradient(135deg,var(--p-ember-1),var(--p-ember-2),var(--p-ember-3));--sw-panel:var(--p-ember-panel);--sw-text:var(--p-ember-text);--sw-muted:var(--p-ember-muted);--sw-border:var(--p-ember-border)}
.theme-option[data-swatch="sakura"]{--sw-bg:var(--p-sakura-bg);--sw-grad:linear-gradient(135deg,var(--p-sakura-1),var(--p-sakura-2),var(--p-sakura-3));--sw-panel:var(--p-sakura-panel);--sw-text:var(--p-sakura-text);--sw-muted:var(--p-sakura-muted);--sw-border:var(--p-sakura-border)}
.theme-option[data-swatch="moss"]{--sw-bg:var(--p-moss-bg);--sw-grad:linear-gradient(135deg,var(--p-moss-1),var(--p-moss-2),var(--p-moss-3));--sw-panel:var(--p-moss-panel);--sw-text:var(--p-moss-text);--sw-muted:var(--p-moss-muted);--sw-border:var(--p-moss-border)}
.theme-option[data-swatch="slate"]{--sw-bg:var(--p-slate-bg);--sw-grad:linear-gradient(135deg,var(--p-slate-1),var(--p-slate-2),var(--p-slate-3));--sw-panel:var(--p-slate-panel);--sw-text:var(--p-slate-text);--sw-muted:var(--p-slate-muted);--sw-border:var(--p-slate-border)}

/* --- Settings theme picker ---
   Ten options, so the grid fills the width it has and each option stays a
   comfortable tap target rather than shrinking to fit a fixed column count. */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:20px}
.theme-option{cursor:pointer;padding:14px}
.theme-option.active{border:2px solid var(--c-accent);padding:13px}
.theme-option-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.theme-option-name{font-weight:700}
.theme-option-desc{font-size:var(--ts-xs);color:var(--c-text-muted);line-height:1.5}
.theme-chip{width:18px;height:18px;border-radius:var(--radius-sm);border:1px solid var(--c-border);flex-shrink:0}

/* --- Settings theme picker swatches ---
   One rule per theme, each pointing at that theme's palette values. */
.theme-chip-bg{background:var(--sw-bg)}
.theme-chip-grad{background:var(--sw-grad)}
.theme-option[data-swatch="aurora"]{--sw-bg:var(--p-aurora-bg);--sw-grad:linear-gradient(135deg,var(--p-aurora-1),var(--p-aurora-2),var(--p-aurora-3))}
.theme-option[data-swatch="dark"]{--sw-bg:var(--p-dark-bg);--sw-grad:linear-gradient(135deg,var(--p-dark-1),var(--p-dark-2),var(--p-dark-3))}
.theme-option[data-swatch="light"]{--sw-bg:var(--p-light-bg);--sw-grad:linear-gradient(135deg,var(--p-light-1),var(--p-light-2),var(--p-light-3))}
.theme-option[data-swatch="fantasy-dark"]{--sw-bg:var(--p-fantasy-dark-bg);--sw-grad:linear-gradient(135deg,var(--p-fantasy-dark-1),var(--p-fantasy-dark-2),var(--p-fantasy-dark-3))}
.theme-option[data-swatch="fantasy-light"]{--sw-bg:var(--p-fantasy-light-bg);--sw-grad:linear-gradient(135deg,var(--p-fantasy-light-1),var(--p-fantasy-light-2),var(--p-fantasy-light-3))}
.theme-option[data-swatch="nebula"]{--sw-bg:var(--p-nebula-bg);--sw-grad:linear-gradient(135deg,var(--p-nebula-1),var(--p-nebula-2),var(--p-nebula-3))}
.theme-option[data-swatch="ember"]{--sw-bg:var(--p-ember-bg);--sw-grad:linear-gradient(135deg,var(--p-ember-1),var(--p-ember-2),var(--p-ember-3))}
.theme-option[data-swatch="sakura"]{--sw-bg:var(--p-sakura-bg);--sw-grad:linear-gradient(135deg,var(--p-sakura-1),var(--p-sakura-2),var(--p-sakura-3))}
.theme-option[data-swatch="moss"]{--sw-bg:var(--p-moss-bg);--sw-grad:linear-gradient(135deg,var(--p-moss-1),var(--p-moss-2),var(--p-moss-3))}
.theme-option[data-swatch="slate"]{--sw-bg:var(--p-slate-bg);--sw-grad:linear-gradient(135deg,var(--p-slate-1),var(--p-slate-2),var(--p-slate-3))}

/* --- Layout Shell ---
   --app-h is set by DAL.applyViewport() from visualViewport so mobile browser
   chrome and on-screen keyboards can't push the UI off screen; the vh/dvh
   values are the progressive fallbacks. */
#app{display:flex;height:100vh;height:100dvh;height:var(--app-h,100dvh);width:100%;overflow:hidden;position:relative}

/* Sidebar */
.sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--c-surface);border-right:1px solid var(--c-border);display:flex;flex-direction:column;transition:width var(--transition);z-index:10}
.sidebar.collapsed{width:var(--sidebar-w-collapsed)}
.sidebar-logo{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--c-border);height:var(--topbar-h);flex-shrink:0;overflow:hidden}
.sidebar-logo svg{flex-shrink:0;width:24px;height:24px}
.sidebar-logo span{font-family:var(--font-display);font-weight:700;font-size:var(--ts-sm);white-space:nowrap;color:var(--c-accent)}
.sidebar.collapsed .sidebar-logo span{display:none}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.sidebar.collapsed .sidebar-nav .nav-label{display:none}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:var(--ts-sm);color:var(--c-text-muted);cursor:pointer;white-space:nowrap;border-left:3px solid transparent}
.nav-item:hover{color:var(--c-text);background:var(--c-surface-2)}
.nav-item.active{color:var(--c-accent);border-left-color:var(--c-accent);animation:navGlow 2s ease-in-out infinite alternate}
.nav-item svg{flex-shrink:0;width:18px;height:18px}
.sidebar.collapsed .nav-item{justify-content:center;padding:9px}
@keyframes navGlow{from{box-shadow:inset 3px 0 0 var(--c-accent)}to{box-shadow:inset 3px 0 6px var(--c-accent-soft)}}

/* Main Area */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* Top Bar */
.topbar{height:var(--topbar-h);flex-shrink:0;background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:8px;padding:0 12px}
.topbar-title{font-size:var(--ts-sm);font-weight:600;color:var(--c-text);white-space:nowrap;margin-right:auto}
.topbar-btn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-sm);color:var(--c-text-muted)}
.topbar-btn:hover{background:var(--c-surface-2);color:var(--c-text)}
.topbar-btn:active{transform:scale(.97)}
.topbar-btn:disabled{opacity:.4;cursor:default}
.topbar-btn svg{width:16px;height:16px}
.save-status{display:flex;align-items:center;gap:6px;font-size:var(--ts-xs);color:var(--c-text-faint);padding:2px 8px}
.save-dot{width:8px;height:8px;border-radius:50%;background:var(--c-success);transition:background .3s}
.save-dot.saving{background:var(--c-warning);animation:pulse 1s infinite}
.save-dot.unsaved{background:var(--c-warning)}
.save-dot.error{background:var(--c-danger)}
.save-dot.ripple{animation:inkDrop .4s ease-out}
/* iOS-style on/off switch used in Settings (Saving card). */
.switch{position:relative;width:44px;height:26px;border-radius:13px;border:none;background:none;cursor:pointer;flex-shrink:0;padding:0}
.switch .track{position:absolute;inset:0;background:var(--c-border);border-radius:13px;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.switch[aria-pressed="true"] .track{background:var(--c-success)}
.switch[aria-pressed="true"] .track::after{transform:translateX(18px)}
.switch:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px;border-radius:14px}
@keyframes inkDrop{0%{transform:scale(1);box-shadow:0 0 0 0 var(--c-accent-soft)}100%{transform:scale(1);box-shadow:0 0 0 8px transparent}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.search-box{display:flex;align-items:center;gap:6px;background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:var(--radius);padding:4px 8px;max-width:200px}
.search-box input{background:none;border:none;outline:none;font-size:var(--ts-xs);width:100%}
.search-box svg{width:14px;height:14px;color:var(--c-text-faint);flex-shrink:0}

/* Content Area */
.content{flex:1;overflow-y:auto;padding:24px;animation:fadeIn 180ms ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* --- Components --- */

/* Cards */
.card{background:var(--c-panel);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:16px;transition:transform var(--transition),box-shadow var(--transition)}
.card.hoverable:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--ts-xs);padding:2px 8px;border-radius:var(--radius-full);background:var(--c-surface-2);color:var(--c-text-muted);border:1px solid var(--c-border)}
.badge.accent{background:var(--c-accent-soft);color:var(--c-accent);border-color:transparent}
.badge.success{color:var(--c-success)}
.badge.danger{color:var(--c-danger)}
.badge.warning{color:var(--c-warning)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:var(--ts-sm);border-radius:var(--radius);border:1px solid var(--c-border);background:var(--c-surface-2);color:var(--c-text)}
.btn:hover{background:var(--c-panel);border-color:var(--c-text-faint)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--c-accent);color:var(--c-bg);border-color:transparent;font-weight:600}
.btn.primary:hover{background:var(--c-accent-hover)}
.btn.danger{color:var(--c-danger);border-color:var(--c-danger)}
.btn.danger:hover{background:color-mix(in oklab,var(--c-danger) 12%,transparent)}
.btn.sm{padding:3px 8px;font-size:var(--ts-xs)}
.btn.icon{padding:6px;width:32px;height:32px;justify-content:center}
.btn:disabled{opacity:.4;cursor:default;transform:none}

/* Forms */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:var(--ts-xs);font-weight:600;color:var(--c-text-muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-input,.form-textarea,.form-select{width:100%;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:8px 12px;font-size:var(--ts-sm);color:var(--c-text)}
.form-input:focus,.form-textarea:focus,.form-select:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 2px var(--c-accent-soft)}
.form-textarea{resize:vertical;min-height:80px;font-family:inherit}
.form-select{cursor:pointer}
.form-row{display:flex;gap:12px;flex-wrap:wrap}
.form-row>*{flex:1;min-width:120px}

/* Progress Bars */
.progress-bar{height:6px;background:var(--c-surface-2);border-radius:var(--radius-full);overflow:hidden}
.progress-fill{height:100%;background:var(--c-accent);border-radius:var(--radius-full);transition:width .4s ease}

/* Modals */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 150ms}
.modal{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:24px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;animation:modalScale 180ms cubic-bezier(.16,1,.3,1);box-shadow:var(--shadow-lg)}
.modal.wide{max-width:700px}
@keyframes modalScale{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-family:var(--font-display);font-size:var(--ts-lg);font-weight:700}
.modal-close{color:var(--c-text-faint);font-size:24px;line-height:1;padding:4px}
.modal-close:hover{color:var(--c-text)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}

/* Toasts */
.toast-container{position:fixed;bottom:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--c-panel);border:1px solid var(--c-border);border-left:3px solid var(--c-accent);border-radius:var(--radius);padding:10px 16px;font-size:var(--ts-sm);box-shadow:var(--shadow-md);pointer-events:auto;animation:toastIn 200ms ease;max-width:320px}
.toast.success{border-left-color:var(--c-success)}
.toast.error{border-left-color:var(--c-danger)}
.toast.warning{border-left-color:var(--c-warning)}
.toast.fade-out{animation:toastOut 200ms ease forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateY(12px)}}

/* Info icons — the small "(i)" next to writing/lore tools.
   The icon is an inline-flex button the size of a line of text, so it sits
   right beside a label without pushing the layout around. The popover it
   toggles is a tiny fixed card that never captures pointer events over the
   rest of the UI — it only paints text and dismisses on any outside tap, so on
   a phone it can never sit on top of the buttons it explains. */
.info-icon{
  display:inline-flex;align-items:center;justify-content:center;
  width:1.05em;height:1.05em;min-width:18px;min-height:18px;
  margin-left:5px;padding:0;flex-shrink:0;vertical-align:middle;
  font-family:Georgia,serif;font-style:italic;font-weight:700;
  font-size:.85em;line-height:1;
  color:var(--c-text-faint);
  background:var(--c-bg-elev,var(--c-surface,#0000));
  border:1px solid var(--c-border);border-radius:999px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:color var(--transition),background var(--transition),border-color var(--transition)
}
.info-icon span{font-size:inherit;line-height:1}
.info-icon:hover,.info-icon:focus-visible{color:var(--c-accent);border-color:var(--c-accent);background:var(--c-accent-soft,transparent)}
.info-icon:active{transform:scale(.92)}
.info-popover{
  position:fixed;z-index:400;
  background:var(--c-bg);border:1px solid var(--c-border);
  border-radius:var(--radius);padding:10px 12px;
  font-size:var(--ts-xs);line-height:1.5;color:var(--c-text);
  box-shadow:var(--shadow-sm,0 4px 16px rgba(0,0,0,.25));
  max-width:min(320px,calc(100vw - 16px));width:max-content;
  pointer-events:none;opacity:0;transform:translateY(-2px);
  transition:opacity 120ms,transform 120ms
}
.info-popover.visible{opacity:1;transform:translateY(0)}

/* Empty State */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;text-align:center;color:var(--c-text-muted)}
.empty-state svg{width:48px;height:48px;margin-bottom:16px;opacity:.4}
.empty-state h3{font-size:var(--ts-lg);margin-bottom:4px;color:var(--c-text)}
.empty-state p{font-size:var(--ts-sm);margin-bottom:16px}

/* Section Headers */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-family:var(--font-display);font-size:var(--ts-lg);font-weight:700}

/* Project Workspace */
.workspace{display:flex;height:100%;overflow:hidden}
.workspace-sidebar{width:200px;flex-shrink:0;background:var(--c-surface);border-right:1px solid var(--c-border);display:flex;flex-direction:column;overflow-y:auto}
.workspace-main{flex:1;overflow-y:auto;padding:16px;min-width:0}
/* File/Edit/View menu bar lives in the project workspace header only —
   never on Dashboard/Projects/Settings. Each trigger opens a dropdown built
   from DAL.MENUS; every item routes to a real action, nothing decorative. */
.ws-menubar{display:flex;align-items:center;gap:1px;flex-shrink:0}
.menu-trigger{display:flex;align-items:center;gap:3px;height:32px;padding:0 10px;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--c-text-muted);font-size:var(--ts-sm);font-weight:600;cursor:pointer;white-space:nowrap}
.menu-trigger:hover{background:var(--c-surface-2);color:var(--c-text)}
.menu-trigger[aria-expanded="true"]{background:var(--c-surface-2);color:var(--c-text);border-color:var(--c-border)}
.menu-caret{font-size:9px;opacity:.6}
.menu-dropdown{position:fixed;z-index:5000;min-width:200px;background:var(--c-panel);border:1px solid var(--c-border);border-radius:10px;box-shadow:0 12px 32px -6px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.2);padding:5px}
.menu-item{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:7px 11px;border-radius:6px;font-size:var(--ts-sm);color:var(--c-text-muted);cursor:pointer;white-space:nowrap}
.menu-item:hover{background:var(--c-accent-soft);color:var(--c-text)}
.menu-item.has-sub{justify-content:space-between}
.menu-chev{opacity:.5;font-size:13px}
.menu-shortcut{font-size:var(--ts-xs);color:var(--c-text-faint);font-family:var(--font-mono,monospace)}
.menu-divider{height:1px;margin:4px 6px;background:var(--c-border)}
.menu-sub-dropdown{position:fixed;z-index:5001;min-width:180px;max-height:min(70vh,420px);overflow-y:auto;background:var(--c-panel);border:1px solid var(--c-border);border-radius:10px;box-shadow:0 12px 32px -6px rgba(0,0,0,.45);padding:5px;left:100%;top:-5px}
/* .save-status / .save-dot base styles already defined near line 192 —
   reused here unchanged so the menu bar's status dot matches everywhere else. */
.ws-menubar .save-status{margin-left:4px}
.workspace-topbar{height:var(--topbar-h);background:var(--c-surface);border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
.ws-nav-group-label{font-size:var(--ts-xs);font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--c-text-faint);padding:8px 16px 4px}
.ws-nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:var(--ts-sm);color:var(--c-text-muted);cursor:pointer;white-space:nowrap;border-left:3px solid transparent}
.ws-nav-item:hover{color:var(--c-text);background:var(--c-surface-2)}
.ws-nav-item.active{color:var(--c-accent);border-left-color:var(--c-accent);background:var(--c-accent-soft)}
.ws-nav-item svg{width:15px;height:15px;flex-shrink:0}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sync-dot.linked{background:var(--c-success)}
.sync-dot.unlinked{background:var(--c-text-faint)}
.sync-dot.error{background:var(--c-danger)}
.sync-dot.pending{background:var(--c-warning);animation:pulse 1s infinite}

/* Manuscript Editor */
.manuscript-layout{display:flex;height:100%;overflow:hidden}
.chapter-list{width:220px;flex-shrink:0;background:var(--c-surface);border-right:1px solid var(--c-border);display:flex;flex-direction:column;overflow:hidden}
.chapter-list-header{padding:8px 12px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between}
.chapter-list-items{flex:1;overflow-y:auto}
.chapter-item{display:flex;align-items:center;gap:6px;padding:6px 12px;font-size:var(--ts-xs);cursor:pointer;border-left:3px solid transparent}
.chapter-item:hover{background:var(--c-surface-2)}
.chapter-item.active{background:var(--c-accent-soft);border-left-color:var(--c-accent);color:var(--c-accent)}
.chapter-item .drag-handle{color:var(--c-text-faint);cursor:grab}
.chapter-item.dragging{opacity:.5}
.editor-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.editor-toolbar{display:flex;align-items:center;gap:4px;padding:4px 8px;background:var(--c-surface);border-bottom:1px solid var(--c-border);flex-wrap:wrap;flex-shrink:0}
.editor-toolbar .tb-btn{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--radius-sm);color:var(--c-text-muted)}
.editor-toolbar .tb-btn:hover{background:var(--c-surface-2);color:var(--c-text)}
.editor-toolbar .tb-btn:active{transform:scale(.97)}
.editor-toolbar .tb-btn.active{background:var(--c-accent-soft);color:var(--c-accent)}
.editor-toolbar .tb-sep{width:1px;height:20px;background:var(--c-border);margin:0 2px}
.editor-toolbar select{font-size:var(--ts-xs);padding:2px 4px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-sm)}
.editor-surface{flex:1;overflow-y:auto;padding:24px 48px}
.editor-surface .content-editable{min-height:100%;outline:none;font-size:var(--ts-base);line-height:1.8}
.editor-surface .content-editable:empty:before{content:attr(data-placeholder);color:var(--c-text-faint);font-style:italic}
.editor-footer{padding:4px 12px;background:var(--c-surface);border-top:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between;font-size:var(--ts-xs);color:var(--c-text-faint);flex-shrink:0}
.distraction-free .sidebar,.distraction-free .topbar,.distraction-free .chapter-list,.distraction-free .editor-toolbar,.distraction-free .editor-footer,.distraction-free .workspace-sidebar,.distraction-free .workspace-topbar{display:none!important}
.distraction-free .editor-surface{max-width:700px;margin:0 auto;padding:48px 24px}
.distraction-free .word-count-floating{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:var(--ts-xs);color:var(--c-text-faint);z-index:50}

/* Character Cards */
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.char-card{background:var(--c-panel);border:1px solid var(--c-border);border-radius:var(--radius-lg);padding:16px;text-align:center;cursor:pointer;transition:transform var(--transition),box-shadow var(--transition)}
.char-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.char-portrait{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;background:var(--c-surface-2);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--c-accent);overflow:hidden;border:2px solid var(--c-border)}
.char-portrait img{width:100%;height:100%;object-fit:cover}
.char-name{font-weight:600;font-size:var(--ts-sm)}
.char-role{font-size:var(--ts-xs);color:var(--c-text-muted)}

/* Relationship Map */
.rel-map-container{position:relative;width:100%;height:calc(100dvh - var(--topbar-h) - 100px);overflow:hidden;background:var(--c-surface)}
.rel-map-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.rel-node{position:absolute;background:var(--c-panel);border:2px solid var(--c-accent);border-radius:var(--radius-lg);padding:12px 16px;text-align:center;min-width:120px;cursor:pointer;transition:transform var(--transition),box-shadow var(--transition)}
.rel-node:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.rel-node.center{border-color:var(--c-accent);box-shadow:0 0 0 4px var(--c-accent-soft)}
.rel-node.connected{border-color:var(--c-border)}
.rel-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.rel-svg path{pointer-events:stroke;cursor:pointer}
.rel-label{position:absolute;font-size:var(--ts-xs);background:var(--c-surface);padding:1px 6px;border-radius:var(--radius-sm);border:1px solid var(--c-border);white-space:nowrap;pointer-events:none}

/* Plot Threads */
.plot-section{margin-bottom:24px}
.plot-section-title{font-size:var(--ts-sm);font-weight:600;color:var(--c-text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.plot-card{background:var(--c-panel);border:1px solid var(--c-border);border-radius:var(--radius);padding:12px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:8px}
.plot-card:hover{border-color:var(--c-text-faint)}
.plot-status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.plot-status-dot.planted{background:var(--c-info)}
.plot-status-dot.developing{background:var(--c-warning)}
.plot-status-dot.climax{background:var(--c-danger)}
.plot-status-dot.resolved{background:var(--c-success)}
.plot-status-dot.dormant{background:var(--c-text-faint)}
.stale-warning{font-size:var(--ts-xs);color:var(--c-warning);display:flex;align-items:center;gap:4px}

/* Lore Notebook */
.lore-layout{display:flex;height:100%;overflow:hidden}
.lore-sidebar{width:220px;flex-shrink:0;background:var(--c-surface);border-right:1px solid var(--c-border);overflow-y:auto}
.lore-folder{padding:6px 12px;font-size:var(--ts-xs);cursor:pointer;color:var(--c-text-muted);border-left:3px solid transparent}
.lore-folder:hover{background:var(--c-surface-2)}
.lore-folder.active{background:var(--c-accent-soft);color:var(--c-accent);border-left-color:var(--c-accent)}
.lore-entry-item{padding:4px 12px 4px 24px;font-size:var(--ts-xs);cursor:pointer;color:var(--c-text-muted)}
.lore-entry-item:hover{color:var(--c-text)}
.lore-entry-item.active{color:var(--c-accent)}
.lore-main{flex:1;overflow-y:auto;padding:16px}

/* Mind Map / Story Graph Canvas */
.canvas-container{position:relative;overflow:auto;background:var(--c-surface);background-image:radial-gradient(circle,var(--c-border) 1px,transparent 1px);background-size:20px 20px;-webkit-user-select:none;user-select:none}
/* The inner box is what scrolls, so its size tracks the zoom (set from script);
   the stage inside it is what actually gets scaled. */
.canvas-inner{position:relative;width:2600px;height:1700px}
.canvas-stage{position:absolute;top:0;left:0;width:2600px;height:1700px;transform-origin:0 0}
/* Grab mode turns the whole board into something you drag. Touch scrolling is
   handed over to the pan gesture only while the mode is on, so ordinary page
   and canvas scrolling still work the rest of the time. */
.canvas-container.grab-mode{cursor:grab;touch-action:none}
.canvas-container.grab-mode:active{cursor:grabbing}
.canvas-container.grab-mode .canvas-node{cursor:grab}
.canvas-container.grab-mode:active .canvas-node{cursor:grabbing}
.canvas-node{position:absolute;touch-action:none;background:var(--c-panel);border:2px solid var(--c-border);border-radius:var(--radius);padding:10px 14px;min-width:140px;max-width:220px;cursor:grab;transition:box-shadow var(--transition),border-color var(--transition)}
.canvas-node:hover{border-color:var(--c-accent);box-shadow:var(--shadow-sm)}
.canvas-node.selected{border-color:var(--c-accent);box-shadow:0 0 0 3px var(--c-accent-soft)}
.canvas-node.start-node{border-color:var(--c-accent);box-shadow:0 0 0 2px var(--c-accent-soft)}
.canvas-node:active{cursor:grabbing}
.canvas-node-title{font-size:var(--ts-xs);font-weight:600;margin-bottom:2px}
.canvas-node-preview{font-size:10px;color:var(--c-text-muted);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.canvas-node-badge{display:inline-block;font-size:9px;background:var(--c-surface-2);padding:1px 4px;border-radius:2px;margin-top:4px;color:var(--c-text-faint)}
.canvas-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.canvas-svg path{pointer-events:stroke;cursor:pointer}
.canvas-toolbar{display:flex;align-items:center;gap:4px;padding:6px 12px;background:var(--c-surface);border-bottom:1px solid var(--c-border)}
/* Buttons keep their size and the strip scrolls instead of squeezing them, so a
   narrow screen can still reach every control at full tap size. */
.canvas-toolbar{overflow-x:auto;scrollbar-width:none}
.canvas-toolbar::-webkit-scrollbar{height:0}
.canvas-toolbar .tb-btn{width:30px;height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);color:var(--c-text-muted)}
.canvas-toolbar .tb-btn:hover{background:var(--c-surface-2);color:var(--c-text)}
.canvas-toolbar .tb-btn.active{background:var(--c-accent-soft);color:var(--c-accent)}
.canvas-toolbar .tb-sep{width:1px;height:20px;background:var(--c-border);margin:0 4px;flex:0 0 auto}
.tb-zoom{flex:0 0 auto;min-width:44px;text-align:center;font-size:var(--ts-xs);color:var(--c-text-muted);font-variant-numeric:tabular-nums}

/* Book Preview / Ebook Reader */
.book-reader{display:flex;flex-direction:column;height:100%;background:var(--c-bg)}
.book-reader-toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--c-surface);border-bottom:1px solid var(--c-border);flex-shrink:0}
.book-page-container{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:20px;perspective:1000px}
.book-page{background:var(--book-bg,var(--c-surface));color:var(--book-text,var(--c-text));border-radius:4px;box-shadow:var(--shadow-lg);max-width:600px;width:100%;min-height:70%;padding:48px 40px;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.16,1,.3,1)}
.book-page.flipping{animation:pageFlip .5s cubic-bezier(.16,1,.3,1)}
@keyframes pageFlip{0%{transform:rotateY(0)}50%{transform:rotateY(-90deg)}51%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.book-page h1{font-family:var(--font-display);font-size:var(--ts-xl);margin-bottom:16px}
.book-page h2{font-size:var(--ts-lg);margin:24px 0 12px}
.book-page p{font-size:var(--ts-base);line-height:1.8;margin-bottom:12px}
.book-page p:first-of-type:first-letter{font-size:3em;float:left;line-height:.8;margin-right:6px;font-family:var(--font-display);color:var(--c-accent)}
.book-page-num{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:var(--ts-xs);color:var(--c-text-faint)}
.book-reader[data-book-theme="parchment"]{--book-bg:#F5E6C8;--book-text:#3A2E1C}
.book-reader[data-book-theme="paper"]{--book-bg:#FFFEF8;--book-text:#2A2620}
.book-reader[data-book-theme="night"]{--book-bg:#1A1A1A;--book-text:#C8C8C8}
.book-reader[data-book-theme="sepia"]{--book-bg:#F0DCA8;--book-text:#4A3620}
.book-nav{display:flex;align-items:center;gap:8px;justify-content:center;padding:8px}
.book-cover{background:var(--book-bg,var(--c-accent));color:var(--book-text,var(--c-bg));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.book-cover-title{font-family:var(--font-display);font-size:var(--ts-xl);margin-bottom:8px}
.book-cover-author{font-size:var(--ts-sm);opacity:.8}

/* RPG Playtest */
.playtest-layout{display:flex;height:100%;overflow:hidden}
.playtest-main{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column}
.playtest-passage{font-size:var(--ts-base);line-height:1.8;margin-bottom:20px}
.playtest-choices{display:flex;flex-direction:column;gap:8px}
.playtest-choice{padding:10px 16px;background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:var(--radius);cursor:pointer;font-size:var(--ts-sm)}
.playtest-choice:hover{border-color:var(--c-accent);background:var(--c-accent-soft)}
.playtest-choice.disabled{opacity:.55;cursor:default;text-align:left}
.playtest-choice.disabled:hover{border-color:var(--c-border);background:var(--c-surface-2)}
/* A locked choice states its requirement instead of teasing the reader. */
.playtest-choice-why{display:block;margin-top:3px;font-size:var(--ts-xs);color:var(--c-text-muted);font-style:italic}
.terminal-mode .playtest-choice-why{color:#0a0;font-style:normal}
.checkup-head{font-size:var(--ts-xs);text-transform:uppercase;letter-spacing:.5px;color:var(--c-text-faint);margin:12px 0 4px}
.checkup-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px;border:1px solid var(--c-border);border-left:3px solid var(--c-warning);border-radius:var(--radius-sm);margin-bottom:4px}
.checkup-row.problem{border-left-color:var(--c-danger)}
.checkup-scope{font-size:var(--ts-xs);font-weight:700;min-width:120px}
.checkup-text{font-size:var(--ts-sm);color:var(--c-text-muted);flex:1 1 240px;line-height:1.5}
.playtest-end{border:1px solid var(--c-border);border-left:3px solid var(--c-accent);border-radius:var(--radius);padding:16px;background:var(--c-surface-2)}
.playtest-end.failure{border-left-color:var(--c-danger)}
.playtest-end-kind{font-size:var(--ts-xs);text-transform:uppercase;letter-spacing:.5px;color:var(--c-text-faint)}
.playtest-end-title{font-family:var(--font-display);font-size:var(--ts-lg);font-weight:700;margin:4px 0}
.playtest-end-note{font-size:var(--ts-sm);color:var(--c-text-muted);line-height:1.5}
.playtest-end-stats{font-size:var(--ts-xs);color:var(--c-text-faint);margin-top:8px}
.playtest-end-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.terminal-mode .playtest-end{background:#001200;border-color:#0a0;border-left-color:#0f0}
.terminal-mode .playtest-end.failure{border-left-color:#0a0}
.terminal-mode .playtest-end-title{color:#0f0}
.terminal-mode .playtest-end-kind,.terminal-mode .playtest-end-note,.terminal-mode .playtest-end-stats{color:#0a0}
.playtest-empty{font-size:var(--ts-xs);color:var(--c-text-faint)}
.playtest-bar{height:4px;background:var(--c-surface-2);border-radius:var(--radius-sm);overflow:hidden;margin:1px 0 6px}
.playtest-bar-fill{height:100%;background:var(--c-accent);border-radius:var(--radius-sm)}
.playtest-delta{font-size:var(--ts-xs);margin-right:6px}
.playtest-delta.up{color:var(--c-success)}
.playtest-delta.down{color:var(--c-danger)}
.playtest-equip{margin-left:auto;flex-shrink:0}
.playtest-changes{margin-top:16px;border-top:1px solid var(--c-divider);padding-top:8px}
.playtest-changes-head{font-size:var(--ts-xs);text-transform:uppercase;letter-spacing:.5px;color:var(--c-text-faint);margin-bottom:4px}
.playtest-change{font-size:var(--ts-xs);color:var(--c-text-muted);padding:1px 0}
.playtest-change.up{color:var(--c-success)}
.playtest-change.down{color:var(--c-danger)}
.terminal-mode .playtest-bar{background:#001a00}
.terminal-mode .playtest-bar-fill{background:#0f0}
.terminal-mode .playtest-delta.up,.terminal-mode .playtest-change.up{color:#0f0}
.terminal-mode .playtest-delta.down,.terminal-mode .playtest-change.down{color:#0a0}
.terminal-mode .playtest-changes-head,.terminal-mode .playtest-change{color:#0a0}
.playtest-inspector{width:260px;flex-shrink:0;background:var(--c-surface);border-left:1px solid var(--c-border);overflow-y:auto;padding:16px}
.playtest-inspector h4{font-size:var(--ts-xs);text-transform:uppercase;letter-spacing:.5px;color:var(--c-text-faint);margin-bottom:6px;margin-top:12px}
.playtest-inspector h4:first-child{margin-top:0}
.playtest-stat{display:flex;justify-content:space-between;font-size:var(--ts-xs);padding:2px 0}
.playtest-item{font-size:var(--ts-xs);padding:2px 0;display:flex;align-items:center;gap:4px}
.playtest-terminal{font-family:var(--font-mono);background:#0a0a0a;color:#0F0;padding:24px;min-height:100%}
.playtest-terminal .playtest-passage{white-space:pre-wrap}
.terminal-mode .playtest-inspector{background:#0d0d0d;color:#0F0;font-family:var(--font-mono)}
.terminal-mode .playtest-choice{font-family:var(--font-mono);background:#111;color:#0F0;border-color:#333}

/* Library Shelf */
.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
.book-spine{aspect-ratio:2/3;border-radius:2px 6px 6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 12px;cursor:pointer;transition:transform var(--transition),box-shadow var(--transition);text-align:center;overflow:hidden}
.book-spine:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.book-spine-title{font-family:var(--font-display);font-size:var(--ts-sm);font-weight:700;margin-bottom:4px}
.book-spine-author{font-size:var(--ts-xs);opacity:.7}

/* Stats Tables */
.stats-table{width:100%;border-collapse:collapse}
.stats-table th,.stats-table td{padding:6px 12px;text-align:left;font-size:var(--ts-xs);border-bottom:1px solid var(--c-divider)}
.stats-table th{color:var(--c-text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stats-table input,.stats-table select{font-size:var(--ts-xs);padding:2px 4px;background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-sm);width:100%}

/* Tags */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--ts-xs);padding:2px 8px;border-radius:var(--radius-full);background:var(--c-accent-soft);color:var(--c-accent);margin:2px}
.tag .tag-remove{cursor:pointer;opacity:.6}
.tag .tag-remove:hover{opacity:1}

/* Chips */
.chip{display:inline-flex;align-items:center;padding:4px 10px;font-size:var(--ts-xs);border-radius:var(--radius-full);border:1px solid var(--c-border);background:var(--c-surface-2);cursor:pointer;margin:2px}
.chip.selected{background:var(--c-accent-soft);color:var(--c-accent);border-color:var(--c-accent)}

/* Image Toolbar */
.image-toolbar{position:absolute;background:var(--c-panel);border:1px solid var(--c-border);border-radius:var(--radius);padding:4px;display:flex;gap:4px;box-shadow:var(--shadow-md);z-index:10}
.image-toolbar button{padding:4px 8px;font-size:var(--ts-xs);border-radius:var(--radius-sm)}
.image-toolbar button:hover{background:var(--c-surface-2)}

/* Activity List */
.activity-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:var(--ts-xs);color:var(--c-text-muted);border-bottom:1px solid var(--c-divider)}
.activity-item:last-child{border-bottom:none}
.activity-time{margin-left:auto;color:var(--c-text-faint)}

/* Quick Links */
.quick-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.quick-link{padding:12px;background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:var(--radius);text-align:center;font-size:var(--ts-sm);cursor:pointer;transition:transform var(--transition)}
.quick-link:hover{border-color:var(--c-accent);transform:translateY(-1px)}

/* Scrollbar Styling */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--c-surface)}
::-webkit-scrollbar-thumb{background:var(--c-border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--c-text-faint)}

/* Responsive */
@media(max-width:768px){
  .sidebar{position:absolute;height:100%;z-index:20;transition:transform var(--transition)}
  .sidebar.collapsed{transform:translateX(-100%);width:var(--sidebar-w)}
  .chapter-list,.lore-sidebar,.workspace-sidebar{width:160px}
  .playtest-inspector{width:200px}
  .editor-surface{padding:16px}
  .content{padding:16px}
}

/* Dashboard grid ------------------------------------------------------------
   Two columns on anything roomy, one column on phones. Card width is a saved
   preference, but on a narrow screen every card spans the single column: a
   half-width card there would be a column of unreadable slivers. */
.dashboard{max-width:1180px;margin:0 auto}
.dash-bar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-bottom:16px
}
.dash-bar-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.dash-bar-text strong{font-family:var(--font-display);font-size:var(--ts-xl);font-weight:600;color:var(--c-text)}
.dash-bar-text span{font-size:var(--ts-xs);color:var(--c-text-muted)}
.dash-bar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.dash-cell{
  grid-column:span 1;
  background:var(--c-surface);
  border:1px solid var(--c-border);
  border-radius:var(--radius-lg);
  padding:20px;
  min-width:0;
  overflow:hidden
}
.dash-cell.full{grid-column:1 / -1}
.dash-cell.tall .dash-card-body{min-height:280px;display:flex;flex-direction:column;justify-content:flex-start}
.dash-card-body{min-width:0}
.dash-card-placeholder{
  font-size:var(--ts-sm);color:var(--c-text-faint);font-style:italic;
  padding:16px;text-align:center;
  border:1px dashed var(--c-border);border-radius:var(--radius)
}
.dash-card-head{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.dash-card-title{
  font-family:var(--font-display);font-size:var(--ts-base);font-weight:600;
  color:var(--c-text);margin:0;letter-spacing:.2px
}

/* Organize mode. Every affordance lives inside .organizing, so the moment the
   mode is off there is nothing left on the page to click by accident. */
.dashboard.organizing .dash-cell{
  border-color:color-mix(in oklab,var(--c-accent) 45%,var(--c-border));
  box-shadow:0 0 0 1px color-mix(in oklab,var(--c-accent) 20%,transparent)
}
.dash-card-organize{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin:-6px -6px 14px;padding:6px 8px;
  background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:var(--radius)
}
.dash-card-name{
  font-size:var(--ts-xs);font-weight:600;text-transform:uppercase;letter-spacing:.6px;
  color:var(--c-text-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.dash-card-tools{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.dash-tool{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;padding:0;
  background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-sm);
  color:var(--c-text-muted);cursor:pointer;transition:var(--transition)
}
.dash-tool svg{width:14px;height:14px}
.dash-tool.text{width:auto;padding:0 9px;font-size:var(--ts-xs);font-weight:600;letter-spacing:.3px}
.dash-tool:hover:not(:disabled){color:var(--c-text);border-color:var(--c-accent)}
.dash-tool:disabled{opacity:.35;cursor:default}
.dash-tool.active{background:var(--c-accent-soft);border-color:var(--c-accent);color:var(--c-accent)}
.dash-tool:focus-visible{outline:2px solid var(--c-accent);outline-offset:1px}
.dash-tool-sep{width:1px;height:18px;background:var(--c-divider);margin:0 2px}
/* While organizing, the organize header already names the card, so the card's
   own title or eyebrow would read as the same words twice in a row. */
.dashboard.organizing .dash-eyebrow,
.dashboard.organizing .dash-card-head{display:none}

.dash-hidden-tray{
  margin-top:20px;padding:16px;
  background:var(--c-surface-2);border:1px dashed var(--c-border);border-radius:var(--radius-lg)
}
.dash-hidden-title{
  font-size:var(--ts-xs);font-weight:600;text-transform:uppercase;letter-spacing:.6px;
  color:var(--c-text-muted);margin-bottom:10px
}
.dash-hidden-empty{font-size:var(--ts-sm);color:var(--c-text-faint);margin:0}
.dash-hidden-list{display:flex;flex-wrap:wrap;gap:8px}
.dash-hidden-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;font-size:var(--ts-sm);
  background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius-full);
  color:var(--c-text);cursor:pointer;transition:var(--transition)
}
.dash-hidden-chip svg{width:13px;height:13px;color:var(--c-accent)}
.dash-hidden-chip:hover{border-color:var(--c-accent);background:var(--c-accent-soft)}
.dash-hidden-chip:focus-visible{outline:2px solid var(--c-accent);outline-offset:1px}

/* Continue writing */
.dash-continue{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.dash-continue-info{min-width:0;display:flex;flex-direction:column;gap:6px}
.dash-eyebrow{
  font-size:var(--ts-xs);font-weight:600;text-transform:uppercase;letter-spacing:.7px;
  color:var(--c-accent)
}
.dash-continue-name{
  font-family:var(--font-display);font-size:var(--ts-xl);font-weight:600;color:var(--c-text);
  overflow-wrap:anywhere
}
.dash-badges{display:flex;flex-wrap:wrap;gap:6px}

/* Stat rows and streak */
.stat-rows{display:flex;flex-direction:column}
.stat-row{
  display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:9px 0;border-bottom:1px solid var(--c-divider)
}
.stat-row:last-child{border-bottom:none}
.stat-row-label{font-size:var(--ts-sm);color:var(--c-text-muted)}
.stat-row-value{
  font-family:var(--font-mono);font-size:var(--ts-base);color:var(--c-text);
  font-variant-numeric:tabular-nums
}
.stat-row.strong .stat-row-label{color:var(--c-text);font-weight:600}
.stat-row.strong .stat-row-value{font-size:var(--ts-lg);font-weight:600;color:var(--c-accent)}

.streak-block{display:flex;align-items:center;gap:16px}
.streak-flame{width:44px;height:44px;flex-shrink:0;color:var(--c-text-faint)}
.streak-block.lit .streak-flame{color:var(--c-warning)}
.streak-text{min-width:0}
.streak-num{
  font-family:var(--font-display);font-size:var(--ts-xl);font-weight:700;color:var(--c-text);
  display:flex;align-items:baseline;gap:6px
}
.streak-unit{font-family:var(--font-body);font-size:var(--ts-sm);font-weight:500;color:var(--c-text-muted)}
.streak-note{font-size:var(--ts-xs);color:var(--c-text-muted);margin-top:2px}
.streak-best{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--c-divider);
  font-size:var(--ts-xs);color:var(--c-text-faint)
}
.split-bar{
  display:flex;height:6px;margin-top:14px;overflow:hidden;
  background:var(--c-surface-2);border-radius:var(--radius-full)
}
.split-fill{display:block;height:100%;background:var(--c-accent);border-radius:var(--radius-full)}
.split-note{margin:8px 0 0;font-size:var(--ts-xs);color:var(--c-text-muted)}

/* Project goals */
.pg-empty{margin:0;font-size:var(--ts-sm);color:var(--c-text-muted)}
.pg-list{display:flex;flex-direction:column;gap:12px}
.pg-row{
  padding:14px;border:1px solid var(--c-border);border-radius:var(--radius);
  background:var(--c-surface-2)
}
.pg-row.done{border-color:var(--c-success)}
.pg-row.overdue{border-color:var(--c-warning)}
.pg-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pg-name{
  padding:0;border:none;background:none;cursor:pointer;text-align:left;
  font-family:var(--font-display);font-size:var(--ts-base);font-weight:600;
  color:var(--c-text);transition:var(--transition)
}
.pg-name:hover{color:var(--c-accent)}
.pg-name:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px;border-radius:var(--radius-sm)}
.pg-fields{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.pg-field{display:flex;flex-direction:column;gap:4px}
.pg-field-label{
  font-size:var(--ts-xs);color:var(--c-text-faint);
  text-transform:uppercase;letter-spacing:.5px
}
.pg-input{
  padding:6px 8px;width:132px;
  background:var(--c-panel);border:1px solid var(--c-border);border-radius:var(--radius-sm);
  color:var(--c-text);font-family:var(--font-mono);font-size:var(--ts-xs);
  font-variant-numeric:tabular-nums
}
/* Date fields need room for the browser's own calendar button on top of the
   full date, which a shared width leaves no space for. */
.pg-input[type="date"]{width:168px}
.pg-input:focus{outline:none;border-color:var(--c-accent)}
.pg-hint{margin:0;font-size:var(--ts-xs);color:var(--c-text-muted)}
.pg-facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px}
.pg-fact{font-size:var(--ts-xs);color:var(--c-text-muted);font-variant-numeric:tabular-nums}
.pg-fact strong{color:var(--c-text);font-family:var(--font-mono);font-weight:600}
.pg-done-group{margin-top:16px;padding-top:14px;border-top:1px solid var(--c-divider)}
.pg-group-title{
  display:flex;align-items:center;gap:6px;margin-bottom:10px;
  font-size:var(--ts-xs);color:var(--c-text-faint);
  text-transform:uppercase;letter-spacing:.5px
}
.pg-count{
  padding:1px 7px;border-radius:var(--radius-full);
  background:var(--c-accent-soft);color:var(--c-accent);
  font-family:var(--font-mono);letter-spacing:0
}

/* Charts ------------------------------------------------------------------
   The bar graph and heatmap are inline SVG, so they inherit theme tokens the
   same way the rest of the interface does. No colour is written literally here. */
.chart-controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chart-range{
  padding:5px 11px;font-size:var(--ts-xs);font-weight:600;
  background:var(--c-surface-2);border:1px solid var(--c-border);border-radius:var(--radius-full);
  color:var(--c-text-muted);cursor:pointer;transition:var(--transition)
}
.chart-range:hover{color:var(--c-text);border-color:var(--c-accent)}
.chart-range.active{background:var(--c-accent-soft);border-color:var(--c-accent);color:var(--c-accent)}
.chart-range:focus-visible{outline:2px solid var(--c-accent);outline-offset:1px}

.chart-summary{display:flex;flex-wrap:wrap;gap:24px;margin-bottom:12px}
.chart-stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.chart-stat-num{
  font-family:var(--font-mono);font-size:var(--ts-lg);font-weight:600;color:var(--c-text);
  font-variant-numeric:tabular-nums;line-height:1.1
}
.chart-stat-label{
  font-size:var(--ts-xs);color:var(--c-text-muted);
  text-transform:uppercase;letter-spacing:.5px
}

.chart-readout{
  font-size:var(--ts-xs);color:var(--c-text-muted);
  min-height:1.4em;margin-bottom:8px;
  font-variant-numeric:tabular-nums
}
.chart-svg{display:block;width:100%;height:auto;overflow:visible}
/* The heatmap has a fixed grid of squares, so it is capped rather than stretched
   across a wide card, which would blow the squares and labels up with it. */
.heatmap-svg{display:block;width:100%;max-width:440px;height:auto;overflow:visible}
.chart-grid{stroke:var(--c-divider);stroke-width:1}
.chart-baseline{stroke:var(--c-border);stroke-width:1.5}
.chart-axis-label{fill:var(--c-text-faint);font-size:11px;font-family:var(--font-body)}
.chart-value{
  fill:var(--c-text-muted);font-size:11px;font-family:var(--font-mono);
  font-variant-numeric:tabular-nums
}
.chart-bar{fill:var(--c-accent);transition:fill .15s ease}
.chart-hit{fill:transparent}
.chart-bar-group{cursor:default}
.chart-bar-group:focus{outline:none}
.chart-bar-group.active .chart-bar,
.chart-bar-group:focus-visible .chart-bar{fill:var(--c-accent-hover)}
.chart-bar-group.active .chart-value{fill:var(--c-text)}

.chart-empty{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:28px 16px;text-align:center;
  border:1px dashed var(--c-border);border-radius:var(--radius)
}
.chart-empty svg{width:28px;height:28px;color:var(--c-text-faint)}
.chart-empty p{margin:0;font-size:var(--ts-sm);color:var(--c-text-muted);max-width:38ch}

/* Heatmap intensity is the accent colour at graded opacity, so every theme gets
   a matching ramp for free. */
.heat-cell,.heat-swatch{fill:var(--c-accent);background:var(--c-accent)}
.heat-0{fill:var(--c-surface-2);background:var(--c-surface-2)}
.heat-1{opacity:.28}
.heat-2{opacity:.5}
.heat-3{opacity:.74}
.heat-4{opacity:1}
.heat-group{cursor:default}
.heat-group:focus{outline:none}
.heat-group.active .heat-cell,
.heat-group:focus-visible .heat-cell{stroke:var(--c-text);stroke-width:1.5}
.heat-legend{display:flex;align-items:center;gap:5px;margin-top:12px}
.heat-legend-label{font-size:var(--ts-xs);color:var(--c-text-faint)}
.heat-swatch{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Goals */
.goal-list{display:flex;flex-direction:column;gap:14px}
.goal-row-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.goal-label{
  display:flex;align-items:baseline;gap:8px;min-width:0;
  font-size:var(--ts-sm);font-weight:600;color:var(--c-text)
}
.goal-period{
  font-size:var(--ts-xs);font-weight:400;color:var(--c-text-faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.goal-row.met .goal-pct{color:var(--c-success)}
.goal-numbers{
  display:flex;align-items:center;gap:6px;
  font-family:var(--font-mono);font-size:var(--ts-xs);color:var(--c-text-muted);
  font-variant-numeric:tabular-nums
}
.goal-current{color:var(--c-text)}
.goal-sep{color:var(--c-text-faint)}
.goal-target{
  /* Wide enough for a six-figure yearly target without clipping the last digit. */
  width:92px;background:var(--c-surface-2);border:1px solid var(--c-border);
  border-radius:var(--radius-sm);padding:3px 6px;
  font-family:var(--font-mono);font-size:var(--ts-xs);color:var(--c-text);text-align:right
}
.goal-target:focus{outline:none;border-color:var(--c-accent);box-shadow:0 0 0 2px var(--c-accent-soft)}
.goal-pct{min-width:38px;text-align:right;color:var(--c-accent);font-weight:600}

/* The profile card predates the dashboard grid and carries its own surface,
   border and bottom margin. Inside a grid cell that would read as a box in a
   box, so it flattens and lets the cell provide the chrome. */
.dash-cell .dashboard-profile-card,
:root[data-theme] .dash-cell .dashboard-profile-card{
  background:none;border:none;border-radius:0;padding:0;margin-bottom:0
}

/* Dashboard Profile Card */
.dashboard-profile-card{
  background:var(--c-surface-2);
  border:1px solid var(--c-border);
  border-radius:var(--radius-lg);
  padding:24px;
  margin-bottom:20px;
  overflow:hidden
}
:root[data-theme] .dashboard-profile-card{
  background:linear-gradient(135deg,color-mix(in oklab,var(--c-accent) 8%,var(--c-surface-2)),var(--c-surface-2));
  border-color:color-mix(in oklab,var(--c-accent) 20%,var(--c-border))
}
.profile-avatar{
  width:80px;height:80px;flex-shrink:0;
  border-radius:50%;
  background:var(--c-accent-soft);
  border:2px solid var(--c-accent);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:700;color:var(--c-accent);
  overflow:hidden
}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-name{
  font-family:var(--font-display);
  font-size:var(--ts-xl);font-weight:700;
  margin-bottom:4px;
  line-height:1.2
}
:root[data-theme] .profile-name{
  background:linear-gradient(135deg,var(--c-brand-1),var(--c-brand-2),var(--c-brand-3));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent
}
.profile-bio{
  font-size:var(--ts-sm);
  color:var(--c-text-muted);
  line-height:1.6;
  max-width:500px
}
.profile-card-stats{
  display:flex;gap:24px;
  margin-top:16px;padding-top:16px;
  border-top:1px solid var(--c-divider)
}
.profile-stat{display:flex;flex-direction:column;gap:2px}
.profile-stat-num{font-size:var(--ts-lg);font-weight:700;color:var(--c-accent)}
.profile-stat-label{font-size:var(--ts-xs);color:var(--c-text-muted);text-transform:uppercase}

/* Author Avatar Preview (Settings) */
.author-avatar-preview{
  width:64px;height:64px;flex-shrink:0;
  border-radius:50%;
  background:var(--c-accent-soft);
  border:2px solid var(--c-accent);
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;color:var(--c-accent);
  overflow:hidden
}
.author-avatar-preview img{width:100%;height:100%;object-fit:cover}

/* Dashboard Section Wrappers */
.dashboard-section-wrapper{
  border-radius:var(--radius-lg);
  overflow:hidden
}

/* Illustrations Gallery */
.illustration-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:12px
}
.illustration-card{
  background:var(--c-surface-2);
  border:1px solid var(--c-border);
  border-radius:var(--radius);
  overflow:hidden;
  transition:border-color var(--transition)
}
.illustration-card:hover{border-color:var(--c-accent)}
.illustration-thumb{
  width:100%;height:150px;
  background:var(--c-surface);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden
}
.illustration-thumb img{width:100%;height:100%;object-fit:cover}
.illustration-placeholder{color:var(--c-text-faint);font-size:var(--ts-xs)}
.illustration-info{padding:8px}
.illustration-name-input{font-size:var(--ts-xs)!important;padding:4px 6px!important;margin-bottom:4px}

/* Chapter Illustrations Strip */
.chapter-illustrations-strip{
  padding:8px 16px;
  border-bottom:1px solid var(--c-divider);
  background:var(--c-surface)
}
.chapter-ill-thumb{
  position:relative;
  width:60px;height:60px;
  border-radius:var(--radius-sm);
  overflow:hidden;
  border:1px solid var(--c-border)
}
.chapter-ill-thumb img{width:100%;height:100%;object-fit:cover}
.chapter-ill-remove{
  position:absolute;top:0;right:0;
  background:rgba(0,0,0,0.6);
  color:#fff;
  border:none;
  cursor:pointer;
  font-size:12px;
  line-height:1;
  padding:2px 4px;
  border-radius:0 0 0 4px
}
.chapter-ill-remove:hover{background:rgba(220,53,69,0.85)}

/* Book Preview Cover Image */
.book-cover-image{
  width:100%;
  max-height:400px;
  overflow:hidden;
  border-radius:var(--radius);
  margin-bottom:16px
}
.book-cover-image img{width:100%;object-fit:cover}
.book-cover-controls{
  padding:20px
}
.cover-preview-box{
  width:100%;max-width:300px;
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--c-border)
}
.cover-preview-box img{width:100%}
.cover-preview-box.empty{
  height:180px;
  display:flex;align-items:center;justify-content:center;
  background:var(--c-surface);
  color:var(--c-text-faint);
  font-size:var(--ts-sm)
}

/* Chapter Illustration in Book Preview */
.chapter-illustration{
  text-align:center;
  margin:16px 0
}
.chapter-illustration img{
  max-width:100%;
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg)
}
.chapter-illustration-caption{
  font-size:var(--ts-xs);
  color:var(--c-text-muted);
  margin-top:4px;
  font-style:italic
}

/* Item Images */
.item-image-cell{
  display:flex;align-items:center;gap:6px
}
.item-thumb{
  width:36px;height:36px;
  border-radius:var(--radius-sm);
  object-fit:cover;
  border:1px solid var(--c-border)
}
.item-thumb-placeholder{
  width:36px;height:36px;
  border-radius:var(--radius-sm);
  border:1px dashed var(--c-border);
  display:flex;align-items:center;justify-content:center;
  color:var(--c-text-faint);
  font-size:var(--ts-xs)
}

/* Scene Illustration Thumbnails */
.scene-ill-thumb{
  position:relative;
  width:80px;height:80px;
  border-radius:var(--radius-sm);
  overflow:hidden;
  border:1px solid var(--c-border)
}
.scene-ill-thumb img{width:100%;height:100%;object-fit:cover}

/* Playthrough Scene Images */
.playtest-scene-image{
  text-align:center;
  margin-bottom:12px
}
.playtest-scene-image img{
  max-width:100%;
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg)
}

/* Playthrough Item Thumbnails */
.playtest-item{
  display:flex;align-items:center;gap:6px
}
.playtest-item-thumb{
  width:24px;height:24px;
  border-radius:var(--radius-sm);
  object-fit:cover;
  border:1px solid var(--c-border)
}

/* --- Export groups ---
   Shared by the Export tool tabs and the Export Project dialog, which all build
   their markup from the same export registry. */
.export-group{margin-bottom:12px}
.export-group-title{font-weight:600;margin-bottom:6px}
.export-group-note{font-size:var(--ts-sm);color:var(--c-text-muted);line-height:1.55;margin-bottom:10px}
.export-group-select{margin-bottom:8px}
.export-group-actions{display:flex;gap:8px;flex-wrap:wrap}
.export-intro{color:var(--c-text-muted);font-size:var(--ts-sm);line-height:1.6;margin-bottom:16px}
/* Inside the dialog the groups are the whole body, so drop the trailing gap. */
.export-groups .export-group:last-child{margin-bottom:0}

/* ============================================
   ADAPTIVE LAYOUT & DENSITY
   One source of truth for how the app reflows across window sizes,
   resolutions, pixel densities and input types. Everything below is additive:
   it overrides the fixed panel widths defined earlier in this file.
   Buckets (also mirrored on <html data-viewport>):
     compact  < 760px    phones, tiny windows
     snug     760-1049   large phones landscape, small tablets, half-screen windows
     medium   1050-1599  laptops, 1080p windows
     wide     >= 1600px  1440p / 4K monitors, maximised windows
   ============================================ */

/* --- Fluid shell + panel widths (no breakpoint jumps) --- */
:root{
  --sidebar-w:clamp(190px,15vw,260px);
  --sidebar-w-collapsed:clamp(46px,4vw,56px);
  --topbar-h:clamp(46px,3.2rem,60px);
  --panel-nav-w:clamp(168px,14vw,232px);
  --panel-list-w:clamp(180px,15vw,268px);
  --panel-aside-w:clamp(200px,18vw,300px);
  --gutter:clamp(12px,1.6vw,28px);
  --tap:44px;
  /* Safe-area insets: 0 everywhere except notched phones / installed PWAs. */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
}

.content{padding:var(--gutter)}
.workspace-sidebar{width:var(--panel-nav-w)}
.chapter-list,.lore-sidebar{width:var(--panel-list-w)}
.playtest-inspector{width:var(--panel-aside-w)}
.editor-surface{padding:clamp(14px,1.6vw,28px) clamp(16px,4vw,64px)}
/* Long titles in list rows wrap instead of being squeezed to nothing. */
.chapter-item,.lore-entry-item,.ws-nav-item{min-width:0}
.chapter-item > span,.lore-entry-item > span{min-width:0;overflow-wrap:anywhere}

/* Very wide displays: cap measure so text isn't a single 3000px line, and let
   the reading/editing column breathe instead of stretching edge to edge. */
@media (min-width:1600px){
  .content{padding:clamp(24px,2vw,48px) clamp(24px,4vw,96px)}
  .editor-surface .content-editable{max-width:78ch;margin:0 auto}
  .book-page p,.playtest-passage{max-width:72ch}
}
@media (min-width:2400px){
  .content{max-width:2200px;margin:0 auto;width:100%}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .char-grid,.illustration-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
}

/* --- Off-canvas navigation drawer (snug + compact) --- */
.nav-scrim{display:none}
@media (max-width:1049px){
  .sidebar{position:absolute;top:0;bottom:0;left:0;height:100%;z-index:40;
    box-shadow:var(--shadow-lg);transition:transform var(--transition),width var(--transition)}
  .sidebar:not(.collapsed){width:min(300px,82vw);transform:translateX(0)}
  .sidebar.collapsed{width:min(300px,82vw);transform:translateX(-100%);box-shadow:none}
  /* Keep labels readable while the drawer is open. */
  .sidebar.collapsed .sidebar-logo span,.sidebar.collapsed .sidebar-nav .nav-label{display:inline}
  .sidebar.collapsed .nav-item{justify-content:flex-start;padding:9px 16px}
  .nav-scrim{display:block;position:absolute;inset:0;z-index:30;
    background:rgba(0,0,0,.45);backdrop-filter:blur(1px);opacity:0;pointer-events:none;
    transition:opacity var(--transition)}
  .sidebar:not(.collapsed) ~ .nav-scrim{opacity:1;pointer-events:auto}
  .workspace-sidebar{width:clamp(150px,20vw,190px)}
  .chapter-list,.lore-sidebar{width:clamp(150px,22vw,200px)}
  /* Right-hand inspectors float over the editor rather than crushing it. */
  .playtest-inspector{position:absolute;right:0;top:0;bottom:0;z-index:25;width:min(300px,70vw)}
  .playtest-layout,.manuscript-layout{position:relative}
}

/* --- Compact: phones and very small windows --- */
@media (max-width:759px){
  .theme-grid{grid-template-columns:1fr}
  .theme-option{min-height:var(--tap)}
  :root{--gutter:12px;--topbar-h:52px}
  .topbar{padding:0 8px;padding-left:calc(8px + var(--safe-l));padding-right:calc(8px + var(--safe-r));gap:4px}
  .topbar-title{font-size:var(--ts-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .save-status span{display:none}
  .search-box{max-width:40vw}
  .content{padding:12px;padding-bottom:calc(12px + var(--safe-b))}
  /* Secondary panels become full-width drawers or stack out of the way. */
  .manuscript-layout,.lore-layout,.playtest-layout,.workspace-layout{flex-direction:column}
  .chapter-list,.lore-sidebar,.workspace-sidebar{width:100%;max-height:38vh;
    border-right:none;border-bottom:1px solid var(--c-border)}
  .playtest-inspector{position:static;width:100%;max-height:40vh;border-left:none;border-top:1px solid var(--c-border)}
  .editor-surface{padding:14px 16px}
  .card-grid,.char-grid,.illustration-grid,.library-grid,.quick-links{grid-template-columns:1fr}
  .card{padding:12px;border-radius:var(--radius)}
  .modal-backdrop{padding:12px;padding-bottom:calc(12px + var(--safe-b))}
  .modal{padding:16px;max-height:86dvh}
  .toast{max-width:calc(100vw - 24px)}
  .profile-card-stats{flex-wrap:wrap;gap:12px}
  .dashboard-profile-card{padding:16px}
  /* One column on phones: a saved half-width preference is ignored here rather
     than producing two unreadable slivers. The preference is not overwritten,
     so the wider layout returns on a larger screen. */
  .dash-grid{grid-template-columns:minmax(0,1fr);gap:12px}
  .dash-cell,.dash-cell.half,.dash-cell.full{grid-column:1 / -1}
  /* Paired with the narrower phone viewBox in the chart renderer: both together
     land the labels near the same rendered size as on a desktop card. */
  .chart-axis-label,.chart-value{font-size:14px}
  .chart-summary{gap:18px}
  .dash-cell{padding:16px;border-radius:var(--radius)}
  .dash-cell.tall .dash-card-body{min-height:0}
  .dash-bar{align-items:flex-start}
  .dash-bar-actions{width:100%}
  .dash-bar-actions .btn{flex:1}
  .dash-card-organize{margin:-4px -4px 12px;gap:8px}
  .dash-card-tools{width:100%;justify-content:flex-start}
  .dash-continue{gap:14px}
  .dash-continue .btn{width:100%}
  .book-page p:first-of-type:first-letter{font-size:2.2em}
  .stats-table{display:block;overflow-x:auto}
}

/* Two-column card grids on mid-size phones/tablets before the 1-column drop. */
@media (min-width:560px) and (max-width:759px){
  .card-grid,.char-grid,.illustration-grid,.library-grid{grid-template-columns:repeat(2,1fr)}
}

/* --- Short viewports (landscape phones, split windows) --- */
@media (max-height:560px){
  :root{--topbar-h:44px}
  .editor-surface{padding-top:8px;padding-bottom:8px}
  .chapter-list,.lore-sidebar,.workspace-sidebar{max-height:none}
  .modal{max-height:92dvh}
}

/* --- Touch / coarse pointer: bigger targets, no accidental iOS zoom --- */
@media (hover:none) and (pointer:coarse){
  .nav-item,.ws-nav-item,.chapter-item,.lore-entry-item,.lore-folder,.playtest-choice{min-height:var(--tap);align-items:center}
  .info-icon,.topbar-btn,.switch,.editor-toolbar .tb-btn,.canvas-toolbar .tb-btn{width:var(--tap);height:var(--tap)}
  .switch .track{width:44px;height:26px;inset:auto;top:50%;left:50%;transform:translate(-50%,-50%)}
  .btn{padding:10px 16px;min-height:var(--tap)}
  .btn.sm{padding:8px 12px;min-height:var(--tap)}
  .btn.icon,.btn.icon.sm{min-width:var(--tap);min-height:var(--tap)}
  .menu-trigger{min-width:var(--tap);min-height:var(--tap)}
  .menu-item{min-height:var(--tap)}
  /* Organize mode has to be usable with a thumb, so its small icon buttons grow
     to the same tap floor as everything else on a touch device. */
  .dash-tool{min-width:var(--tap);min-height:var(--tap);width:auto;height:auto;padding:0 8px}
  .dash-tool.text{padding:0 14px}
  .dash-tool svg{width:16px;height:16px}
  .dash-hidden-chip{min-height:var(--tap)}
  .chart-range{min-height:var(--tap);padding:0 16px}
  .heat-legend-label{font-size:var(--ts-sm)}
  .goal-target{min-height:var(--tap);font-size:16px;width:88px}
  .pg-input,.pg-input[type="date"]{min-height:var(--tap);font-size:16px;width:100%}
  .pg-field{flex:1 1 140px}
  .pg-name{min-height:var(--tap);display:flex;align-items:center}
  .workspace-topbar .form-select{min-height:var(--tap);font-size:16px}
  /* 16px minimum prevents Safari/Chrome from zooming when a field is focused. */
  .form-input,.form-textarea,.form-select,.search-box input{font-size:max(16px,var(--ts-sm))}
  input,textarea,select{font-size:16px!important}
  .editor-toolbar select{font-size:16px}
  .stats-table input,.stats-table select{min-height:var(--tap);font-size:16px}
  input[data-goal]{min-height:var(--tap);font-size:16px!important}
  .chapter-ill-remove{width:var(--tap);height:var(--tap);padding:0;background:transparent;font-size:16px}
  .chip{min-height:var(--tap);margin:4px}
  .editor-surface,.content,.chapter-list-items{-webkit-overflow-scrolling:touch}
  .card.hoverable:hover{transform:none;box-shadow:none}
  ::-webkit-scrollbar{width:10px;height:10px}
}

/* --- Notch / installed-app safe areas --- */
@supports (padding:env(safe-area-inset-left)){
  .sidebar{padding-left:var(--safe-l)}
  .topbar{padding-top:var(--safe-t)}
  .editor-footer,.word-count-floating{padding-bottom:calc(4px + var(--safe-b))}
}

/* --- HiDPI: keep 1px borders visually 1px, not 2-3 device px --- */
@media (-webkit-min-device-pixel-ratio:2),(min-resolution:192dpi){
  .card,.modal,.form-input,.form-textarea,.form-select,.btn,.badge{border-width:.5px}
  html[data-dpr="high"] .sidebar{border-right-width:.5px}
}

/* --- Print / PDF export --- */
@media print{
  .sidebar,.topbar,.chapter-list,.workspace-sidebar,.lore-sidebar,.editor-toolbar,
  .editor-footer,.toast-container,.nav-scrim{display:none!important}
  #app,.main,.content,.editor-surface{height:auto!important;overflow:visible!important;display:block!important}
  body{overflow:visible}
}

/* --- Brand mark legibility ---
   logo.png is white line-art, so it disappears on the light themes; recolour it
   to the theme's accent instead of shipping a second bitmap. */
:root[data-theme="light"] .sidebar-logo img,
:root[data-theme="fantasy-light"] .sidebar-logo img,
:root[data-theme="sakura"] .sidebar-logo img,
:root[data-theme="moss"] .sidebar-logo img{
  filter:brightness(0) saturate(100%) drop-shadow(0 0 1px rgba(0,0,0,.15))
}

/* Dashboard profile header: on phones the avatar + action button squeeze the
   bio into a sliver, so stack the three parts instead. */
@media (max-width:559px){
  .profile-card-header{flex-direction:column!important;align-items:center!important;text-align:center;gap:12px!important}
  .profile-bio{max-width:none}
  .profile-card-stats{justify-content:space-around;text-align:center}
  .profile-stat{align-items:center}
}

/* --- Workspace shell on small viewports ---
   The project workspace is a second nested shell (tool rail + topbar + panel
   layouts). On phones the tool rail becomes a horizontal, scrollable strip so
   the actual editor keeps the full width instead of being reduced to a sliver. */
@media (max-width:759px){
  .workspace{flex-direction:column}
  .workspace-sidebar{
    width:100%;max-height:none;flex-direction:row;flex-wrap:nowrap;align-items:center;
    overflow-x:auto;overflow-y:hidden;flex-shrink:0;
    border-right:none;border-bottom:1px solid var(--c-border);
    scrollbar-width:thin
  }
  .workspace-sidebar > div[style*="border-bottom"]{border-bottom:none!important;flex-shrink:0}
  .ws-nav-group-label{display:none}
  .ws-nav-item{
    border-left:none;border-bottom:3px solid transparent;
    padding:10px 12px;flex-shrink:0
  }
  .ws-nav-item.active{border-left-color:transparent;border-bottom-color:var(--c-accent)}
  .workspace-topbar{height:auto;min-height:var(--topbar-h);flex-wrap:wrap;padding:6px 8px;row-gap:6px}
  .workspace-topbar #projNameInput{flex:1 1 55%;min-width:0}
  .workspace-main{padding:12px}
  /* Nested layouts stack; each panel scrolls on its own instead of relying on
     a fixed calc() height that no longer matches the wrapped topbar. */
  .manuscript-layout,.lore-layout,.playtest-layout{height:auto!important;min-height:0;flex:1}
  .editor-area{min-height:55vh}
  .canvas-container{height:60vh!important}
}

/* Snug windows keep the vertical rail but tighter, and a wrapping topbar. */
@media (min-width:760px) and (max-width:1049px){
  .workspace-topbar{flex-wrap:wrap;height:auto;min-height:var(--topbar-h);row-gap:4px;padding:4px 8px}
  .ws-nav-item{padding:7px 10px}
}

/* Wide data tables (stats, items, inventory) stay tabular on phones and get a
   horizontal scroll instead of pushing the page sideways. */
@media (max-width:759px){
  .workspace-main{overflow-x:auto}
  .workspace-main table,.content table{min-width:min-content}
  .stats-table{display:table;overflow:visible}
}

/* The project workspace is a full-height shell rendered inside .content, so it
   must not inherit the reading-width cap, centring or gutters that the
   dashboard-style views use — otherwise it floats in the middle of a 4K screen. */
.content:has(.workspace){padding:0;max-width:none;margin:0;overflow:hidden}
.content:has(.workspace) > .workspace{height:100%}


/* ============================================================================
   MOBILE LAYOUT
   ----------------------------------------------------------------------------
   Everything above this point describes the desktop shell and then shrinks it.
   A phone is not a small desktop, so below 760px the app switches to a
   purpose-built layout instead:

     * primary navigation moves from a hidden left drawer to a fixed
       bottom tab bar, always visible and inside thumb reach;
     * hover-only affordances (tooltips) are removed outright, because on touch
       they latch open and float on top of the controls they describe;
     * the type scale, tap targets and spacing are set for a hand-held screen
       rather than being derived from the desktop values;
     * modals become bottom sheets, side panels become stacked sections, and
       the writing surface always keeps the majority of the screen.
   ========================================================================== */

:root{ --tabbar-h:58px; }

/* Hidden by default — this is a phone-only control. */
.mobile-tabbar{display:none}

/* ==========================================================================
   COMPACT / PHONE
   ========================================================================== */
@media (max-width:759px){

  /* --- Tokens tuned for a hand-held screen ------------------------------- */
  :root{
    --gutter:16px;
    --topbar-h:56px;
    --tap:48px;
    /* Fixed sizes, not viewport-derived clamps: on a 390px screen the desktop
       clamps collapse to their minimums and everything reads as cramped. */
    --ts-xs:.8125rem;
    --ts-sm:.9375rem;
    --ts-base:1.0625rem;
    --ts-lg:1.1875rem;
    --ts-xl:1.4375rem;
    --radius:10px;
    --radius-lg:16px;
  }
  body{font-size:var(--ts-base);line-height:1.6}

  /* Info icons get a genuine finger-sized hit area on a phone (the visible
     glyph stays small, but the tappable square grows to meet --tap). */
